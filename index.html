function downloadKuaiqi7PrelimComposite(){
  const img = new Image();
  img.onload = function(){
    /* 為了方便直接在LINE等通訊軟體上分享、不用下載開檔就能預覽，改成輸出「螢幕看得舒服、
       檔案又夠小」的圖片，不追求列印等級的高解析度——用像素預算反推縮放倍率。 */
    const SHARE_PIXEL_BUDGET = 9000000;
    const SCALE = Math.min(1, Math.sqrt(SHARE_PIXEL_BUDGET / (img.naturalWidth * img.naturalHeight)));
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth * SCALE;
    canvas.height = img.naturalHeight * SCALE;
    const ctx = canvas.getContext('2d');
    ctx.scale(SCALE, SCALE);
    ctx.drawImage(img, 0, 0);

    document.querySelectorAll('#output .zh-slot').forEach(function(slotEl){
      const inputEl = slotEl.querySelector('.zh-slot-input');
      if(!inputEl) return;
      const name = inputEl.value.trim();
      if(!name) return;
      const x = parseFloat(slotEl.style.left)/100*img.naturalWidth;
      const y = parseFloat(slotEl.style.top)/100*img.naturalHeight;
      const w = parseFloat(slotEl.style.width)/100*img.naturalWidth;
      const h = parseFloat(slotEl.style.height)/100*img.naturalHeight;
      drawNameHorizontal(ctx, name, x, y, w, h); /* 與畫面上的即時預覽共用同一套排版邏輯 */
    });

    canvas.toBlob(function(blob){
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = (currentBracket.title||'賽程圖')+'_'+(currentBracket.stageName||'')+'.jpg';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 'image/jpeg', 0.85);
  };
  img.src = KUAIQI7_PRELIM_IMAGE_URL;
}

/* ============ 存檔：自動存在瀏覽器 + 匯出/匯入備份 + 上傳賽程圖片 ============ */
/* SAVE_KEY已經搬到雲端同步那個script區塊去宣告了（2026-09-15修復timing race的bug，
   那個區塊現在改成放在這個主程式區塊「之後」才執行，詳見那邊的說明），這裡不再重複宣告。 */
let bgImageDataUrl = null;
let saveTimer = null;

function snapshotOutputDOM(){
  const data = {inputs:{}, badges:{}, winners:[], losers:[]};
  /* .zh-slot-input／.zh-slot 是中環棋聖賽疊圖模式專用的 class，原本沒有被下面的選擇器抓到，
     導致這個模式填的姓名、標記的勝方在重新整理/雲端同步後會遺失。這裡一併納入。 */
  document.querySelectorAll('#output .name-input, #output .round-date-input, #output .mini-input, #output .zh-slot-input').forEach(function(el){
    if(el.id) data.inputs[el.id]=el.value;
  });
  document.querySelectorAll('#output .seed-badge').forEach(function(el){
    if(el.id) data.badges[el.id]=el.textContent;
  });
  document.querySelectorAll('#output .slot.winner, #output .zh-slot.winner').forEach(function(el){ if(el.id) data.winners.push(el.id); });
  document.querySelectorAll('#output .slot.loser, #output .zh-slot.loser').forEach(function(el){ if(el.id) data.losers.push(el.id); });
  return data;
}
function restoreOutputDOM(data){
  if(!data) return;
  Object.keys(data.inputs||{}).forEach(function(id){ const el=document.getElementById(id); if(el) el.value=data.inputs[id]; });
  Object.keys(data.badges||{}).forEach(function(id){ const el=document.getElementById(id); if(el) el.textContent=data.badges[id]; });
  (data.winners||[]).forEach(function(id){ const el=document.getElementById(id); if(el) el.classList.add('winner'); });
  (data.losers||[]).forEach(function(id){ const el=document.getElementById(id); if(el) el.classList.add('loser'); });
}

/* 每個「比賽＋階段」各自存一份，key 是 presetId__stageIdx，彼此不會互相覆蓋。
   savedBrackets 是常駐在記憶體裡的完整資料（重新整理/切換頁面時從存檔讀回來），
   activeBracketKey 只是「目前畫面上顯示的是哪一份」的指標，存檔時用它決定要更新 savedBrackets 裡的哪一筆。 */
function bracketKey(presetId, stageIdx){ return presetId+'__'+stageIdx; }

function buildSaveObject(){
  return {
    version: 2,
    savedAt: new Date().toISOString(),
    opState: opState,
    stageSeq: stageSeq,
    brackets: savedBrackets,
    bgImage: bgImageDataUrl,
    playerRanks: playerRanks
  };
}

let cloudPushTimer = null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    try{
      if(activeBracketKey && currentBracket && currentStConfig){
        savedBrackets[activeBracketKey] = {
          stConfig: currentStConfig,
          currentBracket: {
            stageId: currentBracket.stageId, title: currentBracket.title, org: currentBracket.org,
            stageName: currentBracket.stageName, customLabels: currentBracket.customLabels,
            irregularPrefix: currentBracket.irregularPrefix, hasChampion: currentBracket.hasChampion
          },
          dom: snapshotOutputDOM()
        };
      }
      const obj = buildSaveObject();
      localStorage.setItem(SAVE_KEY, JSON.stringify(obj));
      updateSaveStatus();
      clearTimeout(cloudPushTimer);
      cloudPushTimer = setTimeout(function(){ pushToCloud(obj); }, 1200);
    }catch(e){ console.error('存檔失敗', e); }
  }, 300);
}

function updateSaveStatus(){
  const el = document.getElementById('saveStatus');
  const raw = localStorage.getItem(SAVE_KEY);
  if(!raw){ el.textContent = '尚未有存檔'; return; }
  try{
    const obj = JSON.parse(raw);
    const t = new Date(obj.savedAt);
    const pad=n=>String(n).padStart(2,'0');
    el.textContent = '已自動存檔：'+t.getFullYear()+'/'+pad(t.getMonth()+1)+'/'+pad(t.getDate())+' '+pad(t.getHours())+':'+pad(t.getMinutes());
  }catch(e){ el.textContent = '存檔資料異常'; }
}

function exportSaveFile(){
  const raw = localStorage.getItem(SAVE_KEY);
  if(!raw){ alert('目前沒有資料可以匯出，請先產生賽程表。'); return; }
  const blob = new Blob([raw], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const pad=n=>String(n).padStart(2,'0');
  a.href = url;
  a.download = '賽程存檔_'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importSaveFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(){
    try{
      const obj = JSON.parse(reader.result);
      localStorage.setItem(SAVE_KEY, JSON.stringify(obj));
      restoreFromSaved(obj);
    }catch(e){
      alert('匯入失敗，檔案格式不正確。');
    }
  };
  reader.readAsText(file);
  document.getElementById('importFileInput').value='';
}

let currentStConfig = null;
let savedBrackets = {};
let activeBracketKey = null;
/* 選手段位名單（姓名→段位/頭銜文字，例如'碁聖'/'三段'），全部比賽共用一份，
   不屬於任何單一賽事的savedBrackets，所以另外獨立存放；一樣跟著buildSaveObject／
   restoreFromSaved走，本機/雲端都會自動同步，不用另外寫存檔邏輯。 */
let playerRanks = {};

function restoreFromSaved(saved){
  if(!saved || !saved.opState){ restart(); return; }
  opState = saved.opState;
  stageSeq = saved.stageSeq || 0;
  bgImageDataUrl = saved.bgImage || null;
  savedBrackets = saved.brackets || {};
  playerRanks = saved.playerRanks || {};
  document.getElementById('output').innerHTML='';
  document.getElementById('printBar').style.display='none';
  document.getElementById('exportPanel').style.display='none';
  document.getElementById('archiveFloatBtn').style.display='none';
  currentBracket = null; currentStConfig = null; activeBracketKey = null;

  if(opState.presetId){
    renderStageEntry();
  } else {
    renderProgress(0);
    renderPresetSelect();
  }
  updateSaveStatus();
}

document.getElementById('output').addEventListener('input', function(e){
  if(e.target.classList && (e.target.classList.contains('name-input') || e.target.classList.contains('round-date-input') || e.target.classList.contains('mini-input'))){
    saveState();
  }
});

document.addEventListener('DOMContentLoaded', function(){
  const raw = localStorage.getItem(SAVE_KEY);
  if(raw){
    try{ restoreFromSaved(JSON.parse(raw)); return; }
    catch(e){ console.error('讀取存檔失敗，改為重新開始', e); }
  }
  restart();
  updateSaveStatus();
});
</script>

<script>
/* ============ 雲端帳號同步（Firebase）============
   全院共用一組帳密登入，登入後從 Firestore 讀取/寫入賽程存檔，取代原本「匯出/匯入 JSON 給同事」的做法。
   還沒有 Firebase 專案的話，先去 https://console.firebase.google.com 建立一個免費專案，
   開啟 Authentication（啟用「電子郵件/密碼」登入方式，並手動新增一組全院共用的帳密），
   再開啟 Firestore Database（正式模式即可，規則稍後由下面說明調整），
   最後把專案設定裡「Web應用程式」的 firebaseConfig 六個值貼到下面。 */
/* 2026-09-15修復「無法連線雲端」假警報（真正原因是script執行順序的timing race，
   不是網路問題）：這個雲端同步的script區塊（本來是HTML裡第一個<script>）會被Firebase的
   onAuthStateChanged非同步callback觸發（呼叫syncWithCloud/restoreFromSaved等），但
   restoreFromSaved跟原本這裡用到的SAVE_KEY都定義在另一個35MB的主程式script區塊——
   一開始只把SAVE_KEY搬到這裡（這個區塊最前面）以為修好了，結果使用者馬上又踩到同一類
   問題，這次錯誤變成`ReferenceError: restoreFromSaved is not defined`，代表SAVE_KEY
   不是唯一一個會被這樣「呼叫時機比它所在的script真正執行完還早」影響到的東西——只要
   這個callback呼叫到「另一個script區塊裡的任何東西」，都有同樣風險，逐一搬個別symbol
   是打地鼠，修不完。**真正的修法是調整兩個<script>區塊在HTML裡的先後順序**：把這個
   雲端同步區塊改成放在主程式那個大script區塊「之後」（HTML原始碼裡的实际位置，不是
   這裡看到的檔案內容），這樣不管Firebase的callback多快觸發，主程式那個大區塊一定已經
   完整執行完畢（class的、非同步的script標籤本來就是照文件順序一個接一個完整執行完
   才輪到下一個），這個區塊需要用到的任何東西都保證已經存在，不會再有任何一個symbol
   踩到這個race——這才是結構性、一次性排除整個問題根源的修法，不是頭痛醫頭。
   2026-09-16後續調整：上面這個修法解決了race condition，但副作用是把Firebase
   初始化／auth檢查／Firestore讀取整段延後到主程式script跑完才開始，導致登入後要等
   很久才進畫面（見這個檔案最前面、firebase三個CDN script標籤後面新增的那個早期
   script區塊的說明）。firebaseConfig／CLOUD_ENABLED／cloudAuth／cloudDb／
   cloudDocRef／__cloudSyncedOnce 現在都搬去那個早期區塊定義並在那裡完成
   initializeApp／onAuthStateChanged監聽，這裡不用再重覆宣告，直接沿用同一份全域
   變數即可（同一份HTML文件裡不同<script>區塊的頂層let/const本來就共用同一個全域
   作用域）。SAVE_KEY則留在這裡不動，因為它本來就只有這個區塊在用。 */
const SAVE_KEY = 'go_bracket_operator_save_v1_zhonghuan62_第13屆';

function setCloudStatus(text){
  const el = document.getElementById('cloudStatus');
  if(el) el.textContent = text;
}
function formatSavedAt(iso){
  if(!iso) return '';
  const t = new Date(iso);
  const pad=n=>String(n).padStart(2,'0');
  return t.getFullYear()+'/'+pad(t.getMonth()+1)+'/'+pad(t.getDate())+' '+pad(t.getHours())+':'+pad(t.getMinutes());
}

function doCloudLogin(){
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  errEl.textContent = '';
  if(!CLOUD_ENABLED){ errEl.textContent = '尚未設定雲端功能，請聯絡開發者完成 Firebase 設定。'; return; }
  const email = document.getElementById('loginEmail').value.trim();
  const pw = document.getElementById('loginPassword').value;
  if(!email || !pw){ errEl.textContent = '請輸入帳號與密碼。'; return; }
  btn.disabled = true;
  cloudAuth.signInWithEmailAndPassword(email, pw)
    .catch(function(err){
      errEl.textContent = '登入失敗：' + (err.code==='auth/invalid-credential'||err.code==='auth/wrong-password'||err.code==='auth/user-not-found' ? '帳號或密碼錯誤' : err.message);
    })
    .finally(function(){ btn.disabled = false; });
}
function doCloudLogout(){
  if(!CLOUD_ENABLED) return;
  if(!confirm('確定要登出嗎？')) return;
  cloudAuth.signOut();
}

function pushToCloud(obj){
  if(!CLOUD_ENABLED || !cloudAuth.currentUser) return;
  const cloudObj = Object.assign({}, obj);
  delete cloudObj.bgImage; /* 使用者自行上傳的賽程底圖不同步到雲端，避免超過 Firestore 單一文件 1MB 上限 */
  cloudDocRef.set(cloudObj)
    .then(function(){ setCloudStatus('已同步到雲端：'+formatSavedAt(cloudObj.savedAt)); })
    .catch(function(err){ console.error('雲端同步失敗', err); setCloudStatus('⚠ 雲端同步失敗（'+err.message+'），已保留在本機'); });
}
function syncWithCloud(manualPull){
  if(!CLOUD_ENABLED || !cloudAuth.currentUser) return;
  setCloudStatus('讀取雲端資料中…');
  /* 優先用「主程式script之前」那個早期區塊已經提早發出去的Firestore讀取請求
     （__prefetchedCloudDocPromise），省掉再多等一次網路來回；手動按「從雲端重新載入」
     （manualPull=true）則一定要重新讀一次最新資料，不能用舊的prefetch結果。 */
  const getPromise = (!manualPull && __prefetchedCloudDocPromise) ? __prefetchedCloudDocPromise : cloudDocRef.get();
  __prefetchedCloudDocPromise = null;
  getPromise.then(function(docSnap){
    const cloudObj = docSnap.exists ? docSnap.data() : null;
    const localRaw = localStorage.getItem(SAVE_KEY);
    const localObj = localRaw ? (function(){ try{ return JSON.parse(localRaw); }catch(e){ return null; } })() : null;
    const cloudTime = cloudObj && cloudObj.savedAt ? new Date(cloudObj.savedAt).getTime() : 0;
    const localTime = localObj && localObj.savedAt ? new Date(localObj.savedAt).getTime() : 0;
    if(cloudObj && (manualPull || cloudTime > localTime)){
      localStorage.setItem(SAVE_KEY, JSON.stringify(cloudObj));
      restoreFromSaved(cloudObj);
      setCloudStatus('已從雲端載入最新賽程（'+formatSavedAt(cloudObj.savedAt)+'）');
    } else if(localObj){
      pushToCloud(localObj);
    } else {
      setCloudStatus('雲端尚無資料，開始操作後會自動同步');
    }
  }).catch(function(err){
    console.error('雲端讀取失敗', err);
    setCloudStatus('⚠ 無法連線雲端，暫時使用本機資料');
  });
}

/* 安全網：如果使用者一打開頁面就已經是登入狀態（瀏覽器記得之前的登入），
   那個早期區塊的onAuthStateChanged callback有可能在這個主程式之後的區塊
   都還沒執行完之前就先觸發過一次（那時候typeof syncWithCloud還是'undefined'，
   會被那邊的判斷式跳過），現在main script已經跑完、syncWithCloud剛定義好，
   這裡補呼叫一次，確保不會漏掉這個時間點卡住的情況。 */
if(CLOUD_ENABLED && cloudAuth.currentUser && !__cloudSyncedOnce){
  __cloudSyncedOnce = true;
  syncWithCloud(false);
}
</script>
