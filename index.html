<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>棋賽賽程操作台</title>
<style>
:root{
  --paper:#F1EBDA;
  --paper2:#E9E2CC;
  --ink:#20241D;
  --ink-soft:#5B5F52;
  --line:#C9BF9E;
  --seal:#9C2B23;
  --seal-soft:#C97B6E;
  --wood:#A9793E;
  --bye:#A39B87;
  --font-display:"游明朝","Yu Mincho","YuMincho","Noto Serif TC","Songti TC","PMingLiU","SimSun",serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
}
*{box-sizing:border-box;}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
body{margin:0;background:var(--paper2);color:var(--ink);font-family:var(--font-body);line-height:1.5;}

.page-header{position:relative;padding:32px 20px 22px;text-align:center;overflow:hidden;background:var(--paper);border-bottom:3px solid var(--ink);}
.page-header::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:
    repeating-linear-gradient(0deg,rgba(32,36,29,.09) 0 1px,transparent 1px 26px),
    repeating-linear-gradient(90deg,rgba(32,36,29,.09) 0 1px,transparent 1px 26px);
  -webkit-mask-image:radial-gradient(ellipse at center,black 0%,transparent 70%);
  mask-image:radial-gradient(ellipse at center,black 0%,transparent 70%);
}
.page-header h1{position:relative;font-family:var(--font-display);font-size:24px;letter-spacing:.12em;margin:0 0 8px;}
.page-header .sub{position:relative;color:var(--ink-soft);font-size:13px;letter-spacing:.03em;}

main{max-width:1440px;margin:0 auto;padding:0 20px 70px;}

.toolbar{max-width:1440px;margin:0 auto;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;background:var(--paper);border-bottom:1px solid var(--line);}
.toolbar-status{font-size:12px;color:var(--ink-soft);}
.toolbar-actions{display:flex;gap:8px;flex-wrap:wrap;}

#loginOverlay{position:fixed;inset:0;background:var(--paper2);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px;}
#loginOverlay .login-box{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:32px 36px;width:100%;max-width:340px;box-shadow:0 6px 24px rgba(0,0,0,.12);}
#loginOverlay h2{margin:0 0 6px;font-size:19px;}
#loginOverlay p.hint{margin:0 0 18px;font-size:13px;color:var(--ink-soft);}
#loginOverlay label{display:block;font-size:13px;margin:12px 0 4px;color:var(--ink-soft);}
#loginOverlay input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;font-size:14px;box-sizing:border-box;}
#loginOverlay button{margin-top:18px;width:100%;padding:10px;border:none;border-radius:6px;background:var(--seal);color:#fff;font-size:15px;font-weight:700;cursor:pointer;}
#loginOverlay button:disabled{opacity:.6;cursor:default;}
#loginOverlay .login-error{margin-top:10px;font-size:13px;color:var(--seal);min-height:1.2em;}
#cloudStatus{font-size:12px;color:var(--ink-soft);}
.bg-preview{max-width:120px;max-height:40px;border:1px solid var(--line);border-radius:4px;vertical-align:middle;margin-left:8px;}

/* 選手段位名單／對陣文字這兩個彈出視窗共用的通用modal樣式（跟#loginOverlay同一套視覺風格，
   但用半透明黑色背景蓋住畫面，區分「這是彈出視窗」跟「這是登入前的全螢幕畫面」）。 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.modal-box{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:24px 28px;width:100%;max-width:560px;max-height:82vh;overflow:auto;box-shadow:0 8px 32px rgba(0,0,0,.25);}
.modal-box textarea{width:100%;box-sizing:border-box;font-family:var(--font-body);font-size:13.5px;line-height:1.6;padding:8px 10px;border:1px solid var(--line);border-radius:6px;resize:vertical;}

.step-panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:22px 26px;margin:26px 0;}
.step-title{font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--wood);margin:0 0 14px;}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-soft);margin-bottom:14px;}
.field.grow{flex:1;min-width:220px;}
.field input,.field select,.field textarea{font-family:var(--font-body);font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);}
.field textarea{resize:vertical;}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--seal-soft);border-color:var(--seal-soft);}
.setup-top-row{display:flex;gap:16px;flex-wrap:wrap;}

.btn{font-family:var(--font-body);font-size:14px;padding:9px 22px;border-radius:22px;border:1.5px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;font-weight:600;transition:opacity .15s;}
.btn:hover{opacity:.82;}
.btn.secondary{background:#fff;color:var(--ink);}
.btn.danger{background:#fff;color:var(--seal);border-color:var(--seal);}
.btn.danger:hover{background:var(--seal);color:#fff;}
.resume-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#FBF3EC;border:1px solid var(--seal-soft);border-radius:8px;padding:12px 16px;margin-bottom:18px;font-size:13px;flex-wrap:wrap;}
.btn.small{padding:6px 16px;font-size:12px;}
.resume-chip{display:inline-flex;align-items:center;gap:4px;}
.chip-archive-btn{padding:6px 10px;}
.setup-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px;}

.progress-track{display:flex;gap:6px;margin-bottom:18px;}
.progress-dot{flex:1;height:5px;border-radius:3px;background:var(--line);}
.progress-dot.done{background:var(--wood);}
.progress-dot.active{background:var(--seal);}

.hint{font-size:12px;color:var(--ink-soft);margin:10px 2px 0;line-height:1.7;}

.stage-block{background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px 28px 30px;margin:26px 0;box-shadow:0 2px 10px rgba(0,0,0,.05);}
.stage-header h2{font-family:var(--font-display);font-size:19px;margin:0 0 4px;border-left:5px solid var(--seal);padding-left:12px;}

.seed-badge{flex:0 0 auto;min-width:20px;height:20px;padding:0 3px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;font-family:var(--font-body);}
.match-box{width:100%;border:1.4px solid var(--ink);border-radius:5px;background:#fff;overflow:hidden;}
.slot{display:flex;align-items:center;gap:6px;padding:4px 7px;min-height:31px;flex-wrap:wrap;}
.slot+.slot{border-top:1px solid var(--line);}
.slot.bye{background:repeating-linear-gradient(135deg,#F4F1E8,#F4F1E8 6px,#EDE8D8 6px,#EDE8D8 12px);}
.bye-text{flex:1;color:var(--bye);font-style:italic;font-size:12.5px;}
.name-input{flex:1;min-width:50px;border:none;background:transparent;font-size:14px;font-family:var(--font-body);color:var(--ink);padding:2px 2px;white-space:nowrap;overflow:hidden;}
.name-input:focus{outline:2px solid var(--seal-soft);border-radius:3px;background:#FFFCF3;}
.win-btn{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:1.3px solid var(--line);background:#fff;color:var(--ink-soft);cursor:pointer;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;}
.win-btn:hover{border-color:var(--seal);color:var(--seal);}
.slot.winner{background:#FBF3EC;}
.slot.winner .win-btn{background:var(--seal);color:#fff;border-color:var(--seal);}
.slot.winner .name-input{font-weight:700;}
.slot.loser .name-input{color:var(--ink-soft);opacity:.55;}
.match-result-row{display:flex;gap:1px;padding:2px 5px;border-top:1px dashed var(--line);background:#FAFAF5;}
.mini-input{flex:1;min-width:0;font-size:9.5px;border:none;background:transparent;text-align:center;color:var(--ink-soft);padding:1px 2px;font-family:var(--font-body);}
.mini-input:focus{outline:1px solid var(--seal-soft);background:#fff;border-radius:2px;}

.bracket-tree{display:flex;align-items:stretch;overflow-x:auto;padding:10px 4px 16px;}
.round-col-outer{display:flex;flex-direction:column;flex-shrink:0;min-width:196px;margin-right:6px;}
.round-header{height:26px;line-height:26px;text-align:center;font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.06em;border-bottom:2px solid var(--ink);margin-bottom:6px;white-space:nowrap;padding:0 4px;}
.round-date-row{text-align:center;margin-bottom:6px;}
.round-date-input{width:88%;text-align:center;font-size:11px;border:none;border-bottom:1px solid var(--line);background:transparent;color:var(--ink-soft);padding:2px;font-family:var(--font-body);}
.round-date-input:focus{outline:2px solid var(--seal-soft);border-radius:3px;background:#FFFCF3;}
.round-matches{display:flex;flex-direction:column;}
.match-container{flex:1;display:flex;align-items:center;position:relative;padding-right:22px;}
.match-container .match-box{margin:0 4px;}
.match-container.pair-top::after{content:'';position:absolute;left:100%;top:50%;width:22px;height:50%;border-top:2px solid var(--ink);border-right:2px solid var(--ink);}
.match-container.pair-bottom::after{content:'';position:absolute;left:100%;bottom:50%;width:22px;height:50%;border-bottom:2px solid var(--ink);border-right:2px solid var(--ink);}
.match-container.to-champion::after{content:'';position:absolute;left:100%;top:calc(50% - 1px);width:22px;height:2px;background:var(--ink);}
.match-container.no-connector::after{display:none;}
.champion-box{border-width:2px;border-color:var(--seal);}
.champion-box .seed-badge{background:var(--seal);}

.export-panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 22px;margin:14px 0 30px;display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;}
.export-panel .field{margin-bottom:0;min-width:200px;}

#scoreSheetPrint{display:none;}
.ss-page{margin-bottom:20px;}
.ss-header{position:relative;text-align:center;margin-bottom:0;}
.ss-title{font-family:var(--font-display);font-weight:700;font-size:22px;}
.ss-notary{position:absolute;top:0;right:0;font-size:15px;white-space:nowrap;}
.ss-sub{font-size:11.5px;color:#444;margin-bottom:4px;text-align:center;position:relative;}
.ss-sub .ss-date{position:absolute;right:0;top:0;}
.ss-columns{display:grid;grid-template-columns:8% 38% 8% 38% 8%;page-break-inside:avoid;break-inside:avoid;}
.ss-col:nth-of-type(1){grid-column:2;}
.ss-col:nth-of-type(2){grid-column:4;}
.ss-game{margin-bottom:4px;break-inside:avoid;page-break-inside:avoid;}
.ss-game:last-child{margin-bottom:0;}
.ss-game-title{font-size:13px;margin-bottom:1px;}
table.ss-table{border-collapse:collapse;width:100%;font-size:14px;table-layout:fixed;}
table.ss-table th,table.ss-table td{border:1px solid #333;padding:4.5px 5.5px;text-align:center;vertical-align:middle;overflow:hidden;white-space:nowrap;line-height:1.2;height:24px;}
table.ss-table th{background:#fff;font-weight:400;font-size:12.5px;}
table.ss-table td:nth-child(2){font-weight:600;}
table.ss-table col.c-no{width:13%;}
table.ss-table col.c-name{width:24%;}
table.ss-table col.c-wl{width:13%;}
table.ss-table col.c-result{width:28%;}
table.ss-table col.c-time{width:22%;}
.ss-note{font-size:12px;color:#333;margin-top:8px;margin-left:8%;}
/* 循環圈／挑戰賽等「寬版」成績登記表：使用者要求版型比照附件（棋王賽循環圈/棋王挑戰賽
   實際使用的紙本格式），單欄滿版排列每一局（不像其他賽事窄版5欄8%/38%/8%/38%/8%那樣
   兩欄併排），多了手數/剩餘時間/記譜員/公證人（挑戰賽還多一欄讀秒時間）。這些欄寬
   跟其他賽事共用的.ss-table/.c-no等既有class欄寬不一樣，故意多疊一個.ss-table-wide／
   .ss-game-wide class，靠「兩個class」比「一個class」選擇器優先權更高去覆蓋，不會
   動到其他賽事既有的5欄版面。 */
.ss-wide-col{width:100%;page-break-inside:avoid;break-inside:avoid;}
.ss-game.ss-game-wide{margin-bottom:14px;}
.ss-game.ss-game-wide:last-child{margin-bottom:0;}
/* 使用者反應「一頁只有四局，格子可以拉高一點，讓底下不要留白太多」——寬版表格
   （循環圈9欄／挑戰賽10欄）原本沿用跟其他賽事共用的th/td高度（24px，實際渲染出來
   因為padding+行高會撐到約27px），一頁4局印完後A4橫向版面下方會留很大一片空白。
   這裡把高度從24px明確加高到38px（只影響.ss-table-wide這個寬版變體，不影響其他賽事
   共用的窄版.ss-table）。38px是用A4橫向、12mm邊界換算出來的實際可印刷區域（約1032×703px，
   96dpi換算）當基準反覆量測調出來的：38px時整頁（含標題/日期/註腳）實測約664px高，
   離703px上限還留約39px（5.5%）安全緩衝，避免因為瀏覽器實際列印時的字型渲染微差
   意外多印出一頁空白頁；試過40px（688px，僅剩15px緩衝，太貼近上限）、42px（712px，
   已經超出、會溢到下一頁），最後選擇38px這個「明顯拉高、又留有安全餘裕」的數值。 */
table.ss-table.ss-table-wide th,table.ss-table.ss-table-wide td{height:38px;}
/* 格子拉高之後使用者接著要求「字也跟著大一點」——把寬版表格的字級從跟其他賽事共用的
   14px/12.5px(表頭)加大到17px/15px。加大前有先逐一檢查所有欄位標題（含最窄的「勝負」
   「持」欄）跟姓名欄位（用4~5字的極端測試姓名）在新字級下用scrollWidth/clientWidth
   比對，確認circle(9欄)/challenge(10欄)兩種版型都沒有任何欄位文字溢出、列高也還是
   維持在38px沒有被撐大（17px字級的行高+padding+邊框仍小於38px），才定案套用。 */
table.ss-table.ss-table-wide{font-size:17px;}
table.ss-table.ss-table-wide th{font-size:15px;}
/* 使用者要求「名字的字再大一點」——姓名欄位單獨再加大一級（19px，比其他欄位的17px
   明顯大一點），沿用既有.ss-table td:nth-child(2)的粗體設定，讓姓名在表格裡更醒目。
   加大前一樣有用scrollWidth/clientWidth測過4~5字姓名在新字級+新欄寬下都沒有溢出。 */
table.ss-table.ss-table-wide td:nth-child(2){font-size:19px;}
/* 使用者要求「記譜員的格子幫我跟公證人一樣大，剩餘時間可以小一點」——這3欄原本的欄寬
   （14/11/9）加起來91%（跟其他6欄的57%加起來只有91%，不是100%，是先前為了同時準備
   挑戰賽10欄版型、調整.c-scribe/.c-notary寬度時沒注意到circle自己這9欄的總和被連帶
   改壞的疏漏——這次一併修正）。改成「剩餘時間」縮小、「記譜員」「公證人」等寬且比之前
   更寬（現場手寫這兩欄的人名通常比剩餘時間的數字需要更多空間），三欄重新分配成
   9%+17%+17%＝43%，加上其他6欄的57%，總和整整100%。 */
table.ss-table.ss-table-wide col.c-no{width:6%;}
table.ss-table.ss-table-wide col.c-name{width:12%;}
table.ss-table.ss-table-wide col.c-wl{width:5%;}
table.ss-table.ss-table-wide col.c-result{width:16%;}
table.ss-table.ss-table-wide col.c-time{width:12%;}
table.ss-table.ss-table-wide col.c-moves{width:6%;}
table.ss-table.ss-table-wide col.c-remain{width:9%;}
table.ss-table.ss-table-wide col.c-byo{width:9%;}
table.ss-table.ss-table-wide col.c-scribe{width:17%;}
table.ss-table.ss-table-wide col.c-notary{width:17%;}
/* 挑戰賽版型（10欄，比循環圈多一欄「讀秒時間」）的欄寬跟循環圈（9欄）不一樣，
   另外疊一個.ss-table-challenge class（三個class疊在一起，選擇器優先權比上面
   兩個class的.ss-table-wide規則更高），數字原本是照附件實際Word檔的欄寬比例換算出來的
   （791/1684/645/2349/1559/967/1443/1701/1701/1842 dxa，換算成百分比後再微調湊整）。
   這次比照circle同一輪調整（「記譜員」跟「公證人」等寬且加大、「剩餘時間」縮小）：
   序號/姓名/勝負/成績結果/終局時間/手數這6欄維持原比例不動（共54.5%），剩下的
   剩餘時間/讀秒時間/記譜員/公證人4欄重新分配成7/11.5/13.5/13.5（共45.5%），
   記譜員＝公證人維持相等、剩餘時間比原本的9.8%再縮小。 */
table.ss-table.ss-table-wide.ss-table-challenge col.c-no{width:5.4%;}
table.ss-table.ss-table-wide.ss-table-challenge col.c-name{width:11.5%;}
table.ss-table.ss-table-wide.ss-table-challenge col.c-wl{width:4.4%;}
table.ss-table.ss-table-wide.ss-table-challenge col.c-result{width:16%;}
table.ss-table.ss-table-wide.ss-table-challenge col.c-time{width:10.6%;}
table.ss-table.ss-table-wide.ss-table-challenge col.c-moves{width:6.6%;}
table.ss-table.ss-table-wide.ss-table-challenge col.c-remain{width:7%;}
table.ss-table.ss-table-wide.ss-table-challenge col.c-byo{width:11.5%;}
table.ss-table.ss-table-wide.ss-table-challenge col.c-scribe{width:13.5%;}
table.ss-table.ss-table-wide.ss-table-challenge col.c-notary{width:13.5%;}

.zh-overlay-wrap{position:relative;width:100%;max-width:1600px;margin:0 auto;}
.zh-overlay-img{width:100%;display:block;user-select:none;min-height:200px;background:var(--paper2);}
.zh-overlay-canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;}
/* 2026-09-18新增：底圖現在是獨立圖片檔（不是內嵌base64），網路狀況不好時，姓名輸入框/連接線
   （純HTML/JS，不用等網路）可能會先畫出來，底圖還在下載中，畫面上會有一段空白——加這個提示
   讓使用者知道「還在讀圖，不是壞掉」，img.className上面順便給.zh-overlay-img一個淺色底
   （min-height撐出空間），底圖讀完之後蓋過去就看不到了。 */
.zh-loading-hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--ink-soft);font-size:14px;background:var(--paper2);padding:8px 16px;border-radius:6px;border:1px solid var(--line);z-index:1;}
.zh-slot{position:absolute;cursor:pointer;box-sizing:border-box;border-radius:2px;}
.zh-slot:hover{background:rgba(156,43,35,0.12);}
.zh-slot.winner{background:rgba(156,43,35,0.22);box-shadow:0 0 0 1.5px var(--seal) inset;}
.zh-slot.loser{opacity:0.4;}
.zh-slot-input{
  position:static;width:100%;height:100%;border:none;background:transparent;padding:0;margin:0;
  font-family:"Noto Sans CJK TC","Noto Sans TC",sans-serif;font-weight:700;color:transparent;caret-color:transparent;
  writing-mode:vertical-rl;text-orientation:upright;text-align:center;
  cursor:pointer;box-sizing:border-box;outline:none;overflow:hidden;pointer-events:none;
}
.zh-champion-slot{border-radius:3px;}
.zh-champion-input{writing-mode:horizontal-tb;font-size:1.2vw;color:transparent;caret-color:transparent;font-weight:700;text-align:center;}
/* 決賽三番戰：灰格（比賽結果，使用者自己打字，看得到框線）＋日期格（11月＿＿日中間的空白，完全隱形不影響底圖美觀） */
.zh-result-input{
  position:absolute;box-sizing:border-box;text-align:center;
  font-family:"Noto Sans CJK TC","Noto Sans TC",sans-serif;font-weight:700;font-size:0.9vw;

/* 棋王賽循環圈：每格是一個可點擊的圈（白圈=勝／黑圈=負），跟其他賽事「點格子標記勝方」

.zh-slot.qw-circle{border-radius:50%;border:1.3px solid rgba(0,0,0,0.18);background:transparent;box-shadow:none;}
.zh-slot.qw-circle.winner{background:#fff;border:1.5px solid #000;box-shadow:none;opacity:1;}
.zh-slot.qw-circle.loser{background:#000;border:1.5px solid #000;box-shadow:none;opacity:1;}
/* 主分：原本是純顯示div（2.6vw字級），使用者要求改成手動輸入格，改用跟加賽/名次格
   同一套container query（cqh）字級機制，量過改動前的字級跟格高比例約55%，剛好可以直接
   沿用下面 .qw-input-wrap input 那條55cqh規則，字級視覺大小維持跟改動前一樣。 */
.qw-zhufen{position:absolute;box-sizing:border-box;container-type:size;}
.qw-zhufen input{
  position:static;width:100%;height:100%;box-sizing:border-box;text-align:center;
  font-family:"Noto Sans CJK TC","Noto Sans TC",sans-serif;font-weight:700;font-size:55cqh;
  color:#151515;background:rgba(255,255,255,0.001);border:1px solid rgba(0,0,0,0.25);border-radius:2px;outline:none;
}
.qw-zhufen input:focus{border-color:var(--seal);background:#fff;}
/* container-type:size：讓這個wrapper變成一個「容器查詢」的量測基準，裡面的input可以用
   cqh（container query height，容器自己實際高度的百分比）當字級單位，字級永遠跟著這個
   格子本身實際渲染出來的高度走，不會再像vw那樣受「疊圖區塊跟整個瀏覽器視窗寬度的比例」影響
   （之前用vw＋JS量測+setTimeout去補救，寬度夠了但畫面預覽還是會爆版，根因就是vw從一開始
   就綁錯了參考基準；cqh是CSS原生機制，瀏覽器自己隨時重新計算，不用JS介入、沒有時機問題）。
   下載賽程圖那邊完全沒動——那邊本來就是另一套獨立的canvas畫布字級算法，不受這裡影響。 */
.qw-input-wrap,.qw-mingci-wrap{position:absolute;box-sizing:border-box;container-type:size;}
.qw-input-wrap input,.qw-mingci-wrap input{
  position:static;width:100%;height:100%;box-sizing:border-box;text-align:center;
  font-family:"Noto Sans CJK TC","Noto Sans TC",sans-serif;font-weight:700;font-size:55cqh;
  color:#151515;background:rgba(255,255,255,0.001);border:1px solid rgba(0,0,0,0.25);border-radius:2px;outline:none;

.qw-input-wrap input.qw-jiasai-input{font-size:62cqh;font-weight:400;border:1px solid rgba(0,0,0,0.02);}
.qw-input-wrap input:focus,.qw-mingci-wrap input:focus{border-color:var(--seal);background:#fff;}

<script>
/* 2026-09-16修復「登入後要等很久才進畫面」（之前3秒內就進去）：
   這是2026-09-15那次修「無法連線雲端」race condition的副作用——那次把整個雲端同步
   script區塊搬到35MB主程式script「之後」，結果連帶把Firebase登入狀態檢查／Firestore
   讀取這兩個網路來回，也跟著整個延後到主程式script完全下載＋執行完才開始，變成
   「主程式下載時間」+「auth檢查來回」+「Firestore讀取來回」三段完全相加，而不是像
   以前那樣跟主程式的下載同時進行（overlap）。
   修法：把「不需要用到主程式symbol」的部分（firebase初始化、onAuthStateChanged監聽、
   顯示/隱藏登入畫面、提早發出Firestore讀取請求並把promise存起來）搬回這裡、放在主程式
   script「之前」，讓這兩個網路來回可以跟主程式的下載/解析同時進行；「真的需要用到
   主程式symbol」的部分（syncWithCloud實際處理讀回來的資料、呼叫restoreFromSaved等）
   繼續留在主程式script「之後」那個區塊，維持原本race condition修復的保證不變。 */
const firebaseConfig = {
  apiKey: "AIzaSyAZAxRuD6MFG4i_FcOf5OX_qzrHunGXqnk",
  authDomain: "test-5cfc9.firebaseapp.com",
  projectId: "test-5cfc9",
  storageBucket: "test-5cfc9.firebasestorage.app",
  messagingSenderId: "892169332286",
  appId: "1:892169332286:web:c16a82a686d1f3e024536f"
};
const CLOUD_ENABLED = firebaseConfig.apiKey !== "YOUR_API_KEY";
let cloudAuth = null, cloudDb = null, cloudDocRef = null;
let __cloudSyncedOnce = false;
let __prefetchedCloudDocPromise = null;
if(CLOUD_ENABLED){
  firebase.initializeApp(firebaseConfig);
  cloudAuth = firebase.auth();
  cloudDb = firebase.firestore();
  cloudDb.enablePersistence().catch(function(e){ console.warn('離線暫存無法啟用', e); });
  cloudDocRef = cloudDb.collection('brackets').doc('main');
  cloudAuth.onAuthStateChanged(function(user){
    document.getElementById('loginOverlay').style.display = user ? 'none' : 'flex';
    document.getElementById('appRoot').style.display = user ? '' : 'none';
    if(user){
      if(!__prefetchedCloudDocPromise){ __prefetchedCloudDocPromise = cloudDocRef.get(); }
      /* syncWithCloud定義在主程式script「之後」那個區塊，這個callback有可能在主程式
         script執行完之前就先觸發（例如瀏覽器已記得登入狀態），這時候typeof檢查會是
         false，先跳過，交給那個區塊自己最後面的補呼叫；如果是使用者手動登入（這時候
         整份文件早就載入完了），這裡就會直接呼叫，不用等。 */
      if(typeof syncWithCloud === 'function' && !__cloudSyncedOnce){
        __cloudSyncedOnce = true;
        syncWithCloud(false);
      }
    } else {
      __prefetchedCloudDocPromise = null;
      __cloudSyncedOnce = false;
    }
  });
} else {
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('appRoot').style.display = '';
}
</script>

/* ============ utility ============ */
function escapeAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }
function escapeHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function inputId(stageId,matchId,slotIndex){ return 'input_'+stageId+'_'+matchId+'_'+slotIndex; }
function slotWrapId(stageId,matchId,slotIndex){ return 'slotwrap_'+stageId+'_'+matchId+'_'+slotIndex; }
function seedBadgeId(stageId,matchId,slotIndex){ return 'badge_'+stageId+'_'+matchId+'_'+slotIndex; }
function nextPow2(n){ let p=1; while(p<n) p*=2; return p; }
function roundLabel(playersEntering){
  if(playersEntering<=2) return '決賽';
  if(playersEntering===4) return '準決賽';
  return playersEntering+'強';
}

/* ============ 賽制演算法（目前只需要單淘汰賽） ============ */
function seedOrder(size){
  let seeds=[1,2];
  while(seeds.length<size){
    const ns=seeds.length*2, out=[];
    for(const s of seeds){ out.push(s, ns+1-s); }
    seeds=out;
  }
  return seeds;
}
function seedOrderSequential(size, n){
  const byeCount = size - n;
  const byeSeeds = new Set();
  let lo=1, hi=n, front=true;
  for(let i=0;i<byeCount;i++){
    if(front){ byeSeeds.add(lo); lo++; } else { byeSeeds.add(hi); hi--; }
    front=!front;
  }
  const result=[];
  let phantom=n+1, s=1;
  while(s<=n){
    if(byeSeeds.has(s)){ result.push(s, phantom); phantom++; s++; }
    else { result.push(s, s+1); s+=2; }
  }
  return result;
}
function buildSingleElim(n, stopAt, pairing){
  stopAt = stopAt || 1;
  const size=nextPow2(Math.max(n,2));
  const seeds = pairing==='sequential' ? seedOrderSequential(size, n) : seedOrder(size);
  const rounds=[];
  let matches=[];
  for(let i=0;i<size/2;i++){
    const s1=seeds[2*i], s2=seeds[2*i+1];
    matches.push({id:'m0_'+i, round:0, slots:[{seed:s1,isBye:s1>n},{seed:s2,isBye:s2>n}], advanceTo:null});
  }
  rounds.push(matches);
  let currentCount=size/2, r=1;
  while(currentCount>stopAt){
    const prev=rounds[r-1];
    const cur=[];
    for(let i=0;i<prev.length/2;i++){
      const m={id:'m'+r+'_'+i, round:r, slots:[{seed:null,isBye:false},{seed:null,isBye:false}], advanceTo:null};
      cur.push(m);
      prev[2*i].advanceTo={matchId:m.id, slotIndex:0};
      prev[2*i+1].advanceTo={matchId:m.id, slotIndex:1};
    }
    rounds.push(cur);
    currentCount=cur.length;
    r++;
  }
  return {size, rounds, finalCount:currentCount};
}

/* ============ 賽程渲染 ============ */
const matchRegistry = {};

function renderRoundDateInput(id){
  const div=document.createElement('div');
  div.className='round-date-row';
  div.innerHTML='<input type="text" class="round-date-input" id="'+(id||'')+'" placeholder="日期">';
  return div;
}
function renderMatchBox(stageId, m){
  const box=document.createElement('div');
  box.className='match-box';
  m.slots.forEach((slot,idx)=>{
    const slotEl=document.createElement('div');
    slotEl.className='slot'+(slot.isBye?' bye':'');
    slotEl.id=slotWrapId(stageId,m.id,idx);
    if(slot.isBye){
      slotEl.innerHTML='<span class="bye-text">（輪空）</span>';
    } else {
      const seedLabel = slot.seed!=null ? slot.seed : '';
      slotEl.innerHTML =
        '<span class="seed-badge" id="'+seedBadgeId(stageId,m.id,idx)+'">'+seedLabel+'</span>'+
        '<input type="text" class="name-input" id="'+inputId(stageId,m.id,idx)+'" placeholder="姓名">'+
        '<button type="button" class="win-btn no-print" title="標記勝方，自動晉級" onclick="toggleWinner(\''+stageId+'\',\''+m.id+'\','+idx+')">✓</button>';
    }
    box.appendChild(slotEl);
  });
  if(m.slots.length===2){
    const resultRow=document.createElement('div');
    resultRow.className='match-result-row';
    resultRow.innerHTML =
      '<input type="text" class="mini-input" placeholder="結果" title="成績結果">'+
      '<input type="text" class="mini-input" placeholder="時間" title="終局時間">';
    box.appendChild(resultRow);
  }
  return box;
}
function renderEliminationColumns(stageId, rounds, customLabels, idxOffset){
  idxOffset = idxOffset||0;
  const wrap=document.createElement('div');
  wrap.className='bracket-tree';
  const MATCH_H=88;
  const totalH=rounds[0].length*MATCH_H;
  rounds.forEach((round,ri)=>{
    const outer=document.createElement('div');
    outer.className='round-col-outer';
    const header=document.createElement('div');
    header.className='round-header';
    header.textContent = (customLabels && customLabels[ri]) ? customLabels[ri] : roundLabel(round.length*2);
    outer.appendChild(header);
    outer.appendChild(renderRoundDateInput('rdate_'+stageId+'_r'+(ri+idxOffset)));
    const matchesCol=document.createElement('div');
    matchesCol.className='round-matches';
    matchesCol.style.height=totalH+'px';
    round.forEach((m,idx)=>{
      matchRegistry[stageId][m.id]=m;
      const mc=document.createElement('div');
      mc.className='match-container';
      if(ri===rounds.length-1){ mc.classList.add('to-champion'); }
      else { mc.classList.add(idx%2===0?'pair-top':'pair-bottom'); }
      mc.appendChild(renderMatchBox(stageId,m));
      matchesCol.appendChild(mc);
    });
    outer.appendChild(matchesCol);
    wrap.appendChild(outer);
  });
  return {wrap, totalH};
}
function renderFlatRoundColumn(stageId, round, label, totalH){
  const outer=document.createElement('div');
  outer.className='round-col-outer';
  const header=document.createElement('div');
  header.className='round-header';
  header.textContent=label;
  outer.appendChild(header);
  outer.appendChild(renderRoundDateInput(''));
  const matchesCol=document.createElement('div');
  matchesCol.className='round-matches';
  matchesCol.style.height=totalH+'px';
  round.forEach(function(m){
    matchRegistry[stageId][m.id]=m;
    const mc=document.createElement('div');
    mc.className='match-container no-connector';
    mc.appendChild(renderMatchBox(stageId,m));
    matchesCol.appendChild(mc);
  });
  outer.appendChild(matchesCol);
  return outer;
}

/* 39 位選手的配對結構：左欄 9 組兩人對戰（01-18），右欄 7 組三人晉級賽（19-39）。
   跟 buildZhonghuan62Rounds 同樣的 match/slots/advanceTo 機制，才能直接共用 toggleWinner／setSlotName／存檔那一整套邏輯。
   每組最後都有一個獨立的「晉級後姓名」顯示格（champ），用法跟優勝格一樣，透過 advanceTo 自動帶入贏家姓名。 */
function buildKuaiqi7PrelimGroups(){
  const groups=[];
  for(let i=0;i<9;i++){
    const seedA=2*i+1, seedB=2*i+2;
    const m0={id:'L'+i, slots:[{seed:seedA,isBye:false},{seed:seedB,isBye:false}], advanceTo:{matchId:'L'+i+'_champ', slotIndex:0}};
    const champ={id:'L'+i+'_champ', slots:[{seed:null,isBye:false}], advanceTo:null};
    groups.push({matches:[m0,champ]});
  }
  for(let i=0;i<7;i++){
    const seedA=19+3*i, seedB=20+3*i, seedC=21+3*i;
    const m0={id:'R'+i+'_m0', slots:[{seed:seedA,isBye:false},{seed:seedB,isBye:false}], advanceTo:{matchId:'R'+i+'_m1', slotIndex:0}};
    const m1={id:'R'+i+'_m1', slots:[{seed:null,isBye:false},{seed:seedC,isBye:false}], advanceTo:{matchId:'R'+i+'_champ', slotIndex:0}};
    const champ={id:'R'+i+'_champ', slots:[{seed:null,isBye:false}], advanceTo:null};
    groups.push({matches:[m0,m1,champ]});
  }
  return groups;
}

   只是額外照「淘汰賽的進行順序」重新分組成一輪一輪，供成績登記表的輪次下拉選單使用。
   本賽48強：4個「12人小組」各自先打3輪小組內對戰（決出小組冠軍），
   再兩兩比出左右半區冠軍，最後決賽——完全比照中環碁聖賽「一輪一輪列印」的邏輯。 */
function buildXuanleMain48PrintRounds(){
  const all = buildXuanleMain48Matches();
  const byId = {}; all.forEach(function(m){ byId[m.id]=m; });
  const roundA=[], roundB=[], roundC=[], roundD=[];
  XUANLE_MAIN48_QUADS.forEach(function(q){
    const qk=q.qk;
    roundA.push(byId[qk+'_m23'], byId[qk+'_m45'], byId[qk+'_m89'], byId[qk+'_m1011']);
    roundB.push(byId[qk+'_r2a'], byId[qk+'_r2b'], byId[qk+'_r2c'], byId[qk+'_r2d']);
    roundC.push(byId[qk+'_r3top'], byId[qk+'_r3bot']);
    roundD.push(byId[qk+'_qf']);
  });
  const roundE=[byId['half_left'], byId['half_right']];
  const roundF=[byId['final']];
  return {
    rounds:[roundA,roundB,roundC,roundD,roundE,roundF],
    customLabels:['48強','32強','16強','8強','4強','決賽']
  };
}
function xuanleMain48SeedLocation(seedNum){
  const matches=buildXuanleMain48Matches();
  for(let i=0;i<matches.length;i++){
    const m=matches[i];
    for(let j=0;j<m.slots.length;j++){
      if(m.slots[j] && m.slots[j].seed===seedNum) return {matchId:m.id, slotIndex:j};
    }
  }
  return null;
}

/* ============ 玄樂盃「初賽→本賽」跨階段自動晉級 ============
   初賽 24 組每組的優勝者，要自動流入本賽 48 強對應的籤位（底圖上印的「入X」），不用使用者手動再貼一次名單。
   實作方式：不倚賴「兩個階段同時掛在畫面上」（同一時間只有一個階段會被渲染在 #output），
   而是直接讀寫 savedBrackets 裡「本賽」那筆存檔的 dom.inputs（跟 snapshotOutputDOM／restoreOutputDOM 用同一份格式），
   這樣不管使用者當下切到哪個階段，資料都能正確流過去、重新整理頁面或雲端同步後也不會遺失。
     - pushXuanleChampionToMain：初賽某組確定優勝者時呼叫（見 toggleWinner／clearSlotDownstream 裡的 match.target 掛勾），
       如果本賽當下就是畫面上顯示的階段，順便更新畫面；不管有沒有顯示，都會寫回存檔。
     - pullXuanlePrelimChampionsIntoMain：本賽第一次產生賽程表時呼叫，把「初賽」當下已經確定的優勝者一次帶進來
       （避免使用者是先做完初賽、隔一段時間才產生本賽的情況，錯過即時 push）。 */
function pushXuanleChampionToMain(targetSlotNum, name){
  const mainKey = bracketKey('xuanle', 1);
  const rec = savedBrackets[mainKey];
  if(!rec) return;
  const loc = xuanleMain48SeedLocation(targetSlotNum);
  if(!loc) return;
  const mainStageId = rec.stConfig.id;
  const elId = inputId(mainStageId, loc.matchId, loc.slotIndex);
  if(!rec.dom) rec.dom = {inputs:{}, badges:{}, winners:[], losers:[]};
  if(!rec.dom.inputs) rec.dom.inputs = {};
  rec.dom.inputs[elId] = name || '';
  if(activeBracketKey === mainKey){
    const el = document.getElementById(elId);
    if(el) el.value = name || '';
    if(zhRedrawFns[mainStageId]) zhRedrawFns[mainStageId]();
  }
  saveState();
}
function pullXuanlePrelimChampionsIntoMain(mainStageId){
  const prelimKey = bracketKey('xuanle', 0);
  const rec = savedBrackets[prelimKey];
  if(!rec || !rec.dom || !rec.dom.inputs) return;
  const prelimStageId = rec.stConfig.id;
  buildXuanlePrelimGroups().forEach(function(g){
    const champMatch = g.matches[g.matches.length-1];
    if(!champMatch.target) return;
    const elId = inputId(prelimStageId, champMatch.id, 0);
    const name = rec.dom.inputs[elId] || '';
    if(!name) return;
    const loc = xuanleMain48SeedLocation(champMatch.target);
    if(loc) setSlotName(mainStageId, loc.matchId, loc.slotIndex, name);
  });
}

/* 量測單一字元「實際畫出來的墨色像素」相對錨點的左右/上下偏移量。
   不倚賴 measureText 回報的字寬或 actualBoundingBox（不同電腦、不同字型對這些 API 的實作可能不準），
   而是真的把字畫到一個小畫布上、逐像素掃出墨色範圍，這樣不管使用者電腦最後套用哪個字型繪製，都能量到「真正畫出來的位置」去校正。 */
const __zhInkScratch = document.createElement('canvas');
function measureInkOffset(ch, fontSize, family){
  const size = Math.ceil(fontSize*2.6);
  if(__zhInkScratch.width!==size){ __zhInkScratch.width=size; __zhInkScratch.height=size; }
  const sctx = __zhInkScratch.getContext('2d');
  sctx.clearRect(0,0,size,size);
  sctx.font = '700 '+fontSize+'px '+family;
  sctx.textAlign='center'; sctx.textBaseline='middle';
  sctx.fillStyle = '#000';
  const anchor = size/2;
  sctx.fillText(ch, anchor, anchor);
  const data = sctx.getImageData(0,0,size,size).data;
  let minX=null,maxX=null,minY=null,maxY=null;
  for(let py=0; py<size; py++){
    for(let px=0; px<size; px++){
      if(data[(py*size+px)*4+3] > 20){
        if(minX===null||px<minX) minX=px;
        if(maxX===null||px>maxX) maxX=px;
        if(minY===null||py<minY) minY=py;
        if(maxY===null||py>maxY) maxY=py;
      }
    }
  }
  if(minX===null) return {dx:0, dy:0};
  return { dx: (minX+maxX)/2 - anchor, dy: (minY+maxY)/2 - anchor };
}

/* 依格子寬高把一個姓名畫到 canvas 上；兩字姓名比照三字格線，只寫第1、第3格，中間留白對齊；
   字級會先估算，再用實際量測寬度動態縮小，確保完整落在格子內、水平置中不貼邊。
   同一套邏輯同時給「畫面上的即時預覽」跟「下載賽程圖」用，兩邊才會長得一樣。 */
/* 整張賽程表要用同一個字級，不要每一格自己依格子/姓名字數各算各的：
   固定用「4字格」的比例反推字級（用比較保守、比較小的4格空間去除，確保連4個字的姓名都塞得下），
   這樣不管姓名是2個字還是4個字，畫出來的單字大小都一樣，只是2字姓名會有留白，不會放大填滿。
   w,h 用整張賽程表裡「一般格子」的代表尺寸算一次即可（各格子的w/h本來就幾乎一樣）。 */
function computeStandardZhFontSize(w, h){
  return Math.max(7, Math.min(w*0.86, (h/4)*0.76));
}
function drawZhName(ctx, name, x, y, w, h, fixedFontSize){
  if(!name) return;
  const chars = name.split('');
  const family = '"Noto Sans CJK TC","Noto Sans TC",sans-serif';
  const gridCount = chars.length===2 ? 3 : Math.max(chars.length,1);
  /* fixedFontSize：整張賽程表統一用同一個字級畫姓名，不要每一格自己依照「這格實際w/h」「這個姓名幾個字」
     各自動態算字級——不然姓名字數不同、格子偵測出來的大小有一點點落差，畫出來就會大小不一。
     呼叫端（doRedraw／下載合成圖）統一算好一個字級傳進來；沒有傳的話（例如舊的呼叫沒改）才退回原本這格自己算。 */
  let fontSize = fixedFontSize || Math.max(7, Math.min(w*0.86, (h/gridCount)*0.76));
  function measureMax(size){
    ctx.font = '700 '+size+'px '+family;
    let m=0;
    chars.forEach(function(ch){ m=Math.max(m, ctx.measureText(ch).width); });
    return m;
  }
  const widthLimit = w*0.86;
  while(fontSize>7 && measureMax(fontSize)>widthLimit){ fontSize -= 1; }
  ctx.font = '700 '+fontSize+'px '+family;
  ctx.fillStyle = '#151515';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const lineHeight = fontSize*1.25;
  const startY = y + h/2 - (lineHeight*gridCount)/2 + lineHeight/2;
  const cx = x + w/2;

  /* === 暫時的診斷標記：畫一條螢光綠豎線標出程式認定的「格子水平中心」，
     用來確認問題到底是「格子中心算錯」還是「文字沒畫在中心上」。之後會拿掉。 === */
  if(window.__ZH_DEBUG_CENTERLINE){
    ctx.save();
    ctx.strokeStyle = '#39FF14'; ctx.lineWidth = Math.max(1, fontSize*0.03);
    ctx.beginPath(); ctx.moveTo(cx, y); ctx.lineTo(cx, y+h); ctx.stroke();
    /* 同時畫出程式認定的整個格子外框，方便一次比對「程式認定的格子」跟「底圖真正印出來的格子」差多少 */
    ctx.strokeStyle = '#FF00E5'; ctx.lineWidth = Math.max(1, fontSize*0.025);
    ctx.strokeRect(x, y, w, h);
    /* 直接把這個格子當下用的 x,y,w,h（百分比）印在旁邊，這樣不用靠肉眼比對圖片，直接讀數字就知道程式現在認定的格子在哪。
       注意：下載圖那邊的 canvas 為了畫質有先 ctx.scale() 放大過，canvas.width/height 已經不是原圖的真實寬高，
       之前這裡直接拿 canvas.width/height 去算百分比，算出來的數字就跟著縮水、是錯的——用 getTransform() 量出目前的縮放倍率換算回真實寬高，才會對 */
    const zhTf = ctx.getTransform();
    const trueCanvasW = ctx.canvas.width / (zhTf.a || 1);
    const trueCanvasH = ctx.canvas.height / (zhTf.d || 1);
    ctx.fillStyle = '#0047FF';
    ctx.font = '700 '+Math.max(10, fontSize*0.28)+'px monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    const pctX = (x/trueCanvasW*100).toFixed(2);
    const pctY = (y/trueCanvasH*100).toFixed(2);
    const pctW = (w/trueCanvasW*100).toFixed(2);
    const pctH = (h/trueCanvasH*100).toFixed(2);
    ctx.fillText('x'+pctX+' y'+pctY, x+w+4, y);
    ctx.fillText('w'+pctW+' h'+pctH, x+w+4, y+fontSize*0.32);
    ctx.restore();
  }

  function drawCentered(ch, cy){
    /* 用實際畫出來的墨色像素校正錨點，確保視覺上真的置中，不會偏一邊 */
    const off = measureInkOffset(ch, fontSize, family);
    ctx.fillText(ch, cx - off.dx, cy - off.dy);
  }

  if(chars.length===2){
    drawCentered(chars[0], startY);
    drawCentered(chars[1], startY+lineHeight*2);
  } else {
    chars.forEach(function(ch,i){
      drawCentered(ch, startY+lineHeight*i);
    });
  }
}

/* 暫時的除錯開關：打開後畫面上會多畫一條螢光綠豎線標出程式認定的格子中心，方便對照文字有沒有真的畫在中心上 */
function toggleZhDebugCenterline(){
  window.__ZH_DEBUG_CENTERLINE = !window.__ZH_DEBUG_CENTERLINE;
  alert(window.__ZH_DEBUG_CENTERLINE ? '除錯模式已開啟：畫面上會出現螢光綠豎線標出格子中心。' : '除錯模式已關閉。');
  Object.keys(zhRedrawFns).forEach(function(id){ zhRedrawFns[id](); });
}

const zhRedrawFns = {};

/* 2026-09-18新增：底圖從內嵌base64換成獨立圖片檔之後，圖片要多花一次網路來回才能顯示，
   網路不好時畫面會有一段「輸入框/連接線都出現了，底圖還是空白」的空窗期，容易讓使用者
   誤以為壞掉。所有疊圖賽事（renderXxxOverlay）都在「wrap.appendChild(img)」之後立刻呼叫
   這個共用函式，補一個「圖片載入中...」的提示，img真的load完才拿掉；如果真的載入失敗
   （例如檔案路徑打錯、網站沒發布成功），會改顯示「圖片載入失敗」，不會讓使用者一直誤會
   是網路慢、實際上是圖片真的壞了。 */
function attachOverlayLoadingHint(wrap, img){
  if(img.complete && img.naturalWidth){ return; } /* 已經從瀏覽器快取秒讀完，不用顯示提示 */
  const hint = document.createElement('div');
  hint.className = 'zh-loading-hint';
  hint.textContent = '圖片載入中…';
  wrap.appendChild(hint);
  img.addEventListener('load', function(){ hint.remove(); });
  img.addEventListener('error', function(){ hint.textContent = '⚠ 圖片載入失敗，請檢查網路連線或重新整理頁面'; });
}



/* ============ 快棋爭霸戰・初賽 疊圖：跟中環碁聖賽用同一套自動校正邏輯，
   只是改吃 KUAIQI7_PRELIM_COORDS。獨立寫一份（不共用 ZH62 那份），
   是為了不要動到中環碁聖賽那邊已經測過、要用在真實比賽的程式碼。 */
let __kuaiqi7PrelimCoordsRefined = false;
function refineKuaiqi7PrelimCoordsFromImage(img){
  if(__kuaiqi7PrelimCoordsRefined) return;
  if(!img.naturalWidth) return;
  __kuaiqi7PrelimCoordsRefined = true;
  try{
    const nw = img.naturalWidth, nh = img.naturalHeight;
    const tmp = document.createElement('canvas');
    tmp.width = nw; tmp.height = nh;
    const tctx = tmp.getContext('2d');
    tctx.drawImage(img, 0, 0, nw, nh);
    const data = tctx.getImageData(0, 0, nw, nh).data;

    function isBorderColor(x, y){
      if(x<0||x>=nw||y<0||y>=nh) return false;
      const idx = (y*nw+x)*4;
      const r=data[idx], g=data[idx+1], b=data[idx+2];
      const isWhiteish = r>230 && g>230 && b>230;
      if(isWhiteish) return false;
      const maxc=Math.max(r,g,b), minc=Math.min(r,g,b);
      const isBackgroundish = r>195 && r<248 && g>205 && g<252 && b>195 && b<248 && (maxc-minc)<28;
      if(isBackgroundish) return false;
      return true;
    }
    function mode(votes){
      let bestK=null, bestV=-1;
      for(const k in votes){ if(votes[k]>bestV){ bestV=votes[k]; bestK=parseInt(k,10); } }
      return bestK!==null ? {val:bestK, count:bestV} : null;
    }
    const isChampKey = function(key){ return key.indexOf('_champ_0')!==-1; };

    const candidates = [];
    Object.keys(KUAIQI7_PRELIM_COORDS).forEach(function(key){
      const coord = KUAIQI7_PRELIM_COORDS[key];
      const gx = coord.x/100*nw, gy = coord.y/100*nh, gw = coord.w/100*nw, gh = coord.h/100*nh;
      const pad = Math.max(3, gw*0.2);
      const sx0 = Math.max(0, Math.round(gx - pad));
      const sx1 = Math.min(nw, Math.round(gx + gw + pad));
      const y0 = Math.round(gy + gh*0.12);
      const y1 = Math.round(gy + gh*0.88);
      if(y1<=y0 || sx1<=sx0) return;

      const leftVotes = {}, rightVotes = {};
      for(let y=y0; y<y1; y++){
        let leftX=null;
        for(let x=sx0; x<sx1; x++){ if(isBorderColor(x,y)){ leftX=x; break; } }
        if(leftX!==null) leftVotes[leftX] = (leftVotes[leftX]||0)+1;
        let rightX=null;
        for(let x=sx1-1; x>=sx0; x--){ if(isBorderColor(x,y)){ rightX=x; break; } }
        if(rightX!==null) rightVotes[rightX] = (rightVotes[rightX]||0)+1;
      }
      const totalRows = y1-y0;
      const lm = mode(leftVotes), rm = mode(rightVotes);
      if(!lm || !rm) return;
      if(lm.count < totalRows*0.35 || rm.count < totalRows*0.35) return;
      const newW = rm.val - lm.val;
      if(newW < gw*0.5 || newW > gw*1.8) return;
      const newCenter = (lm.val+rm.val)/2, guessCenter = gx+gw/2;
      if(Math.abs(newCenter-guessCenter) > gw*0.6) return;

      candidates.push({key, coord, leftPx:lm.val, widthPx:newW});
    });

    /* 晉級框（_champ）比一般輸入格寬很多，跟大家比中位數寬度一定會被判定「差太多」而放棄校正，
       所以晉級框自己跟晉級框比中位數，一般輸入格跟一般輸入格比，分開處理才公平 */
    let fixedCount = 0;
    ['normal','champ'].forEach(function(kind){
      const group = candidates.filter(function(c){ return isChampKey(c.key) === (kind==='champ'); });
      if(!group.length) return;
      const widths = group.map(function(c){ return c.widthPx; }).sort(function(a,b){ return a-b; });
      const medianW = widths[Math.floor(widths.length/2)];
      group.forEach(function(c){
        if(c.widthPx < medianW*0.75 || c.widthPx > medianW*1.25) return;
        c.coord.x = c.leftPx/nw*100;
        c.coord.w = c.widthPx/nw*100;
        fixedCount++;
      });
    });

    function isFullWidthBorderRow(y, gx, gw){
      const xStart = Math.max(0, Math.round(gx-2));
      const xEnd = Math.min(nw, Math.round(gx+gw+2));
      if(xEnd<=xStart) return false;
      let cnt=0, total=0;
      for(let x=xStart; x<xEnd; x++){ total++; if(isBorderColor(x,y)) cnt++; }
      return (cnt/total) > 0.55;
    }

    let fixedCountH = 0;
    Object.keys(KUAIQI7_PRELIM_COORDS).forEach(function(key){
      const coord = KUAIQI7_PRELIM_COORDS[key];
      const gx = coord.x/100*nw, gy = coord.y/100*nh, gw = coord.w/100*nw, gh = coord.h/100*nh;
      const padY = Math.max(3, gh*0.15);
      const sy0 = Math.max(0, Math.round(gy - padY));
      const sy1 = Math.min(nh, Math.round(gy + gh + padY));
      if(sy1<=sy0) return;

      const topCandidates = [], botCandidates = [];
      [0.2, 0.35, 0.65, 0.8].forEach(function(frac){
        const sx = Math.round(gx + gw*frac);
        if(sx<0 || sx>=nw) return;
        let topY=null;
        for(let y=sy0; y<sy1; y++){ if(isBorderColor(sx,y)){ topY=y; break; } }
        if(topY!==null) topCandidates.push(topY);
        let botY=null;
        for(let y=sy1-1; y>=sy0; y--){ if(isBorderColor(sx,y)){ botY=y; break; } }
        if(botY!==null) botCandidates.push(botY);
      });

      function robustMedian(arr){
        if(arr.length<3) return null;
        const sorted = arr.slice().sort(function(a,b){ return a-b; });
        const med = sorted[Math.floor(sorted.length/2)];
        const agree = arr.filter(function(v){ return Math.abs(v-med)<=4; }).length;
        if(agree < Math.ceil(arr.length*0.7)) return null;
        return med;
      }
      const topY = robustMedian(topCandidates);
      const botY = robustMedian(botCandidates);
      if(topY==null || botY==null) return;
      if(!isFullWidthBorderRow(topY, gx, gw) || !isFullWidthBorderRow(botY, gx, gw)) return;
      const newH = botY - topY;
      if(newH < gh*0.5 || newH > gh*1.6) return;

      coord.y = topY/nh*100;
      coord.h = newH/nh*100;
      fixedCountH++;
    });

    console.log('[快棋爭霸戰初賽] 格子座標自動校正完成，寬度處理 '+fixedCount+' 個、高度處理 '+fixedCountH+' 個格子。');
  }catch(e){
    console.error('[快棋爭霸戰初賽] 格子座標自動校正失敗，改用預先量好的座標。', e);
  }
}
function reapplyKuaiqi7PrelimCoords(wrap){
  wrap.querySelectorAll('.zh-slot').forEach(function(el){
    const key = el.dataset.zhKey;
    if(!key) return;
    const coord = KUAIQI7_PRELIM_COORDS[key];
    if(!coord) return;
    el.style.left = coord.x+'%'; el.style.top = coord.y+'%';
    el.style.width = coord.w+'%'; el.style.height = coord.h+'%';
  });
}

/* 快棋爭霸戰初賽的格子是寬扁的橫式格子（不是中環碁聖賽那種窄長直式格子），
   姓名整行橫式置中畫一次就好，不用像 drawZhName 那樣逐字直書堆疊。
   字級先用格高抓比例，再用實際量出來的文字寬度動態縮小，確保不超出格寬。 */
function drawNameHorizontal(ctx, name, x, y, w, h){
  if(!name) return;
  const family = '"Noto Sans CJK TC","Noto Sans TC",sans-serif';
  let fontSize = Math.max(10, h*0.7);
  ctx.font = '700 '+fontSize+'px '+family;
  const widthLimit = w*0.9;

/* 棋王賽第20屆初賽/複賽專用：姓名不要整串緊貼著置中畫（那樣字距很擠、格子左右卻留了
   一大片空白，使用者實測後回報「字距有點近，格子裡左右留白有點多」），改成不管幾個字
   都用「兩端對齊」的方式：第一個字貼齊格子左側可用範圍、最後一個字貼齊右側可用範圍，
   中間的字平均分布——這樣同一批籤位裡2字/3字/4字的姓名，第一個字跟最後一個字的位置
   都會對齊到同一條線上，視覺上比整串置中好看，也比較貼近其他官方賽程表姓名的排版習慣。

/* fixedFontSize：整張賽程表統一用同一個字級畫姓名，不要每一格自己依照「這格實際h」各自
   動態算字級——棋王賽第20屆初賽/複賽的格子來源很多種（勝部round1/round2、敗部落點格、
   冠軍格...），量出來的高度本來就有落差（例如複賽的敗部落點格h≈123px，跟敗部合併格
   h≈103px，相差近20%），若各自算字級，同一批姓名看起來會大小不一。呼叫端（doRedraw／
   下載合成圖）統一算好一個字級傳進來；沒有傳的話才退回原本這格自己算（保留給還沒
   更新呼叫的舊程式碼相容用）。
   anchorFrac：兩端對齊範圍的置中點落在格子寬度的哪個比例位置，預設0.5（正中央）。
   目前沒有任何格子在用（見qiwang20FusaiAnchorFrac()），先保留參數給以後真的需要偏移
   對齊時用，anchor偏離正中央時一樣會用「比較窄那一側的可用寬度」夾住，避免爆版。 */
function drawQiwang20Name(ctx, name, x, y, w, h, fixedFontSize, anchorFrac){
  if(!name) return;
  const family = '"Noto Sans CJK TC","Noto Sans TC",sans-serif';
  let fontSize = fixedFontSize!=null ? fixedFontSize : Math.max(10, h*0.7);
  const frac = anchorFrac!=null ? anchorFrac : 0.5;
  const sideMin = Math.min(frac, 1-frac);
  const chars = name.split('');
  const n = chars.length;
  const PAD_FRAC = 0.14; /* 兩端各留一點邊界，不要整個貼齊格子邊緣（使用者確認過在格子內，
     但覺得太貼邊、要再縮進去一點，從0.06調高到0.14） */
  /* outerLimit：「第一個字最左邊那個像素」到「最後一個字最右邊那個像素」之間，允許占用的
     總寬度上限（已經扣掉兩端的留白）。上一版只把每個字的『中心點』限制在這個範圍內，
     沒有再扣掉每個字本身的半個字寬，導致字的實際邊緣（不是中心點）超出格子——這次改成
     先扣掉一個字寬，剩下的範圍才是「中心點可以移動」的範圍（centersRange），這樣中心點
     移到最左/最右時，字本身的邊緣正好貼齊留白邊界，不會再超出去。 */
  const outerLimit = Math.min(w*(1-2*PAD_FRAC), w*sideMin*2*0.95);
  function maxCharWidth(){
    ctx.font = '700 '+fontSize+'px '+family;
    let maxW = 0;
    chars.forEach(function(ch){ const cw = ctx.measureText(ch).width; if(cw>maxW) maxW=cw; });
    return maxW;
  }
  function fits(){
    const cw = maxCharWidth();
    const centersRange = outerLimit - cw;
    if(centersRange < 0) return false;
    if(n<=1) return true;
    const spacing = centersRange/(n-1);
    return spacing >= cw*0.85; /* 相鄰兩字的字距至少要有0.85倍字寬，不然會看起來疊在一起 */
  }
  while(fontSize>10 && !fits()){ fontSize -= 1; }
  ctx.font = '700 '+fontSize+'px '+family;
  const charW = maxCharWidth();
  const centersRange = Math.max(0, outerLimit - charW);
  ctx.fillStyle = '#151515';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const boxCx = x+w*frac, cy = y+h/2;
  const startX = boxCx - centersRange/2;
  chars.forEach(function(ch, i){
    const cx = n>1 ? (startX + centersRange*(i/(n-1))) : boxCx;
    ctx.fillText(ch, cx, cy);
  });
}

function renderKuaiqi7PrelimOverlay(st){

  const wrap = document.createElement('div');

  const canvasEl = document.createElement('canvas');
  canvasEl.className = 'zh-overlay-canvas';
  wrap.appendChild(canvasEl);

  function doRedraw(){
    if(!img.naturalWidth) return;

      if(window.__ZH_DEBUG_CENTERLINE){ drawXuanleDebugOverlay(ctx, slotEl.dataset.zhKey||'', x, y, w, h); }
      if(name) drawNameHorizontal(ctx, name, x, y, w, h);
    });

  zhRedrawFns[stageId] = doRedraw;
  function onImgReady(){
    refineKuaiqi7PrelimCoordsFromImage(img);
    reapplyKuaiqi7PrelimCoords(wrap);
    doRedraw();
  }
  img.addEventListener('load', onImgReady);
  if(img.complete && img.naturalWidth){ onImgReady(); }

  function placeSlot(m, slotIdx){
    const key = m.id+'_'+slotIdx;

    const slot = m.slots[slotIdx];

    container.className = 'zh-slot' + (isDisplayOnly ? ' zh-champion-slot' : '');
    container.dataset.zhKey = key;
    container.style.left = coord.x+'%'; container.style.top = coord.y+'%';
    container.style.width = coord.w+'%'; container.style.height = coord.h+'%';

    const el = document.createElement('input');
    el.type = 'text';
    el.readOnly = true;
    el.id = inputId(stageId, m.id, slotIdx);
    el.className = 'zh-slot-input' + (isDisplayOnly ? ' zh-champion-input' : '');
    if(slot && slot.seed!=null && KUAIQI7_PRELIM_NAMES[slot.seed]){
      el.value = KUAIQI7_PRELIM_NAMES[slot.seed];
    }
    if(!isDisplayOnly){
      container.addEventListener('click', function(){ toggleWinner(stageId, m.id, slotIdx); });
    }
    container.appendChild(el);
    wrap.appendChild(container);

    const badge = document.createElement('span');
    badge.id = seedBadgeId(stageId, m.id, slotIdx);
    badge.className = 'seed-badge';
    badge.style.display = 'none';
    badge.textContent = (slot && slot.seed!=null) ? String(slot.seed) : '';
    wrap.appendChild(badge);
  }

  allMatches.forEach(function(m){
    matchRegistry[stageId][m.id] = m;
    m.slots.forEach(function(slot, slotIdx){ placeSlot(m, slotIdx); });

  doRedraw();

}

let __xuanlePrelimCoordsRefined = false;
let __xuanleMain48CoordsRefined = false;
function refineXuanlePrelimCoordsFromImage(img){
  if(__xuanlePrelimCoordsRefined) return;
  if(!img.naturalWidth) return;
  __xuanlePrelimCoordsRefined = true;
  try{
    const nw = img.naturalWidth, nh = img.naturalHeight;
    const tmp = document.createElement('canvas');
    tmp.width = nw; tmp.height = nh;
    const tctx = tmp.getContext('2d');
    tctx.drawImage(img, 0, 0, nw, nh);
    const data = tctx.getImageData(0, 0, nw, nh).data;

    function isBorderColor(x, y){
      if(x<0||x>=nw||y<0||y>=nh) return false;
      const idx = (y*nw+x)*4;
      const r=data[idx], g=data[idx+1], b=data[idx+2];
      const isWhiteish = r>230 && g>230 && b>230;
      if(isWhiteish) return false;
      const maxc=Math.max(r,g,b), minc=Math.min(r,g,b);
      const isBackgroundish = r>195 && r<248 && g>205 && g<252 && b>195 && b<248 && (maxc-minc)<28;
      if(isBackgroundish) return false;
      return true;
    }
    function mode(votes){
      let bestK=null, bestV=-1;
      for(const k in votes){ if(votes[k]>bestV){ bestV=votes[k]; bestK=parseInt(k,10); } }
      return bestK!==null ? {val:bestK, count:bestV} : null;
    }

    const candidates = [];
    Object.keys(XUANLE_PRELIM_COORDS).forEach(function(key){
      const coord = XUANLE_PRELIM_COORDS[key];
      const gx = coord.x/100*nw, gy = coord.y/100*nh, gw = coord.w/100*nw, gh = coord.h/100*nh;
      const pad = Math.max(3, gw*0.2);
      const sx0 = Math.max(0, Math.round(gx - pad));
      const sx1 = Math.min(nw, Math.round(gx + gw + pad));
      const y0 = Math.round(gy + gh*0.12);
      const y1 = Math.round(gy + gh*0.88);
      if(y1<=y0 || sx1<=sx0) return;

      const leftVotes = {}, rightVotes = {};
      for(let y=y0; y<y1; y++){
        let leftX=null;
        for(let x=sx0; x<sx1; x++){ if(isBorderColor(x,y)){ leftX=x; break; } }
        if(leftX!==null) leftVotes[leftX] = (leftVotes[leftX]||0)+1;
        let rightX=null;
        for(let x=sx1-1; x>=sx0; x--){ if(isBorderColor(x,y)){ rightX=x; break; } }
        if(rightX!==null) rightVotes[rightX] = (rightVotes[rightX]||0)+1;
      }
      const totalRows = y1-y0;
      const lm = mode(leftVotes), rm = mode(rightVotes);
      if(!lm || !rm) return;
      if(lm.count < totalRows*0.35 || rm.count < totalRows*0.35) return;
      const newW = rm.val - lm.val;
      if(newW < gw*0.5 || newW > gw*1.8) return;
      const newCenter = (lm.val+rm.val)/2, guessCenter = gx+gw/2;
      if(Math.abs(newCenter-guessCenter) > gw*0.6) return;

      candidates.push({key, coord, leftPx:lm.val, widthPx:newW});
    });

    let fixedCount = 0;
    if(candidates.length){
      const widths = candidates.map(function(c){ return c.widthPx; }).sort(function(a,b){ return a-b; });
      const medianW = widths[Math.floor(widths.length/2)];
      candidates.forEach(function(c){
        if(c.widthPx < medianW*0.7 || c.widthPx > medianW*1.3) return;
        c.coord.x = c.leftPx/nw*100;
        c.coord.w = c.widthPx/nw*100;
        fixedCount++;
      });
    }

    function isFullWidthBorderRow(y, gx, gw){
      const xStart = Math.max(0, Math.round(gx-2));
      const xEnd = Math.min(nw, Math.round(gx+gw+2));
      if(xEnd<=xStart) return false;
      let cnt=0, total=0;
      for(let x=xStart; x<xEnd; x++){ total++; if(isBorderColor(x,y)) cnt++; }
      return (cnt/total) > 0.55;
    }

    let fixedCountH = 0;
    Object.keys(XUANLE_PRELIM_COORDS).forEach(function(key){
      const coord = XUANLE_PRELIM_COORDS[key];
      const gx = coord.x/100*nw, gy = coord.y/100*nh, gw = coord.w/100*nw, gh = coord.h/100*nh;
      const padY = Math.max(3, gh*0.15);
      const sy0 = Math.max(0, Math.round(gy - padY));
      const sy1 = Math.min(nh, Math.round(gy + gh + padY));
      if(sy1<=sy0) return;

      const topCandidates = [], botCandidates = [];
      [0.2, 0.35, 0.65, 0.8].forEach(function(frac){
        const sx = Math.round(gx + gw*frac);
        if(sx<0 || sx>=nw) return;
        let topY=null;
        for(let y=sy0; y<sy1; y++){ if(isBorderColor(sx,y)){ topY=y; break; } }
        if(topY!==null) topCandidates.push(topY);
        let botY=null;
        for(let y=sy1-1; y>=sy0; y--){ if(isBorderColor(sx,y)){ botY=y; break; } }
        if(botY!==null) botCandidates.push(botY);
      });

      function robustMedian(arr){
        if(arr.length<3) return null;
        const sorted = arr.slice().sort(function(a,b){ return a-b; });
        const med = sorted[Math.floor(sorted.length/2)];
        const agree = arr.filter(function(v){ return Math.abs(v-med)<=4; }).length;
        if(agree < Math.ceil(arr.length*0.7)) return null;
        return med;
      }
      const topY = robustMedian(topCandidates);
      const botY = robustMedian(botCandidates);
      if(topY==null || botY==null) return;
      if(!isFullWidthBorderRow(topY, gx, gw) || !isFullWidthBorderRow(botY, gx, gw)) return;
      const newH = botY - topY;
      if(newH < gh*0.5 || newH > gh*1.6) return;

      coord.y = topY/nh*100;
      coord.h = newH/nh*100;
      fixedCountH++;
    });

    console.log('[玄樂盃初賽] 格子座標自動校正完成，寬度處理 '+fixedCount+' 個、高度處理 '+fixedCountH+' 個格子。');
  }catch(e){
    console.error('[玄樂盃初賽] 格子座標自動校正失敗，改用預先量好的座標。', e);
  }
}

      for(let x=xStart; x<xEnd; x++){ total++; if(isBorderColor(x,y)) cnt++; }
      return (cnt/total) > 0.55;

    let fixedCountH = 0;
    Object.keys(XUANLE_MAIN48_COORDS).forEach(function(key){
      const coord = XUANLE_MAIN48_COORDS[key];
      const gx = coord.x/100*nw, gy = coord.y/100*nh, gw = coord.w/100*nw, gh = coord.h/100*nh;
      const padY = Math.max(3, gh*0.15);
      const sy0 = Math.max(0, Math.round(gy - padY));
      const sy1 = Math.min(nh, Math.round(gy + gh + padY));
      if(sy1<=sy0) return;

      const topCandidates = [], botCandidates = [];
      [0.2, 0.35, 0.65, 0.8].forEach(function(frac){
        const sx = Math.round(gx + gw*frac);
        if(sx<0 || sx>=nw) return;
        let topY=null;
        for(let y=sy0; y<sy1; y++){ if(isBorderColor(sx,y)){ topY=y; break; } }
        if(topY!==null) topCandidates.push(topY);
        let botY=null;
        for(let y=sy1-1; y>=sy0; y--){ if(isBorderColor(sx,y)){ botY=y; break; } }
        if(botY!==null) botCandidates.push(botY);

        if(agree < Math.ceil(arr.length*0.7)) return null;

      const botY = robustMedian(botCandidates);
      if(topY==null || botY==null) return;
      if(!isFullWidthBorderRow(topY, gx, gw) || !isFullWidthBorderRow(botY, gx, gw)) return;
      const newH = botY - topY;

  }catch(e){
    console.error('[玄樂盃本賽48強] 格子座標自動校正失敗，改用預先量好的座標。', e);

function drawXuanleDebugOverlay(ctx, key, x, y, w, h){

  const trueCanvasH = ctx.canvas.height / (zhTf.d || 1);

  const pctY = (y/trueCanvasH*100).toFixed(2);
  const pctW = (w/trueCanvasW*100).toFixed(2);
  const pctH = (h/trueCanvasH*100).toFixed(2);
  ctx.fillText(key, x, Math.max(0, y-fontSize*2.3));
  ctx.fillText('x'+pctX+' y'+pctY, x, Math.max(0, y-fontSize*1.15));
  ctx.fillText('w'+pctW+' h'+pctH, x, y+h+2);

function downloadXuanlePrelimComposite(){
  const debugMode = !!window.__ZH_DEBUG_CENTERLINE;
  const img = new Image();
  img.onload = function(){
    /* 底圖本身已經是很大張的圖，canvas 面積不能無限放大——瀏覽器對單一 canvas 的總像素數有上限，
       算太大 canvas.toBlob() 會直接失敗（實測發生過），所以拿一個安全的總像素預算，
       依照這張圖實際的原始寬高反推可以放多大倍率，而不是每次都用固定倍率 */
    /* 為了方便直接在LINE等通訊軟體上分享、不用下載開檔就能預覽，改成輸出「螢幕看得舒服、
       檔案又夠小」的圖片，不追求列印等級的高解析度。 */
    const SHARE_PIXEL_BUDGET = 9000000;
    const SCALE = Math.min(1, Math.sqrt(SHARE_PIXEL_BUDGET / (img.naturalWidth * img.naturalHeight)));
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth * SCALE;
    canvas.height = img.naturalHeight * SCALE;
    const ctx = canvas.getContext('2d');
    ctx.scale(SCALE, SCALE);
    ctx.drawImage(img, 0, 0);

    document.querySelectorAll('#output .zh-slot').forEach(function(slotEl){
      const inputEl = slotEl.querySelector('.zh-slot-input');
      if(!inputEl) return;
      const name = inputEl.value.trim();
      const x = parseFloat(slotEl.style.left)/100*img.naturalWidth;
      const y = parseFloat(slotEl.style.top)/100*img.naturalHeight;
      const w = parseFloat(slotEl.style.width)/100*img.naturalWidth;
      const h = parseFloat(slotEl.style.height)/100*img.naturalHeight;
      /* 除錯模式下載要跟畫面上看到的一樣，把格子外框＋key名稱＋座標也印進去，這樣才能下載後放大讀數字 */
      if(debugMode){ drawXuanleDebugOverlay(ctx, slotEl.dataset.zhKey||'', x, y, w, h); }
      if(name) drawNameHorizontal(ctx, name, x, y, w, h); /* 與畫面上的即時預覽共用同一套排版邏輯 */
    });

    canvas.toBlob(function(blob){
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = (currentBracket.title||'賽程圖')+'_'+(currentBracket.stageName||'')+(debugMode?'_除錯座標':'')+'.jpg';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 'image/jpeg', 0.85);
  };
  img.src = XUANLE_PRELIM_IMAGE_URL;
}

let __zh69CoordsRefined = false;
function refineZh69CoordsFromImage(img){
  if(__zh69CoordsRefined) return;
  if(!img.naturalWidth) return;
  __zh69CoordsRefined = true;
  try{
    const nw = img.naturalWidth, nh = img.naturalHeight;
    const tmp = document.createElement('canvas');
    tmp.width = nw; tmp.height = nh;
    const tctx = tmp.getContext('2d');
    tctx.drawImage(img, 0, 0, nw, nh);
    const data = tctx.getImageData(0, 0, nw, nh).data;

    function isBorderColor(x, y){
      if(x<0||x>=nw||y<0||y>=nh) return false;
      const idx = (y*nw+x)*4;
      const r=data[idx], g=data[idx+1], b=data[idx+2];
      const isWhiteish = r>230 && g>230 && b>230;
      if(isWhiteish) return false;
      const maxc=Math.max(r,g,b), minc=Math.min(r,g,b);
      const isBackgroundish = r>195 && r<248 && g>205 && g<252 && b>195 && b<248 && (maxc-minc)<28;
      if(isBackgroundish) return false;
      return true;
    }
    function mode(votes){
      let bestK=null, bestV=-1;
      for(const k in votes){ if(votes[k]>bestV){ bestV=votes[k]; bestK=parseInt(k,10); } }
      return bestK!==null ? {val:bestK, count:bestV} : null;
    }
    const isChampKey = function(key){ return key.indexOf('_champion__')!==-1; };

    const candidates = [];
    Object.keys(ZH69_COORDS).forEach(function(key){
      const coord = ZH69_COORDS[key];
      const gx = coord.x/100*nw, gy = coord.y/100*nh, gw = coord.w/100*nw, gh = coord.h/100*nh;
      const pad = Math.max(3, gw*0.2);
      const sx0 = Math.max(0, Math.round(gx - pad));
      const sx1 = Math.min(nw, Math.round(gx + gw + pad));
      const y0 = Math.round(gy + gh*0.12);
      const y1 = Math.round(gy + gh*0.88);
      if(y1<=y0 || sx1<=sx0) return;

      const leftVotes = {}, rightVotes = {};
      for(let y=y0; y<y1; y++){
        let leftX=null;
        for(let x=sx0; x<sx1; x++){ if(isBorderColor(x,y)){ leftX=x; break; } }
        if(leftX!==null) leftVotes[leftX] = (leftVotes[leftX]||0)+1;
        let rightX=null;
        for(let x=sx1-1; x>=sx0; x--){ if(isBorderColor(x,y)){ rightX=x; break; } }
        if(rightX!==null) rightVotes[rightX] = (rightVotes[rightX]||0)+1;
      }
      const totalRows = y1-y0;
      const lm = mode(leftVotes), rm = mode(rightVotes);
      if(!lm || !rm) return;
      if(lm.count < totalRows*0.35 || rm.count < totalRows*0.35) return;
      const newW = rm.val - lm.val;
      if(newW < gw*0.5 || newW > gw*1.8) return;
      const newCenter = (lm.val+rm.val)/2, guessCenter = gx+gw/2;
      if(Math.abs(newCenter-guessCenter) > gw*0.6) return;

      candidates.push({key, coord, leftPx:lm.val, widthPx:newW});
    });

    let fixedCount = 0;
    ['normal','champ'].forEach(function(kind){
      const group = candidates.filter(function(c){ return isChampKey(c.key) === (kind==='champ'); });
      if(!group.length) return;
      const widths = group.map(function(c){ return c.widthPx; }).sort(function(a,b){ return a-b; });
      const medianW = widths[Math.floor(widths.length/2)];
      group.forEach(function(c){
        if(c.widthPx < medianW*0.75 || c.widthPx > medianW*1.25) return;
        c.coord.x = c.leftPx/nw*100;
        c.coord.w = c.widthPx/nw*100;
        fixedCount++;
      });
    });

    function isFullWidthBorderRow(y, gx, gw){
      const xStart = Math.max(0, Math.round(gx-2));
      const xEnd = Math.min(nw, Math.round(gx+gw+2));
      if(xEnd<=xStart) return false;
      let cnt=0, total=0;
      for(let x=xStart; x<xEnd; x++){ total++; if(isBorderColor(x,y)) cnt++; }
      return (cnt/total) > 0.55;
    }

    let fixedCountH = 0;
    Object.keys(ZH69_COORDS).forEach(function(key){
      const coord = ZH69_COORDS[key];
      const gx = coord.x/100*nw, gy = coord.y/100*nh, gw = coord.w/100*nw, gh = coord.h/100*nh;
      const padY = Math.max(3, gh*0.15);
      const sy0 = Math.max(0, Math.round(gy - padY));
      const sy1 = Math.min(nh, Math.round(gy + gh + padY));
      if(sy1<=sy0) return;

      const topCandidates = [], botCandidates = [];
      [0.2, 0.35, 0.65, 0.8].forEach(function(frac){
        const sx = Math.round(gx + gw*frac);
        if(sx<0 || sx>=nw) return;
        let topY=null;
        for(let y=sy0; y<sy1; y++){ if(isBorderColor(sx,y)){ topY=y; break; } }
        if(topY!==null) topCandidates.push(topY);
        let botY=null;
        for(let y=sy1-1; y>=sy0; y--){ if(isBorderColor(sx,y)){ botY=y; break; } }
        if(botY!==null) botCandidates.push(botY);
      });

      function robustMedian(arr){
        if(arr.length<3) return null;
        const sorted = arr.slice().sort(function(a,b){ return a-b; });
        const med = sorted[Math.floor(sorted.length/2)];
        const agree = arr.filter(function(v){ return Math.abs(v-med)<=4; }).length;
        if(agree < Math.ceil(arr.length*0.7)) return null;
        return med;
      }
      const topY = robustMedian(topCandidates);
      const botY = robustMedian(botCandidates);
      if(topY==null || botY==null) return;
      if(!isFullWidthBorderRow(topY, gx, gw) || !isFullWidthBorderRow(botY, gx, gw)) return;
      const newH = botY - topY;
      if(newH < gh*0.5 || newH > gh*1.6) return;

      coord.y = topY/nh*100;
      coord.h = newH/nh*100;
      fixedCountH++;
    });

  }catch(e){
    console.error('[中環碁聖賽第14屆] 格子座標自動校正失敗，改用預先量好的座標。', e);
  }
}

/* 中環碁聖賽第14屆・決賽三番戰：把「決賽」(zh69_136，兩位準決賽勝者匯流進來的那場) 目前兩個 slot
   的姓名，複製進三番戰三局（zh69_game0/1/2）各自的 slot0/slot1——三局打的都是同一組對手，
   所以三局的姓名永遠一樣，只有「哪一局哪一邊贏」是各局自己分開記錄（用同一套 toggleWinner 機制，
   點名字標記那一局的勝方，跟其他對戰格用法完全一樣）。只複製姓名，不動 winner/loser 標記，
   這樣使用者已經標記過的某一局結果不會因為這裡重新同步就被洗掉。 */
function syncZh69GamesFromFinal(stageId){

  const nameB = getSlotName(stageId, 'zh69_136', 1);
  const seedA = getSlotSeed(stageId, 'zh69_136', 0);

  ['zh69_game0','zh69_game1','zh69_game2'].forEach(function(gid){
    setSlotName(stageId, gid, 0, nameA, seedA);

  });

/* 決賽三番戰三戰兩勝：三局裡只要同一邊贏了兩局，就是最終冠軍，自動帶入最上面那個
   唯一、橫式、不可點擊的「冠軍格」（跟其他晉級後顯示格是同一種設計：靠程式自動算出來寫進去，
   不是使用者自己點的）。每次任何一局的勝負被標記/取消，或決賽兩位選手改變時都要重算一次。 */
function updateZh69Champion(stageId){
  if(!matchRegistry[stageId] || !matchRegistry[stageId]['zh69_champion']) return;
  let wins0 = 0, wins1 = 0;
  ['zh69_game0','zh69_game1','zh69_game2'].forEach(function(gid){
    const s0 = document.getElementById(slotWrapId(stageId, gid, 0));
    const s1 = document.getElementById(slotWrapId(stageId, gid, 1));
    if(s0 && s0.classList.contains('winner')) wins0++;
    if(s1 && s1.classList.contains('winner')) wins1++;
  });
  const nameA = getSlotName(stageId, 'zh69_136', 0);
  const nameB = getSlotName(stageId, 'zh69_136', 1);
  if(wins0>=2 && nameA){
    setSlotName(stageId, 'zh69_champion', 0, nameA, getSlotSeed(stageId, 'zh69_136', 0));
  } else if(wins1>=2 && nameB){
    setSlotName(stageId, 'zh69_champion', 0, nameB, getSlotSeed(stageId, 'zh69_136', 1));
  } else {
    setSlotName(stageId, 'zh69_champion', 0, '', '');
  }
}

/* ============ 中環國手賽 第22屆本賽（70人）疊圖模式 ============
   跟中環碁聖賽第14屆（69人）同一套「像素連通元件偵測＋連線幾何追蹤法」量出來的
   （不是肉眼看圖猜的）：偵測所有格子的像素座標，再從每個格子往上追蹤連接線實際走到哪個格子，
   自動重建整棵對戰樹，最後用「所有籤位由左到右排序」編出 01-70 的籤號，
   跟底圖上實際印的籤號逐一核對過（左邊/右邊兩端各對過一次），完全吻合。
   最終結構：1回賽22場（44人）、2回賽16場、3回賽16場、16強賽8場、8強賽4場、4強賽2場、
   挑戰者決定賽1場，共69場比賽（70人單淘汰理論上就是70-1=69場，數字對得起來）。
   這屆的底圖跟中環碁聖賽第14屆共用同一套格子網格版型（同一位設計師的固定模板，只是換了年份/配色），
   band2~band7（2回賽~挑戰者決定賽，含冠軍格）的像素座標經比對後跟zh69完全一致，只有1回賽（最底層）
   的格數/位置不同（70人比69人多1場1回賽），這是唯一需要重新量測的部分。
   跟中環碁聖賽不同：這屆決賽（挑戰者決定賽）是單場定生死，沒有三戰兩勝，所以冠軍格直接用
   一般賽事共用的 __champion__ advanceTo 機制自動帶入，不需要 zh69 那種三局同步的特殊邏輯。 */
const GS22_IMAGE_URL = 'images/guoshou22.jpg';

/* 中環國手賽第22屆：這個函式定義了，但目前刻意「沒有」在 onImgReady 裡呼叫（見下面 renderGuoshou22Overlay）。
   本來想仿照 refineZh69CoordsFromImage 那套「掃描實際印刷邊框顏色，把量測時猜的座標貼齊真正格線」的做法，
   但實測發現這套邊框偵測對這張底圖不夠可靠：邊框顏色（muted紫色）跟白色格子之間有一段anti-alias漸層色，
   剛好會被「排除背景色」那段判斷誤吃掉，導致同一張圖裡有些格子校正成功、有些失敗，且失敗率遠高於zh69
   （zh69約70%成功，這張只有約51%），造成畫面上格子大小/字級不一致，比完全不校正更糟。
   最後採用的做法：直接在 Python 用「鎖定邊框顏色做色差比對」量出這張圖真正的邊框到邊框尺寸，
   跟中環碁聖賽第14屆（同一套設計模板）比對後發現兩者幾乎完全一樣（寬~1.056%、高~4.91%），
   於是直接把這組「已知正確」的統一尺寸寫死進 GS22_COORDS（見上面座標表，所有一般籤位格子
   都已經是同一個寬高，只有中心點不同），不需要也不應該再讓這個函式在執行期把它蓋掉。
   **教訓**：這種「掃描邊框顏色貼齊格線」的自動校正heuristic，換一張新底圖時不能照抄就假設一定管用，
   一定要實測校正後的寬高分佈是否收斂成一致的值（像zh69那樣136個格子幾乎全部收斂到同一個數字），
   如果收斂率明顯偏低、跑出好幾群不同的「校正後」數字，代表這次校正不可靠，應該回頭用更嚴謹的方式
   （例如直接鎖定邊框顏色做色差比對，而不是「排除白色+排除背景色」這種間接判斷法）重新量一次，
   把結果直接寫死進座標表，而不是繼續依賴一個實測會產生不一致結果的執行期校正函式。 */
let __gs22CoordsRefined = false;
function refineGuoshou22CoordsFromImage(img){
  if(__gs22CoordsRefined) return;
  if(!img.naturalWidth) return;
  __gs22CoordsRefined = true;
  try{
    const nw = img.naturalWidth, nh = img.naturalHeight;
    const tmp = document.createElement('canvas');
    tmp.width = nw; tmp.height = nh;
    const tctx = tmp.getContext('2d');
    tctx.drawImage(img, 0, 0, nw, nh);
    const data = tctx.getImageData(0, 0, nw, nh).data;

    function isBorderColor(x, y){
      if(x<0||x>=nw||y<0||y>=nh) return false;
      const idx = (y*nw+x)*4;
      const r=data[idx], g=data[idx+1], b=data[idx+2];
      const isWhiteish = r>230 && g>230 && b>230;
      if(isWhiteish) return false;
      const maxc=Math.max(r,g,b), minc=Math.min(r,g,b);
      const isBackgroundish = r>195 && r<248 && g>205 && g<252 && b>195 && b<248 && (maxc-minc)<28;
      if(isBackgroundish) return false;
      return true;
    }
    function mode(votes){
      let bestK=null, bestV=-1;
      for(const k in votes){ if(votes[k]>bestV){ bestV=votes[k]; bestK=parseInt(k,10); } }
      return bestK!==null ? {val:bestK, count:bestV} : null;
    }
    const isChampKey = function(key){ return key.indexOf('_champion__')!==-1; };

    const candidates = [];
    Object.keys(GS22_COORDS).forEach(function(key){
      const coord = GS22_COORDS[key];
      const gx = coord.x/100*nw, gy = coord.y/100*nh, gw = coord.w/100*nw, gh = coord.h/100*nh;
      const pad = Math.max(3, gw*0.2);
      const sx0 = Math.max(0, Math.round(gx - pad));
      const sx1 = Math.min(nw, Math.round(gx + gw + pad));
      const y0 = Math.round(gy + gh*0.12);
      const y1 = Math.round(gy + gh*0.88);
      if(y1<=y0 || sx1<=sx0) return;

      const leftVotes = {}, rightVotes = {};
      for(let y=y0; y<y1; y++){
        let leftX=null;
        for(let x=sx0; x<sx1; x++){ if(isBorderColor(x,y)){ leftX=x; break; } }
        if(leftX!==null) leftVotes[leftX] = (leftVotes[leftX]||0)+1;
        let rightX=null;
        for(let x=sx1-1; x>=sx0; x--){ if(isBorderColor(x,y)){ rightX=x; break; } }
        if(rightX!==null) rightVotes[rightX] = (rightVotes[rightX]||0)+1;
      }
      const totalRows = y1-y0;
      const lm = mode(leftVotes), rm = mode(rightVotes);
      if(!lm || !rm) return;
      if(lm.count < totalRows*0.35 || rm.count < totalRows*0.35) return;
      const newW = rm.val - lm.val;
      if(newW < gw*0.5 || newW > gw*1.8) return;
      const newCenter = (lm.val+rm.val)/2, guessCenter = gx+gw/2;
      if(Math.abs(newCenter-guessCenter) > gw*0.6) return;

      candidates.push({key, coord, leftPx:lm.val, widthPx:newW});
    });

    let fixedCount = 0;
    ['normal','champ'].forEach(function(kind){
      const group = candidates.filter(function(c){ return isChampKey(c.key) === (kind==='champ'); });
      if(!group.length) return;
      const widths = group.map(function(c){ return c.widthPx; }).sort(function(a,b){ return a-b; });
      const medianW = widths[Math.floor(widths.length/2)];
      group.forEach(function(c){
        if(c.widthPx < medianW*0.75 || c.widthPx > medianW*1.25) return;
        c.coord.x = c.leftPx/nw*100;
        c.coord.w = c.widthPx/nw*100;
        fixedCount++;
      });
    });

    function isFullWidthBorderRow(y, gx, gw){
      const xStart = Math.max(0, Math.round(gx-2));
      const xEnd = Math.min(nw, Math.round(gx+gw+2));
      if(xEnd<=xStart) return false;
      let cnt=0, total=0;
      for(let x=xStart; x<xEnd; x++){ total++; if(isBorderColor(x,y)) cnt++; }
      return (cnt/total) > 0.55;
    }

    let fixedCountH = 0;
    Object.keys(GS22_COORDS).forEach(function(key){
      const coord = GS22_COORDS[key];
      const gx = coord.x/100*nw, gy = coord.y/100*nh, gw = coord.w/100*nw, gh = coord.h/100*nh;
      const padY = Math.max(3, gh*0.15);
      const sy0 = Math.max(0, Math.round(gy - padY));
      const sy1 = Math.min(nh, Math.round(gy + gh + padY));
      if(sy1<=sy0) return;

      const topCandidates = [], botCandidates = [];
      [0.2, 0.35, 0.65, 0.8].forEach(function(frac){
        const sx = Math.round(gx + gw*frac);
        if(sx<0 || sx>=nw) return;
        let topY=null;
        for(let y=sy0; y<sy1; y++){ if(isBorderColor(sx,y)){ topY=y; break; } }
        if(topY!==null) topCandidates.push(topY);
        let botY=null;
        for(let y=sy1-1; y>=sy0; y--){ if(isBorderColor(sx,y)){ botY=y; break; } }
        if(botY!==null) botCandidates.push(botY);
      });

      function robustMedian(arr){
        if(arr.length<3) return null;
        const sorted = arr.slice().sort(function(a,b){ return a-b; });
        const med = sorted[Math.floor(sorted.length/2)];
        const agree = arr.filter(function(v){ return Math.abs(v-med)<=4; }).length;
        if(agree < Math.ceil(arr.length*0.7)) return null;
        return med;
      }
      const topY = robustMedian(topCandidates);
      const botY = robustMedian(botCandidates);
      if(topY==null || botY==null) return;
      if(!isFullWidthBorderRow(topY, gx, gw) || !isFullWidthBorderRow(botY, gx, gw)) return;
      const newH = botY - topY;
      if(newH < gh*0.5 || newH > gh*1.6) return;

      coord.y = topY/nh*100;
      coord.h = newH/nh*100;
      fixedCountH++;
    });

    console.log('[中環國手賽第22屆] 格子座標自動校正完成，寬度處理 '+fixedCount+' 個、高度處理 '+fixedCountH+' 個格子。');
  }catch(e){
    console.error('[中環國手賽第22屆] 格子座標自動校正失敗，改用預先量好的座標。', e);
  }
}
function reapplyGuoshou22Coords(wrap){
  wrap.querySelectorAll('.zh-slot').forEach(function(el){
    const key = el.dataset.zhKey;
    if(!key) return;
    const coord = GS22_COORDS[key];
    if(!coord) return;
    el.style.left = coord.x+'%'; el.style.top = coord.y+'%';
    el.style.width = coord.w+'%'; el.style.height = coord.h+'%';
  });
}

function renderGuoshou22Overlay(st){
  const stageId = st.id;
  const data = buildGuoshou22Rounds();

  const wrap = document.createElement('div');
  wrap.className = 'zh-overlay-wrap';
  const img = document.createElement('img');
  img.src = GS22_IMAGE_URL;
  img.className = 'zh-overlay-img';
  img.draggable = false;
  wrap.appendChild(img);
  attachOverlayLoadingHint(wrap, img);

  const canvasEl = document.createElement('canvas');
  canvasEl.className = 'zh-overlay-canvas';
  wrap.appendChild(canvasEl);

  function doRedraw(){
    if(!img.naturalWidth) return;
    if(canvasEl.width!==img.naturalWidth || canvasEl.height!==img.naturalHeight){
      canvasEl.width = img.naturalWidth; canvasEl.height = img.naturalHeight;
    }
    const ctx = canvasEl.getContext('2d');
    ctx.clearRect(0,0,canvasEl.width,canvasEl.height);
    const __refSlotGs = wrap.querySelector('.zh-slot:not(.zh-champion-slot)');
    const __stdFontGs = __refSlotGs ? computeStandardZhFontSize(
      parseFloat(__refSlotGs.style.width)/100*canvasEl.width,
      parseFloat(__refSlotGs.style.height)/100*canvasEl.height
    ) : null;
    wrap.querySelectorAll('.zh-slot:not(.zh-champion-slot)').forEach(function(slotEl){
      const inputEl = slotEl.querySelector('.zh-slot-input');
      if(!inputEl) return;
      const name = inputEl.value.trim();
      if(!name) return;
      const x = parseFloat(slotEl.style.left)/100*canvasEl.width;
      const y = parseFloat(slotEl.style.top)/100*canvasEl.height;
      const w = parseFloat(slotEl.style.width)/100*canvasEl.width;
      const h = parseFloat(slotEl.style.height)/100*canvasEl.height;
      drawZhName(ctx, name, x, y, w, h, __stdFontGs);
    });
    /* 冠軍格：橫式置中粗體字，格子本身很寬扁，跟其他籤位的直式姓名畫法（drawZhName）不一樣 */
    const champSlotEl = wrap.querySelector('.zh-champion-slot[data-zh-key="__champion___0"]');
    if(champSlotEl){
      const cIn = champSlotEl.querySelector('.zh-slot-input');
      const cName = cIn ? cIn.value.trim() : '';
      if(cName){
        const cx = parseFloat(champSlotEl.style.left)/100*canvasEl.width;
        const cy = parseFloat(champSlotEl.style.top)/100*canvasEl.height;
        const cw = parseFloat(champSlotEl.style.width)/100*canvasEl.width;
        const ch = parseFloat(champSlotEl.style.height)/100*canvasEl.height;
        const champFamily = '"Noto Sans CJK TC","Noto Sans TC",sans-serif';
        let fontSize = Math.max(9, ch*0.6);
        ctx.font = '700 '+fontSize+'px '+champFamily;
        const widthLimit = cw*0.92;
        while(fontSize>9 && ctx.measureText(cName).width>widthLimit){
          fontSize -= 1;
          ctx.font = '700 '+fontSize+'px '+champFamily;
        }
        ctx.fillStyle = '#151515';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(cName, cx+cw/2, cy+ch/2);
      }
    }
  }
  zhRedrawFns[stageId] = doRedraw;
  function onImgReady(){ doRedraw(); }
  img.addEventListener('load', onImgReady);
  if(img.complete && img.naturalWidth){ onImgReady(); }

  function placeSlot(m, slotIdx){
    const key = m.id+'_'+slotIdx;
    const coord = GS22_COORDS[key];
    if(!coord) return;
    const slot = m.slots[slotIdx];

    const container = document.createElement('div');
    container.id = slotWrapId(stageId, m.id, slotIdx);
    container.className = 'zh-slot';
    container.dataset.zhKey = key;
    container.style.left = coord.x+'%'; container.style.top = coord.y+'%';
    container.style.width = coord.w+'%'; container.style.height = coord.h+'%';

    const el = document.createElement('input');
    el.type = 'text';
    el.readOnly = true;
    el.id = inputId(stageId, m.id, slotIdx);
    el.className = 'zh-slot-input';
    container.addEventListener('click', function(){ toggleWinner(stageId, m.id, slotIdx); });
    container.appendChild(el);
    wrap.appendChild(container);

    const badge = document.createElement('span');
    badge.id = seedBadgeId(stageId, m.id, slotIdx);
    badge.className = 'seed-badge';
    badge.style.display = 'none';
    badge.textContent = (slot && slot.seed!=null) ? String(slot.seed) : '';
    wrap.appendChild(badge);
  }

  data.rounds.forEach(function(round){
    round.forEach(function(m){
      matchRegistry[stageId][m.id] = m;
      m.slots.forEach(function(slot, slotIdx){ placeSlot(m, slotIdx); });
    });
  });

  /* 冠軍格：底圖最上面唯一一個橫式的格子（兩條半區冠軍線匯流終點），跟中環碁聖賽用同一組
     .zh-champion-slot/.zh-champion-input class 慣例——不可點擊，姓名靠 advanceTo 自動寫入，
     下載合成圖那邊完全不用另外寫邏輯，只要 class 掛對就會自動被抓到。 */
  const champCoord = GS22_COORDS['__champion___0'];
  if(champCoord){
    const container = document.createElement('div');
    container.id = slotWrapId(stageId, '__champion__', 0);
    container.className = 'zh-slot zh-champion-slot';
    container.dataset.zhKey = '__champion___0';
    container.style.left=champCoord.x+'%'; container.style.top=champCoord.y+'%';
    container.style.width=champCoord.w+'%'; container.style.height=champCoord.h+'%';
    const el = document.createElement('input');
    el.type='text'; el.readOnly=true;
    el.id = inputId(stageId, '__champion__', 0);
    el.className = 'zh-slot-input zh-champion-input';
    container.appendChild(el);
    wrap.appendChild(container);
    const badge=document.createElement('span');
    badge.id=seedBadgeId(stageId,'__champion__',0);
    badge.style.display='none';
    wrap.appendChild(badge);

    data.rounds[data.rounds.length-1][0].advanceTo={matchId:'__champion__', slotIndex:0};
    matchRegistry[stageId]['__champion__']={id:'__champion__', slots:[{}], advanceTo:null};
    data.hasChampion = true;
  }

  doRedraw();
  return {wrap, data};
}
function downloadGuoshou22Composite(){
  /* 底圖本身已經是很大張的圖，canvas 面積不能無限放大——瀏覽器對單一 canvas 的總像素數有上限，
     算太大 canvas.toBlob() 會直接失敗，所以拿一個安全的總像素預算，依照這張圖實際的原始寬高
     反推可以放多大倍率，而不是每次都用固定倍率（這是玄樂盃本賽48強踩過的坑，之後新的疊圖
     下載功能都應該比照這個寫法）。 */
  const img = new Image();
  img.onload = function(){
    /* 為了方便直接在LINE等通訊軟體上分享、不用下載開檔就能預覽，改成輸出「螢幕看得舒服、
       檔案又夠小」的圖片，不追求列印等級的高解析度。 */
    const SHARE_PIXEL_BUDGET = 9000000;
    const SCALE = Math.min(1, Math.sqrt(SHARE_PIXEL_BUDGET / (img.naturalWidth * img.naturalHeight)));
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth * SCALE;
    canvas.height = img.naturalHeight * SCALE;
    const ctx = canvas.getContext('2d');
    ctx.scale(SCALE, SCALE);
    ctx.drawImage(img, 0, 0);

    const __refSlotDl = document.querySelector('#output .zh-slot:not(.zh-champion-slot)');
    const __stdFontDl = __refSlotDl ? computeStandardZhFontSize(
      parseFloat(__refSlotDl.style.width)/100*img.naturalWidth,
      parseFloat(__refSlotDl.style.height)/100*img.naturalHeight
    ) : null;
    document.querySelectorAll('#output .zh-slot').forEach(function(slotEl){
      const inputEl = slotEl.querySelector('.zh-slot-input');
      if(!inputEl) return;
      const name = inputEl.value.trim();
      if(!name) return;
      const isChampion = inputEl.classList.contains('zh-champion-input');
      const x = parseFloat(slotEl.style.left)/100*img.naturalWidth;
      const y = parseFloat(slotEl.style.top)/100*img.naturalHeight;
      const w = parseFloat(slotEl.style.width)/100*img.naturalWidth;
      const h = parseFloat(slotEl.style.height)/100*img.naturalHeight;

      if(isChampion){
        const champFamily = '"Noto Sans CJK TC","Noto Sans TC",sans-serif';
        let fontSize = Math.max(11, h*0.6);
        ctx.font = '700 '+fontSize+'px '+champFamily;
        const widthLimit = w*0.92;
        while(fontSize>11 && ctx.measureText(name).width>widthLimit){
          fontSize -= 1;
          ctx.font = '700 '+fontSize+'px '+champFamily;
        }
        ctx.fillStyle = '#151515';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(name, x+w/2, y+h/2);
      } else {
        drawZhName(ctx, name, x, y, w, h, __stdFontDl); /* 與畫面上的即時預覽共用同一套排版邏輯 */
      }
    });

    canvas.toBlob(function(blob){
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = (currentBracket.title||'賽程圖')+'_'+(currentBracket.stageName||'')+'.jpg';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 'image/jpeg', 0.85);
  };
  img.src = GS22_IMAGE_URL;
}
