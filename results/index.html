<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>海峰棋院成績查詢</title><style>
/* 介面照舊系統（haifonggo.azurewebsites.net）的樣子：橘色選單列、藍色標籤＋淡綠輸入框、
   橘色按鈕、橘色表頭＋灰白相間的粗體表格。 */
:root{
  --nav:#D86018;
  --nav-text:#fff;
  --welcome:#ADFF2F;
  --label:#87CEFA;
  --input:#E6FFE6;
  --btn:#FFA500;
  --th:#FF8000;
  --zebra:#F2F2F2;
  --border:#000;
  --ok:#15803d;
  --bad:#c0392b;
  --font:Arial,"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:#fff;color:#000;font-family:var(--font);}
.nav{position:sticky;top:0;z-index:50;background:var(--nav);box-shadow:0 2px 5px rgba(0,0,0,.2);display:flex;justify-content:center;align-items:stretch;flex-wrap:wrap;min-height:46px;padding:0 10px;}
.nav button{background:var(--nav);color:var(--nav-text);border:none;font:700 18px var(--font);padding:6px 14px;cursor:pointer;border-right:2px solid #fff;}
.nav button:hover{background:#c0530f;}
.nav button.on{background:#FF7F50;}
.btn.blue{background:#0a7cff;border-color:#0a5fc0;}
.btn.red{background:#ff1a1a;border-color:#b30000;}
.btn.small{min-height:34px;font-size:16px;padding:4px 14px;}
.modal-box.wide{max-width:640px;}
.modal-box .row{grid-template-columns:150px 1fr;}
/* 批次修改頁：照舊系統，標題文字在上、欄位在下，一行一個，「確定修改」橫跨整排 */
.batch-box{padding:18px 22px;}
.blabel{display:block;font-weight:700;font-size:20px;margin:16px 0 6px;}
.blabel:first-child{margin-top:4px;}
.bfield{width:100%;height:46px;border:1px solid #000;border-radius:5px;font:20px var(--font);padding:0 10px;background:var(--input);}
.bfield.plain{background:#fff;border-color:#ccc;}
.bfield.plain:focus{outline:none;border-color:#000;background:#A6F3A6;}
#bxCount{background:#f7f7f7;}
.btn.bxgo{width:100%;margin-top:24px;min-height:48px;font-size:21px;}
/* 段位三頁（查詢段位勝場／升段提醒／段位設定）：照舊系統，字和格子都比查詢頁更大 */
#viewDanPlayers .lbl,#viewDanRemind .lbl{font-size:26px;min-height:46px;}
#viewDanPlayers .row input[type=text],#viewDanRemind .row input[type=text],#viewDanRemind .row select,#viewDanRemind .datesel select{height:46px;font-size:24px;}
#viewDanPlayers .row,#viewDanRemind .row{grid-template-columns:minmax(120px,240px) 1fr;margin:9px 0;}
#viewDanPlayers .btn,#viewDanRemind .btn,#viewDanRules .btn{font-size:21px;min-height:48px;padding:8px 18px;}
table.grid.dan th{font-size:22px;padding:10px 6px;}
table.grid.dan td{font-size:25px;padding:5px 6px;}
table.grid.dan .btn.small{font-size:19px;min-height:38px;padding:3px 18px;}
.dan-detail{font-size:19px;line-height:1.7;}
.dan-detail b{color:#c0392b;}
.nav #navAdminItems{display:flex;flex-wrap:wrap;}
.nav .welcome{color:var(--welcome);font-weight:700;font-size:18px;display:flex;align-items:center;padding:0 8px;}
/* 跟舊系統一樣撐滿畫面寬度（左右留一點邊） */
.page{margin:20px 24px 60px;}
.page.wide{max-width:1300px;margin-left:auto;margin-right:auto;padding:0 24px;}
/* 查詢表單：寬螢幕兩欄（棋士｜對手、起始年｜結束年…，順序跟舊系統一樣），窄螢幕一欄 */
.qgrid{display:grid;grid-template-columns:1fr;column-gap:16px;}
@media (min-width:900px){ .qgrid{grid-template-columns:1fr 1fr;} }
.box{border:1px solid #000;border-radius:5px;padding:8px 10px;box-shadow:0 2px 6px rgba(0,0,0,.2);background:#fff;}
.row{display:grid;grid-template-columns:minmax(100px,190px) 1fr;gap:14px;align-items:center;margin:7px 0;}
.lbl{background:var(--label);border:1px solid #000;border-radius:5px;font-weight:700;font-size:22px;text-align:center;padding:2px 4px;min-height:36px;display:flex;align-items:center;justify-content:center;}
.inp,.row select,.row input[type=text]{width:100%;height:36px;background:var(--input);border:1px solid #000;border-radius:5px;font:22px var(--font);padding:0 8px;color:#000;}
.row input[type=text]:focus,.row select:focus{outline:none;background:#A6F3A6;border-width:2px;}
/* 打字時跳出的名字清單：照舊系統，貼在輸入框正下方、同寬的長方形清單（不用瀏覽器內建的 datalist，那個外觀改不了） */
.ac-wrap{position:relative;width:100%;}
.ac-list{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid #888;border-top:none;z-index:60;max-height:260px;overflow-y:auto;box-shadow:0 2px 6px rgba(0,0,0,.15);}
.ac-list div{padding:4px 10px;font-size:21px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ac-list div.on,.ac-list div:hover{background:#dbeafe;}
.inp.checks{display:flex;align-items:center;justify-content:center;gap:16px;height:auto;min-height:36px;padding:2px 8px;font-size:20px;flex-wrap:wrap;}
.inp.checks label{display:flex;align-items:center;gap:4px;cursor:pointer;}
.inp.checks input{width:21px;height:21px;}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--btn);color:#fff;border:1px solid #333;border-radius:5px;font:700 19px var(--font);padding:7px 16px;min-height:42px;box-shadow:0 2px 4px rgba(0,0,0,.2);cursor:pointer;}
.btn:hover{filter:brightness(1.07);}
.btn:disabled{opacity:.5;cursor:default;filter:none;}
.btn.wide{width:230px;}
.btn.gray{background:#888;}
.center{text-align:center;margin:10px 0;}
.status{font-size:16px;color:#444;text-align:center;margin:8px 0 0;}
.status-ok{color:var(--ok);font-weight:700;}
.status-bad{color:var(--bad);font-weight:700;}
.hint{font-size:15px;color:#555;margin:4px 0;}
.grid-wrap{overflow-x:auto;margin-top:16px;}
table.grid{border-collapse:collapse;width:100%;font-weight:700;}
table.grid th{background:var(--th);color:#fff;border:1px solid var(--border);padding:7px;font-size:18px;white-space:nowrap;}
table.grid th.sortable{cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
table.grid td{border:1px solid var(--border);padding:5px 6px;text-align:center;font-size:19px;white-space:nowrap;}
table.grid tr:nth-child(even) td{background:var(--zebra);}
/* 表格字型完全照舊系統的條件：舊系統的表格「沒有指定任何字型」、網頁語言標成英文（lang="en"），
   所以瀏覽器用預設字型：英文數字 Times New Roman、中文由 Edge 自動配新細明體並自動加粗。
   這裡用 font-family:initial（＝回到瀏覽器預設字型）＋表格標 lang="en"（見 renderSummary／renderDetails）重現同樣效果。
   試過指定「新細明體」或改用思源宋體，使用者都覺得不像（2026-10-02）。 */
table.grid{font-family:initial;font-weight:bold;}
/* 滑鼠移到哪一列，那一列變橘色（舊系統也是這樣），對照長表格比較不會看錯行 */
table.grid tr:not(:first-child):hover td{background:#FFB020;}
/* 明細欄寬照舊系統的比例：日期、大類、小類固定很短，留給賽名、階段最多空間 */
table.grid.detail{table-layout:auto;}
table.grid.detail col.c-date{width:8%;}
table.grid.detail col.c-cat{width:3.5%;}
table.grid.detail col.c-ev{width:26%;}
table.grid.detail col.c-st{width:24%;}
table.grid.detail col.c-name{width:8%;}
table.grid.detail col.c-mv{width:10%;}
table.grid.detail th{font-size:20px;}
table.grid.detail td{font-size:21px;padding:6px 8px;}
table.grid.detail td.small{font-size:18px;}
table.grid td.left{text-align:left;white-space:normal;}
table.grid a{color:#000;}
.result-title{font-weight:700;font-size:22px;margin:22px 0 0;scroll-margin-top:56px;}
/* 管理功能頁：照舊系統 ImportData 頁的「功能1～6」排法 */
.admin-box{border:1px solid #000;border-radius:8px;padding:10px;margin-bottom:18px;}
.arow{display:grid;grid-template-columns:minmax(90px,200px) 1fr;gap:10px;align-items:start;margin:8px 0;}
.arow .lbl{min-height:50px;font-size:22px;}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.acts .btn{min-height:50px;font-size:20px;}
.acts select,.acts input[type=text],.acts input[type=password]{height:46px;background:var(--input);border:1px solid #000;border-radius:5px;font:20px var(--font);padding:0 8px;min-width:90px;}
.datesel{display:flex;gap:6px;flex-wrap:wrap;}
.datesel select{flex:1;min-width:80px;height:46px;background:var(--input);border:1px solid #000;border-radius:5px;font:20px var(--font);padding:0 8px;}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:15px;font-weight:700;border:1px solid #333;}
.pill.new{background:#dcfce7;}
.pill.exists{background:#eee;}
.pill.problem{background:#fde2e2;}
.tabs{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap;}
.tabs button{border:1px solid #333;background:#fff;border-radius:16px;padding:5px 14px;font:700 16px var(--font);cursor:pointer;}
.tabs button.on{background:var(--th);color:#fff;}
.local-banner{background:#fff3c4;border:1px solid #e0c060;border-radius:6px;padding:6px 10px;font-size:16px;margin:10px auto 0;max-width:760px;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal-box{background:#fff;border:1px solid #000;border-radius:8px;padding:22px;width:100%;max-width:440px;box-shadow:0 8px 32px rgba(0,0,0,.25);}
.modal-box h2{margin:0 0 10px;font-size:23px;}
.login-error{margin-top:8px;font-size:16px;color:var(--bad);min-height:1.2em;}
@media (max-width:560px){
  .row{grid-template-columns:96px 1fr;gap:8px;}
  .lbl{font-size:18px;}
  .inp,.row select,.row input[type=text]{font-size:18px;}
  .arow{grid-template-columns:1fr;}
  .nav button{font-size:16px;padding:5px 9px;}
  table.grid td{font-size:16px;}
  table.grid.dan td{font-size:19px;}
  table.grid.dan th{font-size:17px;}
  #viewDanPlayers .lbl,#viewDanRemind .lbl{font-size:20px;}
  table.grid.detail td{font-size:17px;}
  table.grid.detail td.small{font-size:14px;}
}
</style>
</head>
<body>
<nav class="nav">
  <button type="button" id="navQuery" class="on" onclick="showView('query')">HAIFONGGO首頁</button>
  <span id="navAdminItems" style="display:none;">
    <button type="button" id="navAdmin" onclick="showView('admin')">比賽資料</button>
    <button type="button" id="navBatch" onclick="showView('batch')">批次修改</button>
    <button type="button" id="navDanPlayers" onclick="showView('danPlayers')">查詢段位勝場</button>
    <button type="button" id="navDanRemind" onclick="showView('danRemind')">升段提醒</button>
    <button type="button" id="navDanRules" onclick="showView('danRules')">段位設定</button>
    <button type="button" onclick="notYet('帳號管理')">帳號管理</button>
  </span>
  <button type="button" id="navLogin" onclick="reLogin()">重新登入</button>
  <span class="welcome" id="welcome">歡迎~~ 使用者</span>
</nav>
<div id="localBanner" class="local-banner" style="display:none;">⚠️ 本機測試模式：資料只存在這台電腦的瀏覽器裡，不會連到雲端。</div>

<!-- ============ 查詢頁 ============ -->
<div id="viewQuery" class="page">
  <div class="box qgrid">
    <div class="row"><div class="lbl">棋士</div><div class="ac-wrap"><input type="text" id="qPlayer" autocomplete="off"></div></div>
    <div class="row"><div class="lbl">對手</div><div class="ac-wrap"><input type="text" id="qOpp" autocomplete="off"></div></div>
    <div class="row"><div class="lbl">起始年</div><select id="qYearFrom"></select></div>
    <div class="row"><div class="lbl">結束年</div><select id="qYearTo"></select></div>
    <div class="row"><div class="lbl">大類</div><select id="qCat1"><option value=""></option><option>國內</option><option>國際</option></select></div>
    <div class="row"><div class="lbl">小類</div><select id="qCat2"><option value=""></option><option>交流</option><option>正式</option><option>限制</option></select></div>
    <div class="row"><div class="lbl">賽名</div><div class="ac-wrap"><input type="text" id="qEvent" autocomplete="off"></div></div>
    <div class="row"><div class="lbl">階段</div><input type="text" id="qStage" autocomplete="off"></div>
    <div class="row"><div class="lbl">目數</div><input type="text" id="qMoves" autocomplete="off"></div>
    <div class="row"><div class="lbl">顯示明細</div><div class="inp checks"><input type="checkbox" id="qDetails"></div></div>
  </div>
  <div class="center"><button type="button" class="btn wide" onclick="runQuery()">查詢</button></div>
  <div class="status" id="dataStatus">資料載入中…</div>

  <div id="resultArea" style="display:none;">
    <div class="result-title" id="resultTitle"></div>
    <div id="summaryArea"></div>
    <div class="center"><button type="button" class="btn wide" onclick="window.scrollTo({top:0,behavior:'smooth'})">回到上方</button></div>
    <div id="detailArea"></div>
    <div class="center" id="detailTopBtn" style="display:none;"><button type="button" class="btn wide" onclick="window.scrollTo({top:0,behavior:'smooth'})">回到上方</button></div>
  </div>
</div>

<!-- ============ 管理功能頁（登入後） ============ -->
<div id="viewAdmin" class="page wide" style="display:none;">
  <div class="admin-box">
    <div class="arow"><div class="lbl">功能 1</div>
      <div>
        <div class="acts">
          <button type="button" class="btn" onclick="document.getElementById('upFile').click()">上傳比賽資料 (Excel)</button>
          <input type="file" id="upFile" accept=".xlsx,.xls" style="display:none;">
          <span class="hint">欄位：年份、日期、大類、小類、賽名、階段、執黑、執白、勝方、目數；分頁名稱不拘。系統裡已經有的同一局會自動略過。</span>
        </div>
        <div id="upPreview"></div>
      </div>
    </div>
  </div>

  <div class="admin-box">
    <div class="arow"><div class="lbl">起始日期</div><div class="datesel" id="dlFrom"></div></div>
    <div class="arow"><div class="lbl">結束日期</div><div class="datesel" id="dlTo"></div></div>
    <div class="arow"><div class="lbl">比賽名稱</div><div class="acts"><div class="ac-wrap" style="max-width:320px;"><input type="text" id="dlEvent" autocomplete="off" style="width:100%;"></div><span class="hint">比賽名稱可只打一部分</span></div></div>
    <div class="arow"><div class="lbl">功能 2</div>
      <div class="acts">
        <button type="button" class="btn" onclick="downloadRange('year')">下載比賽資料 (年份-賽名)</button>
        <button type="button" class="btn" onclick="downloadRange('event')">下載比賽資料 (賽名)</button>
      </div>
    </div>
    <div class="arow"><div class="lbl">功能 3</div>
      <div class="acts">
        <button type="button" class="btn" onclick="downloadAll('year')">下載全部比賽 (年份-賽名)</button>
        <button type="button" class="btn" onclick="downloadAll('event')">下載全部比賽 (賽名)</button>
      </div>
    </div>
    <div class="arow"><div class="lbl">功能 4</div>
      <div>
        <div class="acts">
          <button type="button" class="btn" onclick="downloadDanPlayers()">下載段位資料</button>
          <button type="button" class="btn" onclick="document.getElementById('danUpFile').click()">上傳段位資料 (Excel)</button>
          <input type="file" id="danUpFile" accept=".xlsx,.xls" style="display:none;">
        </div>
        <div id="danUpPreview"></div>
      </div>
    </div>
    <div class="arow"><div class="lbl">功能 5</div>
      <div class="acts">
        <button type="button" class="btn" onclick="deleteAll()">刪除所有比賽資料</button>
        <span class="hint">會清空整個系統，刪除前請先用功能 3 下載備份</span>
      </div>
    </div>
    <div class="arow"><div class="lbl">功能 6</div>
      <div>
        <div class="acts">
          <button type="button" class="btn" onclick="deleteEvent()">刪除單一比賽資料</button>
          <div class="ac-wrap" style="max-width:240px;"><input type="text" id="delEvent" autocomplete="off" placeholder="比賽名稱" style="width:100%;"></div>
          <select id="delYear"><option value="">全部年份</option></select>
        </div>
        <div class="hint" id="delStatus"></div>
      </div>
    </div>
  </div>
</div>

<!-- ============ 批次修改（照舊系統：改錯字、選手改名） ============ -->
<div id="viewBatch" class="page" style="display:none;">
  <div class="box batch-box">
    <label class="blabel" for="bxType">請選擇 類別</label>
    <select id="bxType" class="bfield" onchange="batchCount()">
      <option value="player">選手名稱</option>
      <option value="ev">賽名</option>
      <option value="st">階段</option>
    </select>
    <label class="blabel" for="bxFrom">請輸入 原始名稱</label>
    <div class="ac-wrap"><input type="text" id="bxFrom" class="bfield plain" autocomplete="off"></div>
    <label class="blabel">符合的資料 有幾筆</label>
    <input type="text" id="bxCount" class="bfield plain" readonly>
    <label class="blabel" for="bxTo">請輸入 修改後名稱</label>
    <input type="text" id="bxTo" class="bfield plain" autocomplete="off">
    <button type="button" class="btn bxgo" onclick="runBatch()">確定修改</button>
    <div class="status" id="bxStatus"></div>
  </div>
</div>

<!-- ============ 查詢段位勝場（照舊系統：查詢／新增／編輯／刪除每位棋士的段位紀錄） ============ -->
<div id="viewDanPlayers" class="page" style="display:none;">
  <div class="box">
    <div class="row"><div class="lbl">棋士</div><div class="ac-wrap"><input type="text" id="dpName" autocomplete="off"></div></div>
  </div>
  <div class="center">
    <button type="button" class="btn" onclick="runDanPlayers()">查詢棋士段位</button>
    <button type="button" class="btn" onclick="openDanPlayerModal(-1)">新增棋士段位</button>
  </div>
  <div class="status" id="dpStatus"></div>
  <div id="dpResult"></div>
</div>

<!-- ============ 升段提醒（照舊系統：依結算日期算出每位棋士升段還差幾勝，由少到多排序） ============ -->
<div id="viewDanRemind" class="page" style="display:none;">
  <div class="box">
    <div class="row"><div class="lbl">棋士</div><div class="ac-wrap"><input type="text" id="drName" autocomplete="off"></div></div>
    <div class="row"><div class="lbl">結算日期</div><div class="datesel" id="drDate"></div></div>
    <div class="row"><div class="lbl">段位</div><select id="drDan"></select></div>
  </div>
  <div class="center"><button type="button" class="btn" onclick="runDanRemind()">查詢可升段棋士</button></div>
  <div class="status" id="drStatus"></div>
  <div id="drResult"></div>
</div>

<!-- ============ 段位設定（各段位升段需要的勝場數） ============ -->
<div id="viewDanRules" class="page" style="display:none;">
  <div class="center">
    <button type="button" class="btn" onclick="runDanRules()">現有段位設定</button>
    <button type="button" class="btn" onclick="openDanRuleModal(-1)">新增段位設定</button>
  </div>
  <div class="status" id="rlStatus"></div>
  <div id="rlResult"></div>
</div>

<!-- 段位相關共用的彈出視窗（新增／編輯／升段明細） -->
<div id="danModal" class="modal-overlay" style="display:none;">
  <div class="modal-box wide">
    <h2 id="danModalTitle"></h2>
    <div id="danModalBody"></div>
    <div class="login-error" id="danModalError"></div>
    <div class="center" id="danModalActions"></div>
  </div>
</div>

<div id="loginModal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <h2>管理登入</h2>
    <p class="hint">用賽程表同一組帳號登入。查詢不用登入。</p>
    <div class="row"><div class="lbl" style="font-size:16px;">帳號</div><input type="text" id="loginEmail" autocomplete="username" placeholder="Email"></div>
    <div class="row"><div class="lbl" style="font-size:16px;">密碼</div><input type="password" id="loginPw" class="inp" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div class="login-error" id="loginError"></div>
    <div class="center">
      <button type="button" class="btn" id="loginSubmit" onclick="doLogin()">登入</button>
      <button type="button" class="btn gray" onclick="closeLogin()">取消</button>
    </div>
  </div>
</div>

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function norm(s){ return String(s==null?'':s).replace(/\s+/g,'').trim(); }
function rowToGame(y, r){ return { y:String(y), d:r[0]||'', c1:r[1]||'', c2:r[2]||'', ev:r[3]||'', st:r[4]||'', b:r[5]||'', w:r[6]||'', win:r[7]||'', mv:r[8]||'' }; }
function gameToRow(g){ return [g.d,g.c1,g.c2,g.ev,g.st,g.b,g.w,g.win,g.mv]; }
function gameKey(g){ return [g.y,g.d,g.ev,g.st,g.b,g.w].map(norm).join('|'); }
function dateNum(g){ const m = String(g.d).match(/^(\d{1,2})\.(\d{1,2})$/); return m ? Number(g.y)*10000+Number(m[1])*100+Number(m[2]) : Number(g.y)*10000; }
function sortGames(list){
  return list.sort((a,b)=> (b.y+b.d).localeCompare(a.y+a.d) || a.ev.localeCompare(b.ev,'zh-Hant') || a.st.localeCompare(b.st,'zh-Hant'));
}

/* ============ 資料存取：Firebase 或本機測試 ============ */
function groupByYear(games){
  const by = {};
  games.forEach(g=>{ (by[g.y] = by[g.y] || []).push(g); });
  return by;
}
async function loadData(forceServer){
  if(LOCAL_MODE){
    let saved = null;
    try{ saved = JSON.parse(localStorage.getItem(LOCAL_DB_KEY) || 'null'); }catch(e){}
    GAMES = [];
    if(saved){ Object.keys(saved.years).forEach(y=>{ saved.years[y].forEach(r=>GAMES.push(rowToGame(y,r))); }); dataVersion = saved.version; }
    return;
  }
  const col = fb.db.collection('results');
  const metaSnap = await col.doc('meta').get(forceServer ? {source:'server'} : undefined);
  const meta = metaSnap.exists ? metaSnap.data() : null;
  if(!meta){ GAMES = []; dataVersion = 0; return; }
  if(!forceServer){
    try{
      const cache = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if(cache && cache.version === meta.version){
        GAMES = [];
        Object.keys(cache.years).forEach(y=>{ cache.years[y].forEach(r=>GAMES.push(rowToGame(y,r))); });
        dataVersion = meta.version;
        return;
      }
    }catch(e){}
  }
  const snap = await col.get(forceServer ? {source:'server'} : undefined);
  const years = {};
  GAMES = [];
  snap.forEach(doc=>{
    /* 只讀「y2016、y2017…」這種年份文件；meta、danPlayers（段位資料）、danRules（段位設定）不是對局 */
    if(!/^y\d{4}$/.test(doc.id)) return;
    const d = doc.data();
    const rows = JSON.parse(d.rows || '[]');
    years[d.year] = rows;
    rows.forEach(r=>GAMES.push(rowToGame(d.year, r)));
  });
  dataVersion = meta.version;
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({version:dataVersion, years})); }catch(e){}
}
/* 把「這些年份」整年的資料寫回去（上傳／刪除共用）。changedYears 裡的年份如果已經沒有任何對局，就刪掉那份文件。 */
async function saveYears(changedYears){
  const by = groupByYear(GAMES);
  const version = Date.now();
  const counts = {};
  Object.keys(by).forEach(y=>{ counts[y] = by[y].length; });
  if(LOCAL_MODE){
    const years = {};
    Object.keys(by).forEach(y=>{ years[y] = sortGames(by[y]).map(gameToRow); });
    localStorage.setItem(LOCAL_DB_KEY, JSON.stringify({version, years}));
    dataVersion = version;
    return;
  }
  const col = fb.db.collection('results');
  const batch = fb.db.batch();
  changedYears.forEach(y=>{
    const list = by[y];
    if(!list || list.length===0){ batch.delete(col.doc('y'+y)); return; }
    const json = JSON.stringify(sortGames(list).map(gameToRow));
    if(new Blob([json]).size > DOC_SIZE_LIMIT) throw new Error(y+' 年的資料太大（超過單一文件上限），請聯絡維護的人調整存法');
    batch.set(col.doc('y'+y), { year:String(y), rows:json });
  });
  batch.set(col.doc('meta'), { version, counts, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
  await batch.commit();
  dataVersion = version;
  try{ localStorage.removeItem(CACHE_KEY); }catch(e){}
}

/* ============ 輸入框下方的名字清單（自動完成）============
   照舊系統：打字後，輸入框正下方出現同寬的長方形清單，列出符合的名字；開頭相符的排前面，
   再來是中間有出現的。可以用滑鼠點，也可以用上下鍵＋Enter 選，Esc 關掉。 */
let PLAYER_NAMES = [], EVENT_NAMES = [];
function attachAutocomplete(id, getOptions){
  const input = document.getElementById(id);
  const wrap = input.parentElement;
  const box = document.createElement('div');
  box.className = 'ac-list';
  box.style.display = 'none';
  wrap.appendChild(box);
  let items = [], active = -1;
  function close(){ box.style.display='none'; active=-1; }
  function pick(v){ input.value = v; close(); input.dispatchEvent(new Event('change')); }
  function highlight(){
    [...box.children].forEach((el,i)=>el.classList.toggle('on', i===active));
    if(active>=0 && box.children[active]) box.children[active].scrollIntoView({block:'nearest'});
  }
  function update(){
    const q = norm(input.value);
    if(!q){ close(); return; }
    const all = getOptions();
    const starts = all.filter(n=>norm(n).startsWith(q));
    const mid = all.filter(n=>!norm(n).startsWith(q) && norm(n).indexOf(q)>=0);
    items = starts.concat(mid).slice(0,50);
    if(items.length===0 || (items.length===1 && norm(items[0])===q)){ close(); return; }
    box.innerHTML = items.map(n=>'<div>'+esc(n)+'</div>').join('');
    [...box.children].forEach((el,i)=>el.addEventListener('mousedown', e=>{ e.preventDefault(); pick(items[i]); }));
    active = -1;
    box.style.display = '';
  }
  input.addEventListener('input', update);
  input.addEventListener('focus', update);
  input.addEventListener('blur', ()=>setTimeout(close, 120));
  input.addEventListener('keydown', e=>{
    if(box.style.display==='none') return;
    if(e.key==='ArrowDown'){ e.preventDefault(); active = Math.min(active+1, items.length-1); highlight(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); active = Math.max(active-1, 0); highlight(); }
    else if(e.key==='Enter' && active>=0){ e.preventDefault(); pick(items[active]); }
    else if(e.key==='Escape'){ close(); }
  });
}

/* Edge 重新整理時會把下拉選單「恢復成上一次的選擇」（使用者遇到：預設今年卻一直變成 2016），

/* ============ 查詢 ============
   規則照舊系統：棋士／對手要完整姓名；賽名、階段、目數打一部分就算；小類不勾＝全部。
   有填棋士：第一列是這段期間的合計，下面逐年列出（新到舊）。沒填棋士：列出所有符合條件的棋士，依對局數排序。
   表頭可以點來排序（跟舊系統一樣）；有填棋士時，合計那一列固定在最上面。
   跟舊系統唯一的差別：舊系統會把「勝方欄填了第三個人」的錯誤資料也算進那個人的對局，這裡只算真正下的那兩個人。 */
function readFilters(){
  const c2v = document.getElementById('qCat2').value;
  const c2 = c2v ? [c2v] : [];
  return {
    player: norm(document.getElementById('qPlayer').value),
    opp: norm(document.getElementById('qOpp').value),
    yFrom: document.getElementById('qYearFrom').value,
    yTo: document.getElementById('qYearTo').value,
    c1: document.getElementById('qCat1').value,
    c2,
    ev: norm(document.getElementById('qEvent').value),
    st: norm(document.getElementById('qStage').value),
    mv: norm(document.getElementById('qMoves').value),
    details: document.getElementById('qDetails').checked
  };
}
function baseFilter(f){
  return GAMES.filter(g=>{
    if(f.yFrom && g.y < f.yFrom) return false;
    if(f.yTo && g.y > f.yTo) return false;
    if(f.c1 && g.c1 !== f.c1) return false;
    if(f.c2.length && f.c2.indexOf(g.c2) < 0) return false;
    if(f.ev && norm(g.ev).indexOf(f.ev) < 0) return false;
    if(f.st && norm(g.st).indexOf(f.st) < 0) return false;
    if(f.mv && norm(g.mv).indexOf(f.mv) < 0) return false;
    return true;
  });
}
function newStat(){ return {n:0, win:0, bn:0, bwin:0, wn:0, wwin:0}; }
function addStat(s, g, p){
  const isB = norm(g.b)===p;
  const won = norm(g.win)===p;
  s.n++; if(won) s.win++;
  if(isB){ s.bn++; if(won) s.bwin++; } else { s.wn++; if(won) s.wwin++; }
}
function ratio(a, n){ return n ? a/n : -1; }
function pct(a, n){ return n ? (a*100/n).toFixed(1)+'%' : '0%'; }

/* 統計表的欄位：key 用來排序 */
const SUM_COLS = [
  {t:'棋士', k:r=>r.name},
  {t:'年份', k:r=>r.yearSort},
  {t:'對局數', k:r=>r.s.n},
  {t:'勝數', k:r=>r.s.win},
  {t:'敗數', k:r=>r.s.n-r.s.win},
  {t:'勝率', k:r=>ratio(r.s.win,r.s.n)},
  {t:'執黑勝率', k:r=>ratio(r.s.bwin,r.s.bn)},
  {t:'執白勝率', k:r=>ratio(r.s.wwin,r.s.wn)},
  {t:'執黑局數', k:r=>r.s.bn},
  {t:'執黑勝', k:r=>r.s.bwin},
  {t:'執白局數', k:r=>r.s.wn},
  {t:'執白勝', k:r=>r.s.wwin}
];
let sumState = null; // {pinned, rows, sortCol, sortDir, linkNames}
function renderSummary(){
  const st = sumState;
  let rows = st.rows.slice();
  if(st.sortCol!=null){
    const k = SUM_COLS[st.sortCol].k, dir = st.sortDir;
    rows.sort((a,b)=>{ const x=k(a), y=k(b); return (typeof x==='string' ? String(x).localeCompare(String(y),'zh-Hant') : x-y)*dir; });
  }
  if(st.pinned) rows.unshift(st.pinned);
  let html = '<div class="grid-wrap"><table class="grid" lang="en"><tr>'+SUM_COLS.map((c,i)=>'<th class="sortable" onclick="sortSummary('+i+')">'+c.t+(st.sortCol===i?(st.sortDir>0?' ▲':' ▼'):'')+'</th>').join('')+'</tr>';
  rows.forEach(r=>{
    const s = r.s;
    const name = st.linkNames ? '<a href="#" onclick="return quickPlayer(this.textContent)">'+esc(r.name)+'</a>' : esc(r.name);
    html += '<tr><td>'+name+'</td><td>'+esc(r.year)+'</td><td>'+s.n+'</td><td>'+s.win+'</td><td>'+(s.n-s.win)+'</td><td>'+pct(s.win,s.n)+'</td><td>'+pct(s.bwin,s.bn)+'</td><td>'+pct(s.wwin,s.wn)+'</td><td>'+s.bn+'</td><td>'+s.bwin+'</td><td>'+s.wn+'</td><td>'+s.wwin+'</td></tr>';
  });
  html += '</table></div>';
  document.getElementById('summaryArea').innerHTML = html;
}
function sortSummary(i){
  if(sumState.sortCol===i) sumState.sortDir = -sumState.sortDir;
  else { sumState.sortCol = i; sumState.sortDir = (i<=1) ? 1 : -1; }
  renderSummary();
}

function runQuery(){
  if(GAMES.length===0){ alert('目前系統裡還沒有資料'); return; }
  const f = readFilters();
  const base = baseFilter(f);
  const rangeLabel = (f.yFrom||f.yTo) ? ((f.yFrom||'')+'~'+(f.yTo||'')) : '~';
  let detailGames = [];
  const playerShown = document.getElementById('qPlayer').value.trim();
  const oppShown = document.getElementById('qOpp').value.trim();
  if(f.player){
    const games = base.filter(g=>{
      const b=norm(g.b), w=norm(g.w);
      if(b!==f.player && w!==f.player) return false;
      if(f.opp){ const other = b===f.player ? w : b; if(other!==f.opp) return false; }
      return true;
    });
    detailGames = games;
    const total = newStat(), byYear = {};
    games.forEach(g=>{ addStat(total,g,f.player); addStat(byYear[g.y]=byYear[g.y]||newStat(), g, f.player); });
    document.getElementById('resultTitle').textContent = playerShown + (f.opp ? '　對　'+oppShown : '') + '　共 '+games.length+' 局';
    if(games.length===0){
      sumState = null;
      document.getElementById('summaryArea').innerHTML = '<p class="hint">找不到符合條件的對局。棋士姓名要打完整（可以從輸入框的下拉清單選）。</p>';
    } else {
      sumState = {
        pinned: {name:playerShown, year:rangeLabel, yearSort:'0', s:total},
        rows: Object.keys(byYear).sort().reverse().map(y=>({name:playerShown, year:y, yearSort:y, s:byYear[y]})),
        sortCol:null, sortDir:1, linkNames:false
      };
      renderSummary();
    }
  } else {
    /* 沒填棋士：每一局的兩位選手各記一筆；有填對手的話，只看「跟這位對手下的」那些人 */
    const stats = {};
    const used = [];
    base.forEach(g=>{
      [[g.b,g.w],[g.w,g.b]].forEach(pair=>{
        const p = norm(pair[0]), other = norm(pair[1]);
        if(!p) return;
        if(f.opp && other!==f.opp) return;
        addStat(stats[p] = stats[p] || newStat(), g, p);
      });
      if(!f.opp || norm(g.b)===f.opp || norm(g.w)===f.opp) used.push(g);
    });
    detailGames = used;
    const names = Object.keys(stats).sort((a,b)=> stats[b].n-stats[a].n || stats[b].win-stats[a].win || a.localeCompare(b,'zh-Hant'));
    document.getElementById('resultTitle').textContent = (f.opp ? '所有跟 '+oppShown+' 下過的棋士' : '所有棋士')+'（'+names.length+' 位，點名字可以看個人戰績）';
    if(names.length===0){
      sumState = null;
      document.getElementById('summaryArea').innerHTML = '<p class="hint">找不到符合條件的對局。</p>';
    } else {
      sumState = { pinned:null, rows:names.map(n=>({name:n, year:rangeLabel, yearSort:rangeLabel, s:stats[n]})), sortCol:null, sortDir:1, linkNames:true };
      renderSummary();
    }

/* ============ Excel 下載（功能 2、3）============
   跟舊系統一樣有兩種分頁方式：「年份-賽名」＝每年每個比賽一個分頁；「賽名」＝同一個比賽所有年份放在同一個分頁。 */
function safeSheetName(name, used){
  let s = String(name).replace(/[:\\\/?*\[\]]/g,'_').slice(0,31) || '工作表';
  let base = s, k = 2;
  while(used.has(s)){ const suf='('+(k++)+')'; s = base.slice(0,31-suf.length)+suf; }
  used.add(s);
  return s;
}
function gamesToWorkbook(list, mode){
  const wb = XLSX.utils.book_new();
  const groups = new Map();
  sortGames(list.slice()).forEach(g=>{
    const k = mode==='event' ? g.ev : g.y+'-'+g.ev;
    if(!groups.has(k)) groups.set(k, []);
    groups.get(k).push(g);
  });
  const used = new Set();
  groups.forEach((gs, k)=>{
    /* 分頁順序維持「新的比賽在前面」（跟舊系統一樣）；但分頁裡的對局由舊到新排，
       例如 9/4 在最上面、接著 9/11…（使用者 2026-10-07 要求，舊系統原本是新到舊） */
    gs = gs.slice().sort((a,b)=> dateNum(a)-dateNum(b) || a.ev.localeCompare(b.ev,'zh-Hant') || a.st.localeCompare(b.st,'zh-Hant'));
    const aoa = [HEADERS].concat(gs.map(g=>[g.y,g.d,g.c1,g.c2,g.ev,g.st,g.b,g.w,g.win,g.mv]));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), safeSheetName(k, used));
  });
  if(groups.size===0) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([HEADERS]), '比賽資料');
  return wb;
}
function modeLabel(mode){ return mode==='event' ? '(賽名)' : '(年份-賽名)'; }
function downloadAll(mode){
  if(GAMES.length===0){ alert('目前沒有資料可以下載'); return; }
  XLSX.writeFile(gamesToWorkbook(GAMES, mode), '全部比賽資料'+modeLabel(mode)+'.xlsx');
}
function downloadRange(mode){
  const from = readDateSel('dlFrom'), to = readDateSel('dlTo');
  if(from>to){ alert('起始日期比結束日期晚，請重新選'); return; }
  const ev = norm(document.getElementById('dlEvent').value);
  const list = GAMES.filter(g=>{ const n=dateNum(g); return n>=from && n<=to && (!ev || norm(g.ev).indexOf(ev)>=0); });
  if(list.length===0){ alert('這段期間'+(ev?'、這個比賽':'')+'沒有任何對局'); return; }
  const fmt = n=>String(n);
  XLSX.writeFile(gamesToWorkbook(list, mode), fmt(from)+'~'+fmt(to)+'_比賽資料'+modeLabel(mode)+'.xlsx');
}

/* ============ Excel 上傳（功能 1）============
   每一列分成三種：新的（會匯入）、系統裡已經有（略過）、有問題（預設不匯入，可以勾選照樣匯入）。
   「有問題」的檢查：必填欄位空白、黑白同一人、勝方不是黑也不是白、目數寫的顏色跟勝方對不上、
   同一個檔案裡同一局出現兩次、年份不是四位數、日期不是「月.日」格式。 */
let pendingUpload = null;
function cellStr(v){
  if(v==null) return '';
  if(v instanceof Date) return String(v.getMonth()+1).padStart(2,'0')+'.'+String(v.getDate()).padStart(2,'0');
  return String(v).trim();
}
/* 日期欄：Excel 可能把「09.20」自動變成數字 9.2，這裡轉回「09.20」 */
function normDate(v){
  if(typeof v === 'number' && isFinite(v) && v>0 && v<13){
    const m = Math.floor(v), d = Math.round((v-m)*100);
    return String(m).padStart(2,'0')+'.'+String(d).padStart(2,'0');
  }
  const s = cellStr(v);
  const m = s.match(/^(\d{1,2})[.\/-](\d{1,2})$/);
  return m ? m[1].padStart(2,'0')+'.'+m[2].padStart(2,'0') : s;
}
function checkGame(g){
  const p = [];
  if(!g.y || !g.ev || !g.b || !g.w || !g.win) p.push('必填欄位空白');
  if(g.y && !/^\d{4}$/.test(g.y)) p.push('年份不是四位數');
  if(g.d && !/^\d{2}\.\d{2}$/.test(g.d)) p.push('日期格式不是「月.日」');
  if(g.b && g.w && norm(g.b)===norm(g.w)) p.push('黑白是同一個人');
  else if(g.win && norm(g.win)!==norm(g.b) && norm(g.win)!==norm(g.w)) p.push('勝方不是執黑也不是執白');
  else if(g.win){
    const color = g.mv.charAt(0);
    if(color==='黑' && norm(g.win)!==norm(g.b)) p.push('目數寫黑勝，勝方卻是執白');
    if(color==='白' && norm(g.win)!==norm(g.w)) p.push('目數寫白勝，勝方卻是執黑');
  }
  return p;
}
document.getElementById('upFile').addEventListener('change', async function(e){

  }catch(err){

/* 「同一局」的判斷是照數量比對，不是只看有沒有：真的會有一天下兩盤、而且黑白一樣的情況
   （例如新人王賽循環圈、GLOBIS盃），所以系統裡有幾局同樣的，檔案裡的前幾局就算「已經有」，
   多出來的才算新的。同一個檔案裡出現第二局一樣的，先標成「有問題」讓人確認是不是真的下了兩盤。 */
function countKeys(list){
  const m = new Map();
  list.forEach(g=>{ const k = gameKey(g); m.set(k, (m.get(k)||0)+1); });
  return m;
}
function analyzeUpload(wb, fileName){
  const existingCount = countKeys(GAMES);
  const seenCount = new Map();
  const inFile = new Map();
  const items = [];
  const skippedSheets = [];
  wb.SheetNames.forEach(sn=>{
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, raw:true, defval:null});
    const hIdx = aoa.findIndex(r=>r && r.some(c=>cellStr(c)==='執黑') && r.some(c=>cellStr(c)==='執白'));
    if(hIdx<0){ if(aoa.some(r=>r && r.some(c=>c!=null && c!==''))) skippedSheets.push(sn); return; }
    const col = {};
    aoa[hIdx].forEach((c,i)=>{ const k=cellStr(c); if(HEADERS.indexOf(k)>=0 && col[k]==null) col[k]=i; });
    for(let r=hIdx+1; r<aoa.length; r++){
      const row = aoa[r];
      if(!row || row.every(c=>c==null || String(c).trim()==='')) continue;
      const get = k => col[k]==null ? '' : row[col[k]];
      const g = { y:cellStr(get('年份')).replace(/\.0$/,''), d:normDate(get('日期')), c1:cellStr(get('大類')), c2:cellStr(get('小類')), ev:cellStr(get('賽名')), st:cellStr(get('階段')), b:cellStr(get('執黑')), w:cellStr(get('執白')), win:cellStr(get('勝方')), mv:cellStr(get('目數')) };
      const it = { g, sheet:sn, rowNo:r+1, problems:checkGame(g) };
      const key = gameKey(g);
      const occ = (seenCount.get(key)||0) + 1;
      seenCount.set(key, occ);
      const firstSeen = inFile.get(key);
      if(!firstSeen) inFile.set(key, sn+' 第'+(r+1)+'列');
      if(occ <= (existingCount.get(key)||0)) it.status='exists';
      else {
        if(firstSeen) it.problems.push('跟同一個檔案裡的 '+firstSeen+' 一模一樣（真的一天下了兩盤就勾選照樣匯入）');
        it.status = it.problems.length ? 'problem' : 'new';
      }
      items.push(it);
    }
  });
  pendingUpload = { items, fileName };
  renderUploadPreview(skippedSheets);
}
let upTab = 'problem';
function renderUploadPreview(skippedSheets){
  const area = document.getElementById('upPreview');
  const items = pendingUpload.items;
  const c = {new:0, exists:0, problem:0};
  items.forEach(it=>c[it.status]++);
  if(!c.problem && upTab==='problem') upTab='new';
  let html = '<p style="margin:10px 0 4px;font-weight:700;">「'+esc(pendingUpload.fileName)+'」共 '+items.length+' 局：'+
    '<span class="pill new">新的 '+c.new+'</span> <span class="pill exists">系統裡已經有 '+c.exists+'</span> <span class="pill problem">有問題 '+c.problem+'</span></p>';
  if(skippedSheets && skippedSheets.length) html += '<p class="hint">這幾個分頁找不到「執黑／執白」欄位，已略過：'+skippedSheets.map(esc).join('、')+'</p>';
  html += '<div class="tabs">'+['problem','new','exists'].map(t=>'<button type="button" class="'+(upTab===t?'on':'')+'" onclick="upTab=\''+t+'\';renderUploadPreview()">'+({problem:'有問題',new:'新的',exists:'已經有'})[t]+'（'+c[t]+'）</button>').join('')+'</div>';
  const list = items.filter(it=>it.status===upTab).slice(0,500);
  if(list.length){
    html += '<div class="grid-wrap" style="max-height:340px;overflow:auto;margin-top:4px;"><table class="grid detail" lang="en"><tr>'+(upTab==='problem'?'<th>問題</th>':'')+'<th>執黑</th><th>執白</th><th>勝方</th><th>目數</th><th>年份</th><th>日期</th><th>賽名</th><th>階段</th><th>分頁</th><th>列</th></tr>';
    list.forEach(it=>{
      const g=it.g;
      html += '<tr>'+(upTab==='problem'?'<td class="left" style="color:#c0392b;">'+esc(it.problems.join('；'))+'</td>':'')+'<td>'+esc(g.b)+'</td><td>'+esc(g.w)+'</td><td>'+esc(g.win)+'</td><td>'+esc(g.mv)+'</td><td>'+esc(g.y)+'</td><td>'+esc(g.d)+'</td><td>'+esc(g.ev)+'</td><td>'+esc(g.st)+'</td><td class="small">'+esc(it.sheet)+'</td><td>'+it.rowNo+'</td></tr>';
    });
    html += '</table></div>';
    if(items.filter(it=>it.status===upTab).length>500) html += '<p class="hint">只列出前 500 筆</p>';
  }
  html += '<div class="acts" style="margin-top:10px;">';
  if(c.problem) html += '<label style="display:flex;align-items:center;gap:5px;font-size:15px;font-weight:700;cursor:pointer;"><input type="checkbox" id="upIncludeProblem" style="width:18px;height:18px;">有問題的 '+c.problem+' 局也照樣匯入</label>';
  html += '<button type="button" class="btn" id="upConfirm" onclick="confirmUpload()"'+(c.new+c.problem===0?' disabled':'')+'>確定匯入</button>';
  html += '<button type="button" class="btn gray" onclick="cancelUpload()">取消</button><span id="upStatus" class="hint"></span></div>';
  area.innerHTML = html;
}
function cancelUpload(){
  pendingUpload = null;
  document.getElementById('upPreview').innerHTML='';
  document.getElementById('upFile').value='';
}
async function confirmUpload(){
  if(!pendingUpload) return;
  const inc = document.getElementById('upIncludeProblem');
  const includeProblem = !!(inc && inc.checked);
  const btn = document.getElementById('upConfirm'), st = document.getElementById('upStatus');
  btn.disabled = true; st.textContent = '匯入中…';
  try{
    /* 寫入前先抓一次雲端最新資料，避免蓋掉別台電腦剛上傳的內容 */
    await loadData(true);
    const existingCount = countKeys(GAMES);
    const seenCount = new Map();
    const add = [];
    pendingUpload.items.forEach(it=>{
      const k = gameKey(it.g);
      const occ = (seenCount.get(k)||0) + 1;
      seenCount.set(k, occ);
      if(occ <= (existingCount.get(k)||0)) return;   // 雲端已經有這麼多局了
      if(it.status==='new' || (it.status==='problem' && includeProblem)) add.push(it.g);
    });
    if(add.length===0){ st.textContent='沒有需要匯入的新資料'; btn.disabled=false; return; }
    GAMES = GAMES.concat(add);
    await saveYears([...new Set(add.map(g=>g.y))]);
    refreshControls();
    document.getElementById('upPreview').innerHTML = '<p class="status-ok">✅ 已匯入 '+add.length+' 局，系統裡現在共 '+GAMES.length.toLocaleString()+' 局</p>';
    document.getElementById('upFile').value='';
    pendingUpload = null;
  }catch(err){
    console.error(err);
    st.innerHTML = '<span class="status-bad">匯入失敗：'+esc(err.message||err)+'</span>';
    btn.disabled = false;
    await loadData(true).catch(()=>{});
    refreshControls();
  }
}

/* ============ 刪除（功能 5、6）============
   功能 6 跟舊系統一樣用「比賽名稱」刪（名稱要完全一樣），另外可以只刪某一年；預設「全部年份」。
   防呆（使用者 2026-10-02 要求）：兩種刪除都要「再輸入一次登入密碼」才會刪，密碼由 Firebase 重新驗證，
   不會存在任何地方。本機測試模式沒有登入，密碼隨便打都算通過。 */
function askPasswordToDelete(title, messageHtml){
  return new Promise(resolve=>{
    let done = false;
    const finish = v=>{ if(done) return; done = true; closeDanModal(); resolve(v); };
    const submit = async ()=>{
      const pw = document.getElementById('pwConfirm').value;
      if(!pw){ danModalError('請輸入密碼'); return; }
      try{
        if(!LOCAL_MODE){
          const u = fb.auth.currentUser;
          if(!u){ danModalError('登入狀態已失效，請重新登入'); return; }
          await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email, pw));
        }
        finish(true);
      }catch(err){
        const code = (err && err.code) || '';
        danModalError(/wrong-password|invalid-credential|invalid-login/.test(code) ? '密碼不對，沒有刪除' :
                      /too-many-requests/.test(code) ? '密碼錯太多次，請稍後再試' : '驗證失敗：'+(err.message||code));
      }
    };
    openDanModal(title, '<div class="dan-detail">'+messageHtml+'</div>'+
      '<div class="row" style="margin-top:14px;"><div class="lbl">密碼</div><input type="password" id="pwConfirm" class="inp" autocomplete="current-password"></div>'+
      '<p class="hint">請再輸入一次登入密碼，確認是你本人要刪除。刪除後救不回來。</p>',
      [{text:'確定刪除', cls:'red', onclick:submit}, {text:'取消', cls:'gray', onclick:()=>finish(false)}]);
    const inp = document.getElementById('pwConfirm');
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } });
    setTimeout(()=>inp.focus(), 50);
  });
}

/* ============ 批次修改（2026-10-02，照舊系統：改錯字、選手改名）============
   選類別（選手名稱／賽名／階段）→ 輸入原始名稱（要完全一樣）→ 自動算出符合幾筆 → 輸入修改後名稱 → 確定。
   選手名稱會同時改「執黑、執白、勝方」三欄；段位資料裡如果也有這個人，一起改名，免得升段提醒找不到人。 */
const BATCH_FIELDS = { player:['b','w','win'], ev:['ev'], st:['st'] };
const BATCH_LABEL = { player:'選手名稱', ev:'賽名', st:'階段' };
function batchMatches(type, name){
  const n = norm(name);
  if(!n) return [];
  return GAMES.filter(g=>BATCH_FIELDS[type].some(f=>norm(g[f])===n));
}
function batchCount(){
  const type = document.getElementById('bxType').value, from = document.getElementById('bxFrom').value;
  const list = batchMatches(type, from);
  let txt = from.trim() ? list.length+' 局' : '';
  if(from.trim() && type==='player' && DAN_PLAYERS && DAN_PLAYERS.some(r=>norm(r[0])===norm(from))) txt += '（段位資料裡也有這個人，會一起改名）';
  document.getElementById('bxCount').value = txt;
}
function batchOptions(){
  const type = document.getElementById('bxType').value;
  if(type==='player') return PLAYER_NAMES;
  if(type==='ev') return EVENT_NAMES;
  const c = {}; GAMES.forEach(g=>{ if(g.st) c[g.st]=(c[g.st]||0)+1; });
  return Object.keys(c).sort((a,b)=>c[b]-c[a]);
}
attachAutocomplete('bxFrom', batchOptions);
document.getElementById('bxFrom').addEventListener('input', batchCount);
document.getElementById('bxFrom').addEventListener('change', batchCount);
document.getElementById('bxType').addEventListener('change', ()=>{ document.getElementById('bxFrom').value=''; batchCount(); });
async function runBatch(){
  const type = document.getElementById('bxType').value;
  const from = document.getElementById('bxFrom').value.trim(), to = document.getElementById('bxTo').value.trim();
  const st = document.getElementById('bxStatus');
  if(!from){ alert('請輸入原始名稱'); return; }
  if(!to){ alert('請輸入修改後名稱'); return; }
  if(norm(from)===norm(to)){ alert('修改前後的名稱一樣'); return; }
  const list = batchMatches(type, from);
  if(list.length===0){ alert('找不到「'+from+'」的資料，名稱要完全一樣（可以從下拉清單選）'); return; }
  let msg = '確定要把'+BATCH_LABEL[type]+'「'+from+'」改成「'+to+'」嗎？\n共 '+list.length+' 局會被修改。';
  const already = batchMatches(type, to).length;
  if(already) msg += '\n\n⚠️ 注意：「'+to+'」系統裡原本就有 '+already+' 局，改完後會變成同一個'+(type==='player'?'人':BATCH_LABEL[type])+'。';
  if(!confirm(msg)) return;
  st.textContent = '修改中…';
  try{
    await loadData(true);
    const n = norm(from), years = new Set();
    let changed = 0;
    GAMES.forEach(g=>{
      let hit = false;
      BATCH_FIELDS[type].forEach(f=>{ if(norm(g[f])===n){ g[f] = to; hit = true; } });
      if(hit){ changed++; years.add(g.y); }
    });
    await saveYears([...years]);
    let danMsg = '';
    if(type==='player'){
      await loadDan();
      const i = DAN_PLAYERS.findIndex(r=>norm(r[0])===n);
      if(i>=0){
        if(DAN_PLAYERS.some(r=>norm(r[0])===norm(to))) danMsg = '（段位資料裡「'+to+'」已經存在，所以段位資料沒有自動改，請到「查詢段位勝場」自己確認）';
        else { DAN_PLAYERS[i][0] = to; await saveDanPlayers(); danMsg = '，段位資料也一起改名了'; }
      }
    }
    refreshControls();
    st.innerHTML = '<span class="status-ok">已把「'+esc(from)+'」改成「'+esc(to)+'」，共 '+changed+' 局'+esc(danMsg)+'</span>';
    document.getElementById('bxFrom').value=''; document.getElementById('bxTo').value=''; batchCount();
  }catch(err){
    console.error(err);
    st.innerHTML = '<span class="status-bad">修改失敗：'+esc(err.message||err)+'</span>';
    await loadData(true).catch(()=>{}); refreshControls();
  }
}

/* ============ 段位／升段（2026-10-02，照舊系統「查詢段位勝場／升段提醒／段位設定」三頁）============
   資料（跟對局一樣放在 Firestore 的 results 底下，登入才能寫）：
     results/danPlayers { players:"JSON字串" }  每位棋士 [姓名, 目前段位, 結算日期'YYYY-MM-DD', 結算日期已達成之勝場數量]
     results/danRules   { rules:"JSON字串" }    各段位 [段位, 升段需要的勝場數]；還沒存過就用舊系統的預設值
   欄位名稱刻意不用 rows：舊版成績頁會把 results 底下每份有 rows 的文件都當成某一年的對局。
   升段剩餘勝場 ＝ 需要勝場 －（結算日期已達成的勝場 ＋ 結算日期「之後」到查詢日期「當天」的勝場）。
   算勝場的規則（使用者 2026-10-02 確認，並用周平強升七段、吳彥諶升三段兩份公告驗算過）：
     國內、國際都算；正式、限制都算；交流賽不算。達標後系統只提醒，升段由人工到「查詢段位勝場」編輯。 */
const DAN_ORDER = ['初段','二段','三段','四段','五段','六段','七段','八段','九段'];
const DEFAULT_DAN_RULES = [['初段',20],['二段',30],['三段',50],['四段',60],['五段',70],['六段',100],['七段',110],['八段',120],['九段',150]];
const LOCAL_DAN_KEY = 'haifong-results-localdan-v1';
let DAN_PLAYERS = null;   // [[姓名, 段位, 'YYYY-MM-DD', 勝場數]]
let DAN_RULES = null;     // [[段位, 需要勝場數]]
let danRulesSaved = false;

function danRank(d){ const i = DAN_ORDER.indexOf(d); return i<0 ? 99 : i; }
function sortDanRules(){ DAN_RULES.sort((a,b)=>danRank(a[0])-danRank(b[0]) || String(a[0]).localeCompare(String(b[0]),'zh-Hant')); }
function sortDanPlayers(){ DAN_PLAYERS.sort((a,b)=>danRank(a[1])-danRank(b[1]) || Number(b[3])-Number(a[3]) || a[0].localeCompare(b[0],'zh-Hant')); }
function danNeed(dan){ const r = DAN_RULES.find(x=>x[0]===dan); return r ? Number(r[1]) : null; }
function dateStrNum(s){ const m = String(s).match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/); return m ? Number(m[1])*10000+Number(m[2])*100+Number(m[3]) : 0; }
function numDateStr(n){ n=String(n); return n.slice(0,4)+'-'+n.slice(4,6)+'-'+n.slice(6,8); }
function slashDate(s){ return String(s).replace(/-/g,'/'); }
/* 某位棋士在 (fromExclusive, toInclusive] 這段期間「算升段」的勝局（交流賽不算），由舊到新 */
function danWinGames(name, fromExclusive, toInclusive){
  const p = norm(name);
  return GAMES.filter(g=>norm(g.win)===p && g.c2!=='交流' && dateNum(g)>fromExclusive && dateNum(g)<=toInclusive)
              .sort((a,b)=>dateNum(a)-dateNum(b));
}

async function loadDan(){
  if(LOCAL_MODE){
    let s = null; try{ s = JSON.parse(localStorage.getItem(LOCAL_DAN_KEY)||'null'); }catch(e){}
    DAN_PLAYERS = (s && s.players) || [];
    DAN_RULES = (s && s.rules) || DEFAULT_DAN_RULES.map(x=>x.slice());
    danRulesSaved = !!(s && s.rules);
  } else {
    const col = fb.db.collection('results');
    const [p, r] = await Promise.all([col.doc('danPlayers').get({source:'server'}), col.doc('danRules').get({source:'server'})]);
    DAN_PLAYERS = p.exists ? JSON.parse(p.data().players||'[]') : [];
    DAN_RULES = r.exists ? JSON.parse(r.data().rules||'[]') : DEFAULT_DAN_RULES.map(x=>x.slice());
    danRulesSaved = r.exists;
  }
  sortDanRules(); sortDanPlayers();
}
function saveLocalDan(){ localStorage.setItem(LOCAL_DAN_KEY, JSON.stringify({players:DAN_PLAYERS, rules: danRulesSaved ? DAN_RULES : null})); }
async function saveDanPlayers(){
  sortDanPlayers();
  if(LOCAL_MODE){ saveLocalDan(); return; }
  await fb.db.collection('results').doc('danPlayers').set({ players: JSON.stringify(DAN_PLAYERS), updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
}
async function saveDanRules(){
  sortDanRules();
  danRulesSaved = true;
  if(LOCAL_MODE){ saveLocalDan(); return; }
  await fb.db.collection('results').doc('danRules').set({ rules: JSON.stringify(DAN_RULES), updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
}
function danOptionsHtml(selected, withBlank){
  const dans = [...new Set(DAN_ORDER.concat((DAN_RULES||[]).map(r=>r[0])))];
  return (withBlank?'<option value=""></option>':'') + dans.map(d=>'<option'+(d===selected?' selected':'')+'>'+esc(d)+'</option>').join('');
}
function fillDateSelYears(id, y, m, d, fromYear){
  const cy = new Date().getFullYear(), years = [];
  for(let k=cy+1; k>=fromYear; k--) years.push(k);
  if(years.indexOf(Number(y))<0) years.push(Number(y));
  const el = document.getElementById(id);
  const opt = (arr, v, pad)=>arr.map(x=>'<option value="'+x+'"'+(Number(x)===Number(v)?' selected':'')+'>'+(pad?String(x).padStart(2,'0'):x)+'</option>').join('');
  el.innerHTML = '<select autocomplete="off">'+opt(years,y)+'</select><select autocomplete="off">'+opt([...Array(12)].map((_,i)=>i+1),m,true)+'</select><select autocomplete="off">'+opt([...Array(31)].map((_,i)=>i+1),d,true)+'</select>';
  forceDateSel(id, y, m, d);
}

/* 進入三個段位頁面時：讀最新的段位資料（每次都跟雲端拿，避免別台電腦剛改過） */
async function enterDanView(v){
  const st = {danPlayers:'dpStatus', danRemind:'drStatus', danRules:'rlStatus'}[v];
  document.getElementById(st).textContent = '讀取段位資料中…';
  try{ await loadDan(); }catch(err){ console.error(err); document.getElementById(st).innerHTML = '<span class="status-bad">讀取段位資料失敗：'+esc(err.message||err)+'</span>'; return; }
  document.getElementById(st).textContent = '段位資料共 '+DAN_PLAYERS.length+' 位棋士' + (danRulesSaved ? '' : '（段位設定目前是預設值）');
  if(v==='danRemind' && !document.querySelector('#drDate select')){
    const t = new Date(); fillDateSelYears('drDate', t.getFullYear(), t.getMonth()+1, t.getDate(), 2016);
  }
  if(v==='danRemind'){ const sel = document.getElementById('drDan'), cur = sel.value; sel.innerHTML = danOptionsHtml(cur, true); }
  if(v==='danRules') runDanRules();
}
function danNames(){ return (DAN_PLAYERS||[]).map(r=>r[0]); }
attachAutocomplete('dpName', danNames);
attachAutocomplete('drName', danNames);
['dpName','drName'].forEach(id=>document.getElementById(id).addEventListener('keydown', e=>{
  if(e.key!=='Enter' || e.defaultPrevented) return;
  const list = document.getElementById(id).parentElement.querySelector('.ac-list');
  if(list && list.style.display!=='none' && list.querySelector('.on')) return;
  if(list) list.style.display='none';
  e.preventDefault(); (id==='dpName' ? runDanPlayers : runDanRemind)();
}));

/* ---------- 共用彈出視窗 ---------- */
function openDanModal(title, bodyHtml, buttons){
  document.getElementById('danModalTitle').textContent = title;
  document.getElementById('danModalBody').innerHTML = bodyHtml;
  document.getElementById('danModalError').textContent = '';
  const act = document.getElementById('danModalActions'); act.innerHTML = '';
  buttons.forEach(b=>{ const el=document.createElement('button'); el.type='button'; el.className='btn'+(b.cls?' '+b.cls:''); el.textContent=b.text; el.onclick=b.onclick; act.appendChild(el); act.appendChild(document.createTextNode(' ')); });
  document.getElementById('danModal').style.display='flex';
}
function closeDanModal(){ document.getElementById('danModal').style.display='none'; }
function danModalError(msg){ document.getElementById('danModalError').textContent = msg; }

/* ---------- 查詢段位勝場（棋士段位紀錄） ---------- */
function runDanPlayers(){
  if(!DAN_PLAYERS) return;
  const q = norm(document.getElementById('dpName').value);
  const list = DAN_PLAYERS.map((r,i)=>({r,i})).filter(x=>!q || norm(x.r[0]).indexOf(q)>=0);
  const area = document.getElementById('dpResult');
  if(list.length===0){ area.innerHTML = '<p class="hint" style="text-align:center;">找不到這位棋士的段位資料，可以按「新增棋士段位」新增</p>'; return; }
  let html = '<div class="grid-wrap"><table class="grid dan" lang="en"><tr><th>姓名</th><th>目前段位</th><th>結算日期</th><th>結算日期已達成之勝場數量</th><th>編輯</th><th>刪除</th></tr>';
  list.forEach(x=>{
    html += '<tr><td>'+esc(x.r[0])+'</td><td>'+esc(x.r[1])+'</td><td>'+esc(slashDate(x.r[2]))+'</td><td>'+esc(x.r[3])+'</td>'+
      '<td><button type="button" class="btn blue small" onclick="openDanPlayerModal('+x.i+')">編輯</button></td>'+
      '<td><button type="button" class="btn red small" onclick="deleteDanPlayer('+x.i+')">刪除</button></td></tr>';
  });
  html += '</table></div>';
  area.innerHTML = html;
}
function openDanPlayerModal(i){
  if(!DAN_PLAYERS) return;
  const isNew = i<0;
  const r = isNew ? [document.getElementById('dpName').value.trim(), '初段', numDateStr(todayNum()), '0'] : DAN_PLAYERS[i];
  const dn = dateStrNum(r[2]) || todayNum();
  openDanModal(isNew ? '新增棋士段位' : '編輯棋士段位',
    '<div class="row"><div class="lbl">姓名</div><input type="text" id="dmName" value="'+esc(r[0])+'"></div>'+
    '<div class="row"><div class="lbl">目前段位</div><select id="dmDan">'+danOptionsHtml(r[1])+'</select></div>'+
    '<div class="row"><div class="lbl">結算日期</div><div class="datesel" id="dmDate"></div></div>'+
    '<div class="row"><div class="lbl">已達成勝場</div><input type="text" id="dmWins" inputmode="numeric" value="'+esc(r[3])+'"></div>'+
    '<p class="hint">升段時：段位改成新段位、結算日期改成升段那一天、已達成勝場改成 0。<br>'+
    '（結算日期「當天」的勝局都算在舊段位；如果達標之後同一天又贏了，那幾局要自己加進「已達成勝場」。）</p>',
    [{text:'儲存', onclick:()=>saveDanPlayerModal(i)}, {text:'取消', cls:'gray', onclick:closeDanModal}]);
  fillDateSelYears('dmDate', Math.floor(dn/10000), Math.floor(dn/100)%100, dn%100, 2000);
}
function todayNum(){ const t=new Date(); return t.getFullYear()*10000+(t.getMonth()+1)*100+t.getDate(); }
async function saveDanPlayerModal(i){
  const name = document.getElementById('dmName').value.trim();
  const dan = document.getElementById('dmDan').value;
  const date = numDateStr(readDateSel('dmDate'));
  const wins = document.getElementById('dmWins').value.trim();
  if(!name){ danModalError('請輸入姓名'); return; }
  if(!/^\d+$/.test(wins)){ danModalError('已達成勝場要填 0 以上的整數'); return; }
  const dup = DAN_PLAYERS.findIndex((r,k)=>k!==i && norm(r[0])===norm(name));
  if(dup>=0){ danModalError('「'+name+'」已經有段位資料了，請用編輯修改'); return; }
  const row = [name, dan, date, String(Number(wins))];
  const backup = DAN_PLAYERS.map(r=>r.slice());
  if(i<0) DAN_PLAYERS.push(row); else DAN_PLAYERS[i] = row;
  try{
    await saveDanPlayers();
    closeDanModal();
    document.getElementById('dpName').value = name;
    runDanPlayers();
    document.getElementById('dpStatus').innerHTML = '<span class="status-ok">已儲存「'+esc(name)+'」</span>';
  }catch(err){ console.error(err); DAN_PLAYERS = backup; danModalError('儲存失敗：'+(err.message||err)); }
}
async function deleteDanPlayer(i){
  const r = DAN_PLAYERS[i];
  if(!confirm('確定要刪除「'+r[0]+'」的段位資料嗎？')) return;
  const backup = DAN_PLAYERS.map(x=>x.slice());
  DAN_PLAYERS.splice(i,1);
  try{ await saveDanPlayers(); runDanPlayers(); document.getElementById('dpStatus').innerHTML = '<span class="status-ok">已刪除「'+esc(r[0])+'」</span>'; }
  catch(err){ console.error(err); DAN_PLAYERS = backup; alert('刪除失敗：'+(err.message||err)); }
}

/* ---------- 升段提醒 ---------- */
let lastRemind = null;
function runDanRemind(){
  if(!DAN_PLAYERS) return;
  const q = norm(document.getElementById('drName').value);
  const dan = document.getElementById('drDan').value;
  const until = readDateSel('drDate');
  const rows = [];
  DAN_PLAYERS.forEach(r=>{
    if(q && norm(r[0]).indexOf(q)<0) return;
    if(dan && r[1]!==dan) return;
    const base = dateStrNum(r[2]), baseWins = Number(r[3])||0;
    const wins = danWinGames(r[0], base, until);
    const need = danNeed(r[1]);
    rows.push({ name:r[0], dan:r[1], base, baseWins, wins, need, remain: need==null ? null : need-(baseWins+wins.length) });
  });
  /* 剩餘勝場由少到多；一樣多時段位高的排前面（跟舊系統順序一樣） */
  rows.sort((a,b)=> (a.remain==null)-(b.remain==null) || (a.remain-b.remain) || danRank(b.dan)-danRank(a.dan) || a.name.localeCompare(b.name,'zh-Hant'));
  lastRemind = { rows, until };
  const area = document.getElementById('drResult');
  if(rows.length===0){ area.innerHTML = '<p class="hint" style="text-align:center;">沒有符合條件的棋士</p>'; return; }
  let html = '<p class="hint" style="text-align:center;">結算到 '+slashDate(numDateStr(until))+'（點姓名可以看算進去的勝局）</p>';
  html += '<div class="grid-wrap"><table class="grid dan" lang="en"><tr><th>姓名</th><th>目前段位</th><th>升段剩餘勝場數量</th></tr>';
  rows.forEach((x,i)=>{
    html += '<tr><td><a href="#" onclick="return showDanDetail('+i+')">'+esc(x.name)+'</a></td><td>'+esc(x.dan)+'</td><td>'+(x.remain==null ? '（段位設定沒有這個段位）' : x.remain)+'</td></tr>';
  });
  html += '</table></div>';
  area.innerHTML = html;
}
/* 點姓名：列出算進去的勝局，並整理成跟升段公告一樣的「各年幾局」 */
function showDanDetail(i){
  const x = lastRemind.rows[i];
  const byYear = {};
  x.wins.forEach(g=>{ byYear[g.y]=(byYear[g.y]||0)+1; });
  const total = x.baseWins + x.wins.length;
  let reach = null;
  if(x.need!=null && x.baseWins < x.need && total >= x.need) reach = x.wins[x.need - x.baseWins - 1];
  let html = '<div class="dan-detail">'+esc(x.dan)+'，結算日期 '+slashDate(numDateStr(x.base))+' 已達成 '+x.baseWins+' 勝；'+
    '之後到 '+slashDate(numDateStr(lastRemind.until))+' 又贏 '+x.wins.length+' 局'+
    (x.wins.length ? '（'+Object.keys(byYear).sort().map(y=>y+'年'+byYear[y]+'局').join('、')+'）' : '')+
    '，共 <b>'+total+'</b> 勝。';
  if(x.need!=null) html += '<br>升段需要 '+x.need+' 勝，'+(x.remain>0 ? '還差 <b>'+x.remain+'</b> 勝。' : '<b>已達標</b>'+(x.remain<0?'（超過 '+(-x.remain)+' 勝）':'')+'。');
  if(reach) html += '<br>達標那一局：<b>'+fmtDate(reach)+'</b> '+esc(reach.ev)+' '+esc(reach.st)+'，'+esc(norm(reach.b)===norm(x.name)?'持黑':'持白')+'勝 '+esc(norm(reach.b)===norm(x.name)?reach.w:reach.b)+'（'+esc(reach.mv)+'）';
  html += '</div>';
  if(x.wins.length){
    html += '<div class="grid-wrap" style="max-height:45vh;overflow:auto;"><table class="grid detail" lang="en"><tr><th>#</th><th>日期</th><th>賽名</th><th>階段</th><th>對手</th><th>目數</th></tr>';
    x.wins.forEach((g,k)=>{
      const opp = norm(g.b)===norm(x.name) ? g.w : g.b;
      html += '<tr><td>'+(x.baseWins+k+1)+'</td><td class="small">'+fmtDate(g)+'</td><td>'+esc(g.ev)+'</td><td>'+esc(g.st)+'</td><td>'+esc(opp)+'</td><td>'+esc(g.mv)+'</td></tr>';
    });
    html += '</table></div><p class="hint">「#」是累積到第幾勝（從結算日期已達成的勝場往下數）。交流賽不算。</p>';
  }
  openDanModal(x.name+'　升段勝場明細', html, [{text:'關閉', cls:'gray', onclick:closeDanModal}]);
  return false;
}

/* ---------- 段位設定 ---------- */
function runDanRules(){
  if(!DAN_RULES) return;
  let html = danRulesSaved ? '' : '<p class="hint" style="text-align:center;">目前顯示的是舊系統的設定值（還沒存到新系統）；按任何一個「編輯」或「新增段位設定」存檔後，就會正式存進來。</p>';
  html += '<div class="grid-wrap"><table class="grid dan" lang="en"><tr><th>段位</th><th>勝場需求數量</th><th>操作</th><th>刪除</th></tr>';
  DAN_RULES.forEach((r,i)=>{
    html += '<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td><button type="button" class="btn blue small" onclick="openDanRuleModal('+i+')">編輯</button></td><td><button type="button" class="btn red small" onclick="deleteDanRule('+i+')">刪除</button></td></tr>';
  });
  html += '</table></div>';
  document.getElementById('rlResult').innerHTML = html;
}
function openDanRuleModal(i){
  if(!DAN_RULES) return;
  const isNew = i<0, r = isNew ? ['', ''] : DAN_RULES[i];
  openDanModal(isNew ? '新增段位設定' : '編輯段位設定',
    '<div class="row"><div class="lbl">段位</div><input type="text" id="rmDan" value="'+esc(r[0])+'" placeholder="例如 九段"'+(isNew?'':' readonly style="background:#eee;"')+'></div>'+
    '<div class="row"><div class="lbl">勝場需求數量</div><input type="text" id="rmNeed" inputmode="numeric" value="'+esc(r[1])+'"></div>',
    [{text:'儲存', onclick:()=>saveDanRuleModal(i)}, {text:'取消', cls:'gray', onclick:closeDanModal}]);
}
async function saveDanRuleModal(i){
  const dan = document.getElementById('rmDan').value.trim(), need = document.getElementById('rmNeed').value.trim();
  if(!dan){ danModalError('請輸入段位'); return; }
  if(!/^\d+$/.test(need)){ danModalError('勝場需求數量要填整數'); return; }
  if(i<0 && DAN_RULES.some(r=>r[0]===dan)){ danModalError('已經有「'+dan+'」的設定了，請用編輯修改'); return; }
  const backup = DAN_RULES.map(r=>r.slice()), wasSaved = danRulesSaved;
  if(i<0) DAN_RULES.push([dan, Number(need)]); else DAN_RULES[i] = [dan, Number(need)];
  try{ await saveDanRules(); closeDanModal(); runDanRules(); document.getElementById('rlStatus').innerHTML = '<span class="status-ok">已儲存「'+esc(dan)+'」</span>'; }
  catch(err){ console.error(err); DAN_RULES = backup; danRulesSaved = wasSaved; danModalError('儲存失敗：'+(err.message||err)); }
}
async function deleteDanRule(i){
  const r = DAN_RULES[i];
  if(!confirm('確定要刪除「'+r[0]+'」的段位設定嗎？刪除後，這個段位的棋士在升段提醒裡會算不出剩餘勝場。')) return;
  const backup = DAN_RULES.map(x=>x.slice()), wasSaved = danRulesSaved;
  DAN_RULES.splice(i,1);
  try{ await saveDanRules(); runDanRules(); }
  catch(err){ console.error(err); DAN_RULES = backup; danRulesSaved = wasSaved; alert('刪除失敗：'+(err.message||err)); }
}

/* ---------- 功能 4：下載／上傳段位資料（格式跟舊系統下載的「棋士段位資料.xlsx」一樣） ---------- */
async function downloadDanPlayers(){
  try{ await loadDan(); }catch(err){ alert('讀取段位資料失敗：'+(err.message||err)); return; }
  if(DAN_PLAYERS.length===0){ alert('系統裡還沒有段位資料，可以先用「上傳段位資料」把舊系統下載的檔案傳上來'); return; }
  const aoa = [['姓名','目前段位','結算日期','結算日期已達成之勝場數量']].concat(DAN_PLAYERS.map(r=>[r[0], r[1], r[2], String(r[3])]));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), '段位資料');
  XLSX.writeFile(wb, todayStamp()+'_棋士段位資料.xlsx');
}
function todayStamp(){ return String(todayNum()); }
let pendingDanUpload = null;
document.getElementById('danUpFile').addEventListener('change', async function(e){
  const file = e.target.files[0];
  if(!file) return;
  const area = document.getElementById('danUpPreview');
  try{
    await loadDan();
    const wb = XLSX.read(await file.arrayBuffer(), {type:'array', cellDates:true});
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, defval:null});
    const h = aoa.findIndex(r=>r && r.some(c=>cellStr(c)==='姓名'));
    if(h<0) throw new Error('第一個分頁找不到「姓名」欄位');
    const col = {}; aoa[h].forEach((c,i)=>{ col[cellStr(c)] = i; });
    const need = ['姓名','目前段位','結算日期','結算日期已達成之勝場數量'];
    const miss = need.filter(k=>col[k]==null); if(miss.length) throw new Error('缺少欄位：'+miss.join('、'));
    const rows = [], probs = [], seen = new Set();
    for(let r=h+1; r<aoa.length; r++){
      const row = aoa[r]; if(!row || !cellStr(row[col['姓名']])) continue;
      const name = cellStr(row[col['姓名']]), dan = cellStr(row[col['目前段位']]);
      const dv = row[col['結算日期']];
      const date = dv instanceof Date ? numDateStr(dv.getFullYear()*10000+(dv.getMonth()+1)*100+dv.getDate()) : (dateStrNum(cellStr(dv)) ? numDateStr(dateStrNum(cellStr(dv))) : '');
      const wins = cellStr(row[col['結算日期已達成之勝場數量']]).replace(/\.0$/,'');
      if(!date) probs.push(name+'：結算日期看不懂（'+cellStr(dv)+'）');
      if(!/^\d+$/.test(wins)) probs.push(name+'：勝場數不是整數（'+wins+'）');
      if(DAN_ORDER.indexOf(dan)<0 && !DAN_RULES.some(x=>x[0]===dan)) probs.push(name+'：段位「'+dan+'」不在段位設定裡');
      if(seen.has(norm(name))) probs.push(name+'：重複出現');
      seen.add(norm(name));
      rows.push([name, dan, date, wins]);
    }
    pendingDanUpload = rows;
    area.innerHTML = '<p style="font-weight:700;margin:10px 0 4px;">「'+esc(file.name)+'」共 '+rows.length+' 位棋士（系統裡目前 '+DAN_PLAYERS.length+' 位）。確定後會用這份檔案「整份取代」系統裡的段位資料。</p>'+
      (probs.length ? '<p class="status-bad">有 '+probs.length+' 個問題，請先修正檔案再上傳：<br>'+probs.map(esc).join('<br>')+'</p>' : '')+
      '<div class="acts"><button type="button" class="btn" onclick="confirmDanUpload()"'+(probs.length||!rows.length?' disabled':'')+'>確定取代</button><button type="button" class="btn gray" onclick="cancelDanUpload()">取消</button><span class="hint" id="danUpStatus"></span></div>';
  }catch(err){
    console.error(err);
    area.innerHTML = '<p class="status-bad">讀不了這個檔案：'+esc(err.message||err)+'</p>';
  }
});
function cancelDanUpload(){ pendingDanUpload = null; document.getElementById('danUpPreview').innerHTML=''; document.getElementById('danUpFile').value=''; }
async function confirmDanUpload(){
  if(!pendingDanUpload) return;
  const backup = DAN_PLAYERS;
  DAN_PLAYERS = pendingDanUpload.map(r=>r.slice());
  try{
    await saveDanPlayers();
    document.getElementById('danUpPreview').innerHTML = '<p class="status-ok">✅ 已匯入 '+DAN_PLAYERS.length+' 位棋士的段位資料</p>';
    document.getElementById('danUpFile').value=''; pendingDanUpload = null;
  }catch(err){ console.error(err); DAN_PLAYERS = backup; document.getElementById('danUpStatus').innerHTML = '<span class="status-bad">匯入失敗：'+esc(err.message||err)+'</span>'; }
}

/* ============ 登入 ============ */
/* 選單照舊系統：沒登入只有「HAIFONGGO首頁｜重新登入」；登入後多出比賽資料～帳號管理。
   歡迎文字：之後「帳號管理」做好會讓每個帳號各自設定名稱，在那之前先顯示帳號 @ 前面那段。 */
function setAdmin(on, email){
  isAdmin = on;
  document.getElementById('navAdminItems').style.display = on ? '' : 'none';
  document.getElementById('navLogin').style.display = LOCAL_MODE ? 'none' : '';
  const name = LOCAL_MODE ? '本機測試' : (email ? String(email).split('@')[0] : '管理者');
  document.getElementById('welcome').textContent = '歡迎~~ ' + (on ? name : '使用者');
  if(!on) showView('query');
}
function notYet(name){ alert('「'+name+'」功能尚未開放，之後會陸續加上。'); }
/* 「重新登入」跟舊系統一樣：已登入就先登出，再跳出登入視窗（登入視窗按取消＝維持登出） */
async function reLogin(){
  if(isAdmin && fb){ try{ await fb.auth.signOut(); }catch(e){} }
  openLogin();
}
function openLogin(){
  document.getElementById('loginError').textContent='';
  document.getElementById('loginModal').style.display='flex';
  document.getElementById('loginEmail').focus();
}
function closeLogin(){ document.getElementById('loginModal').style.display='none'; }
async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim(), pw = document.getElementById('loginPw').value;
  const errEl = document.getElementById('loginError'), btn = document.getElementById('loginSubmit');
  if(!email || !pw){ errEl.textContent='請輸入帳號和密碼'; return; }
  btn.disabled = true; errEl.textContent='';
  try{
    await fb.auth.signInWithEmailAndPassword(email, pw);
    document.getElementById('loginPw').value='';
    closeLogin();
    showView('admin');
  }catch(err){
    const code = err && err.code || '';
    errEl.textContent = (code.indexOf('invalid')>=0 || code.indexOf('wrong-password')>=0 || code.indexOf('user-not-found')>=0) ? '帳號或密碼不對' : ('登入失敗：'+(err.message||code));
  }finally{ btn.disabled = false; }
}

/* ============ 啟動 ============ */
(async function init(){
  if(LOCAL_MODE){
    document.getElementById('localBanner').style.display='';
    setAdmin(true);
  } else {
    /* 用「另外取名的 Firebase app」而不是預設的那一個：成績系統跟賽程表放在同一個網站底下，
       瀏覽器會讓兩邊共用登入狀態；如果都用預設 app，在這裡登入/登出/重新整理，賽程表的分頁會收到
       「登入狀態改變」而整份重新同步、重畫所有底圖（2026-10-01 使用者實際遇到）。取了名字之後，
       登入狀態存在不同的位置，兩邊互不干擾，代價是兩邊要各自登入一次。 */
    const app = firebase.initializeApp(firebaseConfig, 'haifong-results');
    fb = { auth: app.auth(), db: app.firestore() };
    fb.auth.onAuthStateChanged(user=>setAdmin(!!user, user && user.email));
  }
  try{
    await loadData(false);
  }catch(err){
    console.error(err);
    document.getElementById('dataStatus').innerHTML = '<span class="status-bad">資料載入失敗：'+esc(err.message||err)+'（請重新整理再試一次）</span>';
    return;
  }
  refreshControls();
})();
</script>
