<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>海峰棋院成績查詢</title>
<style>
/* 介面照舊系統（haifonggo.azurewebsites.net）的樣子：橘色選單列、藍色標籤＋淡綠輸入框、
   橘色按鈕、橘色表頭＋灰白相間的粗體表格。 */
:root{
  --nav:#D86018;
  --nav-text:#fff;
  --welcome:#ADFF2F;
  --label:#87CEFA;
  --input:#E6FFE6;
  --btn:#FFA500;
  --th:#FF8000;
  --zebra:#F2F2F2;
  --border:#000;
  --ok:#15803d;
  --bad:#c0392b;
  --font:Arial,"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:#fff;color:#000;font-family:var(--font);}
.nav{position:sticky;top:0;z-index:50;background:var(--nav);box-shadow:0 2px 5px rgba(0,0,0,.2);display:flex;justify-content:center;align-items:stretch;flex-wrap:wrap;min-height:40px;padding:0 10px;}
.nav button{background:var(--nav);color:var(--nav-text);border:none;font:700 16px var(--font);padding:5px 12px;cursor:pointer;border-right:2px solid #fff;}
.nav button:hover{background:#c0530f;}
.nav button.on{text-decoration:underline;text-underline-offset:4px;}
.nav .welcome{color:var(--welcome);font-weight:700;font-size:16px;display:flex;align-items:center;padding:0 8px;}
.page{max-width:760px;margin:20px auto 60px;padding:0 16px;}
.page.wide{max-width:1100px;}
.box{border:1px solid #000;border-radius:5px;padding:8px 10px;box-shadow:0 2px 6px rgba(0,0,0,.2);background:#fff;}
.row{display:grid;grid-template-columns:minmax(90px,170px) 1fr;gap:14px;align-items:center;margin:6px 0;}
.lbl{background:var(--label);border:1px solid #000;border-radius:5px;font-weight:700;font-size:19px;text-align:center;padding:2px 4px;min-height:30px;display:flex;align-items:center;justify-content:center;}
.inp,.row select,.row input[type=text]{width:100%;height:30px;background:var(--input);border:1px solid #000;border-radius:5px;font:19px var(--font);padding:0 8px;color:#000;}
.inp.checks{display:flex;align-items:center;justify-content:center;gap:16px;height:auto;min-height:30px;padding:2px 8px;font-size:17px;flex-wrap:wrap;}
.inp.checks label{display:flex;align-items:center;gap:4px;cursor:pointer;}
.inp.checks input{width:17px;height:17px;}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--btn);color:#fff;border:1px solid #333;border-radius:5px;font:700 16px var(--font);padding:6px 14px;min-height:36px;box-shadow:0 2px 4px rgba(0,0,0,.2);cursor:pointer;}
.btn:hover{filter:brightness(1.07);}
.btn:disabled{opacity:.5;cursor:default;filter:none;}
.btn.wide{width:200px;}
.btn.gray{background:#888;}
.center{text-align:center;margin:10px 0;}
.status{font-size:14px;color:#444;text-align:center;margin:8px 0 0;}
.status-ok{color:var(--ok);font-weight:700;}
.status-bad{color:var(--bad);font-weight:700;}
.hint{font-size:13px;color:#555;margin:4px 0;}
.grid-wrap{overflow-x:auto;margin-top:16px;}
table.grid{border-collapse:collapse;width:100%;font-weight:700;}
table.grid th{background:var(--th);color:#fff;border:1px solid var(--border);padding:6px;font-size:15px;white-space:nowrap;}
table.grid th.sortable{cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
table.grid td{border:1px solid var(--border);padding:4px 5px;text-align:center;font-size:16px;white-space:nowrap;}
table.grid tr:nth-child(even) td{background:var(--zebra);}
table.grid.detail td{font-size:15px;}
table.grid.detail td.small{font-size:12px;}
table.grid td.win{color:#c0392b;}
table.grid td.left{text-align:left;white-space:normal;}
table.grid a{color:#000;}
.result-title{font-weight:700;font-size:18px;margin:22px 0 0;scroll-margin-top:56px;}
/* 管理功能頁：照舊系統 ImportData 頁的「功能1～6」排法 */
.admin-box{border:1px solid #000;border-radius:8px;padding:10px;margin-bottom:18px;}
.arow{display:grid;grid-template-columns:minmax(90px,200px) 1fr;gap:10px;align-items:start;margin:8px 0;}
.arow .lbl{min-height:46px;font-size:20px;}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.acts .btn{min-height:46px;font-size:18px;}
.acts select,.acts input[type=text],.acts input[type=password]{height:42px;background:var(--input);border:1px solid #000;border-radius:5px;font:17px var(--font);padding:0 8px;min-width:90px;}
.datesel{display:flex;gap:6px;flex-wrap:wrap;}
.datesel select{flex:1;min-width:80px;height:42px;background:var(--input);border:1px solid #000;border-radius:5px;font:17px var(--font);padding:0 8px;}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:13px;font-weight:700;border:1px solid #333;}
.pill.new{background:#dcfce7;}
.pill.exists{background:#eee;}
.pill.problem{background:#fde2e2;}
.tabs{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap;}
.tabs button{border:1px solid #333;background:#fff;border-radius:14px;padding:4px 12px;font:700 14px var(--font);cursor:pointer;}
.tabs button.on{background:var(--th);color:#fff;}
.local-banner{background:#fff3c4;border:1px solid #e0c060;border-radius:6px;padding:6px 10px;font-size:14px;margin:10px auto 0;max-width:760px;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal-box{background:#fff;border:1px solid #000;border-radius:8px;padding:20px;width:100%;max-width:380px;box-shadow:0 8px 32px rgba(0,0,0,.25);}
.modal-box h2{margin:0 0 10px;font-size:20px;}
.login-error{margin-top:8px;font-size:14px;color:var(--bad);min-height:1.2em;}
@media (max-width:560px){
  .row{grid-template-columns:96px 1fr;gap:8px;}
  .lbl{font-size:16px;}
  .inp,.row select,.row input[type=text]{font-size:16px;}
  .arow{grid-template-columns:1fr;}
  .nav button{font-size:14px;padding:5px 8px;}
  table.grid td{font-size:14px;}
}
</style>
</head>
<body>
<nav class="nav">
  <button type="button" id="navQuery" class="on" onclick="showView('query')">海峰棋院成績查詢</button>
  <button type="button" id="navAdmin" style="display:none;" onclick="showView('admin')">管理功能</button>
  <button type="button" id="navLogin" onclick="openLogin()">管理登入</button>

  <span class="welcome" id="welcome">歡迎~~ 使用者</span>
</nav>
<div id="localBanner" class="local-banner" style="display:none;">⚠️ 本機測試模式：資料只存在這台電腦的瀏覽器裡，不會連到雲端。</div>

<!-- ============ 查詢頁 ============ -->
<div id="viewQuery" class="page">
  <div class="box">
    <div class="row"><div class="lbl">棋士</div><input type="text" id="qPlayer" list="dlPlayers" autocomplete="off" placeholder="空白＝列出所有棋士"></div>
    <div class="row"><div class="lbl">對手</div><input type="text" id="qOpp" list="dlPlayers" autocomplete="off"></div>
    <div class="row"><div class="lbl">起始年</div><select id="qYearFrom"></select></div>
    <div class="row"><div class="lbl">結束年</div><select id="qYearTo"></select></div>
    <div class="row"><div class="lbl">大類</div><select id="qCat1"><option value=""></option><option>國內</option><option>國際</option></select></div>
    <div class="row"><div class="lbl">小類</div>
      <div class="inp checks" id="qCat2Box">
        <label><input type="checkbox" value="交流">交流</label>
        <label><input type="checkbox" value="正式">正式</label>
        <label><input type="checkbox" value="限制">限制</label>
      </div>
    </div>

  <datalist id="dlEvents"></datalist>

    <div class="result-title" id="resultTitle"></div>

    <div id="detailArea"></div>

</div>

<!-- ============ 管理功能頁（登入後） ============ -->
<div id="viewAdmin" class="page wide" style="display:none;">
  <div class="admin-box">
    <div class="arow"><div class="lbl">功能 1</div>
      <div>
        <div class="acts">
          <button type="button" class="btn" onclick="document.getElementById('upFile').click()">上傳比賽資料 (Excel)</button>
          <input type="file" id="upFile" accept=".xlsx,.xls" style="display:none;">
          <span class="hint">欄位：年份、日期、大類、小類、賽名、階段、執黑、執白、勝方、目數；分頁名稱不拘。系統裡已經有的同一局會自動略過。</span>
        </div>
        <div id="upPreview"></div>
      </div>
    </div>
  </div>

  <div class="admin-box">
    <div class="arow"><div class="lbl">起始日期</div><div class="datesel" id="dlFrom"></div></div>
    <div class="arow"><div class="lbl">結束日期</div><div class="datesel" id="dlTo"></div></div>
    <div class="arow"><div class="lbl">比賽名稱</div><div class="acts"><input type="text" id="dlEvent" list="dlEvents" placeholder="空白＝全部比賽" style="flex:1;max-width:320px;"></div></div>
    <div class="arow"><div class="lbl">功能 2</div>
      <div class="acts">
        <button type="button" class="btn" onclick="downloadRange('year')">下載比賽資料 (年份-賽名)</button>
        <button type="button" class="btn" onclick="downloadRange('event')">下載比賽資料 (賽名)</button>
      </div>
    </div>
    <div class="arow"><div class="lbl">功能 3</div>
      <div class="acts">
        <button type="button" class="btn" onclick="downloadAll('year')">下載全部比賽 (年份-賽名)</button>
        <button type="button" class="btn" onclick="downloadAll('event')">下載全部比賽 (賽名)</button>
      </div>
    </div>
    <div class="arow"><div class="lbl">功能 4</div>
      <div class="acts"><button type="button" class="btn gray" disabled>下載段位資料</button><span class="hint">段位功能還沒做，之後加上</span></div>

        <button type="button" class="btn" onclick="deleteAll()">刪除所有比賽資料</button>
        <span class="hint">會清空整個系統，刪除前請先用功能 3 下載備份</span>
      </div>
    </div>
    <div class="arow"><div class="lbl">功能 6</div>
      <div>
        <div class="acts">
          <button type="button" class="btn" onclick="deleteEvent()">刪除單一比賽資料</button>
          <input type="text" id="delEvent" list="dlEvents" placeholder="比賽名稱" style="max-width:240px;">
          <select id="delYear"><option value="">全部年份</option></select>
        </div>
        <div class="hint" id="delStatus"></div>
      </div>
    </div>
  </div>
</div>

<div id="loginModal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <h2>管理登入</h2>
    <p class="hint">用賽程表同一組帳號登入。查詢不用登入。</p>
    <div class="row"><div class="lbl" style="font-size:16px;">帳號</div><input type="text" id="loginEmail" autocomplete="username" placeholder="Email"></div>
    <div class="row"><div class="lbl" style="font-size:16px;">密碼</div><input type="password" id="loginPw" class="inp" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div class="login-error" id="loginError"></div>
    <div class="center">
      <button type="button" class="btn" id="loginSubmit" onclick="doLogin()">登入</button>
      <button type="button" class="btn gray" onclick="closeLogin()">取消</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
/* ============ 海峰棋院成績系統（2026-09-30 基本款；2026-10-01 介面改成跟舊系統一樣）============
   取代外包的 haifonggo.azurewebsites.net。資料放在跟賽程表同一個 Firebase 專案（test-5cfc9）的
   Firestore：
     results/meta   { version, counts:{年份:局數}, updatedAt }   ← 公開頁每次只讀這一份，版本沒變就用瀏覽器快取
     results/y2016… { year, rows:"JSON字串" }                   ← 每年一份；rows 是 [日期,大類,小類,賽名,階段,執黑,執白,勝方,目數] 陣列
   每年一份文件、內容存成 JSON 字串：1 萬多局也只有十幾份文件，讀取次數極少，免費額度綽綽有餘；
   Firestore 單一文件上限 1MB，一年 1,500 局大約 150KB，還有很大空間。
   Firestore 規則：results 任何人可讀、登入才能寫（使用者 2026-10-01 在 Firebase 後台設定）。
   網址加 ?local=1 是本機測試模式：不連 Firebase，資料只存在這台瀏覽器的 localStorage。 */
const firebaseConfig = {
  apiKey: "AIzaSyAZAxRuD6MFG4i_FcOf5OX_qzrHunGXqnk",
  authDomain: "test-5cfc9.firebaseapp.com",
  projectId: "test-5cfc9",
  storageBucket: "test-5cfc9.firebasestorage.app",
  messagingSenderId: "892169332286",
  appId: "1:892169332286:web:c16a82a686d1f3e024536f"
};
const LOCAL_MODE = new URLSearchParams(location.search).get('local') === '1';
const CACHE_KEY = 'haifong-results-cache-v1';
const LOCAL_DB_KEY = 'haifong-results-localdb-v1';
const HEADERS = ['年份','日期','大類','小類','賽名','階段','執黑','執白','勝方','目數'];
const DOC_SIZE_LIMIT = 900000; // Firestore 上限 1MB，留一點餘裕

let GAMES = [];          // [{y,d,c1,c2,ev,st,b,w,win,mv}]
let dataVersion = 0;
let isAdmin = false;
let lastQueryGames = [];
let fb = null;           // {auth, db}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function norm(s){ return String(s==null?'':s).replace(/\s+/g,'').trim(); }
function rowToGame(y, r){ return { y:String(y), d:r[0]||'', c1:r[1]||'', c2:r[2]||'', ev:r[3]||'', st:r[4]||'', b:r[5]||'', w:r[6]||'', win:r[7]||'', mv:r[8]||'' }; }
function gameToRow(g){ return [g.d,g.c1,g.c2,g.ev,g.st,g.b,g.w,g.win,g.mv]; }
function gameKey(g){ return [g.y,g.d,g.ev,g.st,g.b,g.w].map(norm).join('|'); }
function dateNum(g){ const m = String(g.d).match(/^(\d{1,2})\.(\d{1,2})$/); return m ? Number(g.y)*10000+Number(m[1])*100+Number(m[2]) : Number(g.y)*10000; }
function sortGames(list){
  return list.sort((a,b)=> (b.y+b.d).localeCompare(a.y+a.d) || a.ev.localeCompare(b.ev,'zh-Hant') || a.st.localeCompare(b.st,'zh-Hant'));
}

/* ============ 資料存取：Firebase 或本機測試 ============ */
function groupByYear(games){
  const by = {};
  games.forEach(g=>{ (by[g.y] = by[g.y] || []).push(g); });
  return by;
}
async function loadData(forceServer){
  if(LOCAL_MODE){
    let saved = null;
    try{ saved = JSON.parse(localStorage.getItem(LOCAL_DB_KEY) || 'null'); }catch(e){}
    GAMES = [];
    if(saved){ Object.keys(saved.years).forEach(y=>{ saved.years[y].forEach(r=>GAMES.push(rowToGame(y,r))); }); dataVersion = saved.version; }
    return;
  }
  const col = fb.db.collection('results');
  const metaSnap = await col.doc('meta').get(forceServer ? {source:'server'} : undefined);
  const meta = metaSnap.exists ? metaSnap.data() : null;
  if(!meta){ GAMES = []; dataVersion = 0; return; }
  if(!forceServer){
    try{
      const cache = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if(cache && cache.version === meta.version){
        GAMES = [];
        Object.keys(cache.years).forEach(y=>{ cache.years[y].forEach(r=>GAMES.push(rowToGame(y,r))); });
        dataVersion = meta.version;
        return;
      }
    }catch(e){}
  }
  const snap = await col.get(forceServer ? {source:'server'} : undefined);
  const years = {};
  GAMES = [];
  snap.forEach(doc=>{
    if(doc.id === 'meta') return;
    const d = doc.data();
    const rows = JSON.parse(d.rows || '[]');
    years[d.year] = rows;
    rows.forEach(r=>GAMES.push(rowToGame(d.year, r)));
  });
  dataVersion = meta.version;
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({version:dataVersion, years})); }catch(e){}
}
/* 把「這些年份」整年的資料寫回去（上傳／刪除共用）。changedYears 裡的年份如果已經沒有任何對局，就刪掉那份文件。 */
async function saveYears(changedYears){
  const by = groupByYear(GAMES);
  const version = Date.now();
  const counts = {};
  Object.keys(by).forEach(y=>{ counts[y] = by[y].length; });
  if(LOCAL_MODE){
    const years = {};
    Object.keys(by).forEach(y=>{ years[y] = sortGames(by[y]).map(gameToRow); });
    localStorage.setItem(LOCAL_DB_KEY, JSON.stringify({version, years}));
    dataVersion = version;
    return;
  }
  const col = fb.db.collection('results');
  const batch = fb.db.batch();
  changedYears.forEach(y=>{
    const list = by[y];
    if(!list || list.length===0){ batch.delete(col.doc('y'+y)); return; }
    const json = JSON.stringify(sortGames(list).map(gameToRow));
    if(new Blob([json]).size > DOC_SIZE_LIMIT) throw new Error(y+' 年的資料太大（超過單一文件上限），請聯絡維護的人調整存法');
    batch.set(col.doc('y'+y), { year:String(y), rows:json });
  });
  batch.set(col.doc('meta'), { version, counts, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
  await batch.commit();
  dataVersion = version;
  try{ localStorage.removeItem(CACHE_KEY); }catch(e){}
}

/* ============ 畫面切換、選單 ============ */
function showView(v){
  if(v==='admin' && !isAdmin) v='query';
  document.getElementById('viewQuery').style.display = v==='query' ? '' : 'none';
  document.getElementById('viewAdmin').style.display = v==='admin' ? '' : 'none';
  document.getElementById('navQuery').classList.toggle('on', v==='query');
  document.getElementById('navAdmin').classList.toggle('on', v==='admin');
  window.scrollTo(0,0);
}
function dataYears(){ return [...new Set(GAMES.map(g=>g.y))].filter(y=>/^\d{4}$/.test(y)).sort(); }
function fillDateSel(id, y, m, d){
  const years = dataYears(); const cy = String(new Date().getFullYear());
  if(years.indexOf(cy)<0) years.push(cy);
  const el = document.getElementById(id);
  const opt = (arr, v)=>arr.map(x=>'<option'+(String(x)===String(v)?' selected':'')+'>'+x+'</option>').join('');
  el.innerHTML = '<select>'+opt(years,y)+'</select><select>'+opt([...Array(12)].map((_,i)=>i+1),m)+'</select><select>'+opt([...Array(31)].map((_,i)=>i+1),d)+'</select>';
}
function readDateSel(id){ const s = document.querySelectorAll('#'+id+' select'); return Number(s[0].value)*10000+Number(s[1].value)*100+Number(s[2].value); }
function refreshControls(){
  const years = dataYears();
  const from = document.getElementById('qYearFrom'), to = document.getElementById('qYearTo');
  const fv = from.value, tv = to.value;
  from.innerHTML = '<option value=""></option>' + years.map(y=>'<option>'+y+'</option>').join('');
  to.innerHTML = '<option value=""></option>' + years.map(y=>'<option>'+y+'</option>').join('');
  from.value = fv; to.value = tv;
  const cnt = {};
  GAMES.forEach(g=>{ cnt[g.b]=(cnt[g.b]||0)+1; cnt[g.w]=(cnt[g.w]||0)+1; });
  const names = Object.keys(cnt).filter(Boolean).sort((a,b)=>cnt[b]-cnt[a]);
  document.getElementById('dlPlayers').innerHTML = names.map(n=>'<option value="'+esc(n)+'">').join('');
  const evs = [...new Set(GAMES.map(g=>g.ev))].filter(Boolean).sort((a,b)=>a.localeCompare(b,'zh-Hant'));
  document.getElementById('dlEvents').innerHTML = evs.map(n=>'<option value="'+esc(n)+'">').join('');
  const st = document.getElementById('dataStatus');
  if(GAMES.length===0){ st.textContent = '目前系統裡還沒有資料'; }
  else{
    st.textContent = '共 '+GAMES.length.toLocaleString()+' 局（'+years[0]+'～'+years[years.length-1]+'）・'+names.length+' 位棋士' + (dataVersion ? '・資料更新於 '+new Date(dataVersion).toLocaleString('zh-TW',{hour12:false}) : '');
  }
  const now = new Date();
  if(!document.querySelector('#dlFrom select')){
    fillDateSel('dlFrom', now.getFullYear(), 1, 1);
    fillDateSel('dlTo', now.getFullYear(), now.getMonth()+1, now.getDate());
  }
  const dy = document.getElementById('delYear'); const dv = dy.value;
  dy.innerHTML = '<option value="">全部年份</option>' + years.slice().reverse().map(y=>'<option>'+y+'</option>').join('');
  dy.value = dv;
}

/* ============ 查詢 ============
   規則照舊系統：棋士／對手要完整姓名；賽名、階段、目數打一部分就算；小類不勾＝全部。
   有填棋士：第一列是這段期間的合計，下面逐年列出（新到舊）。沒填棋士：列出所有符合條件的棋士，依對局數排序。
   表頭可以點來排序（跟舊系統一樣）；有填棋士時，合計那一列固定在最上面。
   跟舊系統唯一的差別：舊系統會把「勝方欄填了第三個人」的錯誤資料也算進那個人的對局，這裡只算真正下的那兩個人。 */
function readFilters(){
  const c2 = [...document.querySelectorAll('#qCat2Box input:checked')].map(i=>i.value);
  return {
    player: norm(document.getElementById('qPlayer').value),
    opp: norm(document.getElementById('qOpp').value),
    yFrom: document.getElementById('qYearFrom').value,
    yTo: document.getElementById('qYearTo').value,
    c1: document.getElementById('qCat1').value,
    c2,
    ev: norm(document.getElementById('qEvent').value),
    st: norm(document.getElementById('qStage').value),
    mv: norm(document.getElementById('qMoves').value),
    details: document.getElementById('qDetails').checked
  };
}
function baseFilter(f){
  return GAMES.filter(g=>{
    if(f.yFrom && g.y < f.yFrom) return false;
    if(f.yTo && g.y > f.yTo) return false;
    if(f.c1 && g.c1 !== f.c1) return false;
    if(f.c2.length && f.c2.indexOf(g.c2) < 0) return false;
    if(f.ev && norm(g.ev).indexOf(f.ev) < 0) return false;
    if(f.st && norm(g.st).indexOf(f.st) < 0) return false;
    if(f.mv && norm(g.mv).indexOf(f.mv) < 0) return false;
    return true;
  });
}
function newStat(){ return {n:0, win:0, bn:0, bwin:0, wn:0, wwin:0}; }
function addStat(s, g, p){
  const isB = norm(g.b)===p;
  const won = norm(g.win)===p;
  s.n++; if(won) s.win++;
  if(isB){ s.bn++; if(won) s.bwin++; } else { s.wn++; if(won) s.wwin++; }
}
function ratio(a, n){ return n ? a/n : -1; }
function pct(a, n){ return n ? (a*100/n).toFixed(1)+'%' : '0%'; }

/* 統計表的欄位：key 用來排序 */
const SUM_COLS = [
  {t:'棋士', k:r=>r.name},
  {t:'年份', k:r=>r.yearSort},
  {t:'對局數', k:r=>r.s.n},
  {t:'勝數', k:r=>r.s.win},
  {t:'敗數', k:r=>r.s.n-r.s.win},
  {t:'勝率', k:r=>ratio(r.s.win,r.s.n)},
  {t:'執黑勝率', k:r=>ratio(r.s.bwin,r.s.bn)},
  {t:'執白勝率', k:r=>ratio(r.s.wwin,r.s.wn)},
  {t:'執黑局數', k:r=>r.s.bn},
  {t:'執黑勝', k:r=>r.s.bwin},
  {t:'執白局數', k:r=>r.s.wn},
  {t:'執白勝', k:r=>r.s.wwin}
];
let sumState = null; // {pinned, rows, sortCol, sortDir, linkNames}
function renderSummary(){
  const st = sumState;
  let rows = st.rows.slice();
  if(st.sortCol!=null){
    const k = SUM_COLS[st.sortCol].k, dir = st.sortDir;
    rows.sort((a,b)=>{ const x=k(a), y=k(b); return (typeof x==='string' ? String(x).localeCompare(String(y),'zh-Hant') : x-y)*dir; });
  }
  if(st.pinned) rows.unshift(st.pinned);
  let html = '<div class="grid-wrap"><table class="grid"><tr>'+SUM_COLS.map((c,i)=>'<th class="sortable" onclick="sortSummary('+i+')">'+c.t+(st.sortCol===i?(st.sortDir>0?' ▲':' ▼'):'')+'</th>').join('')+'</tr>';
  rows.forEach(r=>{
    const s = r.s;
    const name = st.linkNames ? '<a href="#" onclick="return quickPlayer(this.textContent)">'+esc(r.name)+'</a>' : esc(r.name);
    html += '<tr><td>'+name+'</td><td>'+esc(r.year)+'</td><td>'+s.n+'</td><td>'+s.win+'</td><td>'+(s.n-s.win)+'</td><td>'+pct(s.win,s.n)+'</td><td>'+pct(s.bwin,s.bn)+'</td><td>'+pct(s.wwin,s.wn)+'</td><td>'+s.bn+'</td><td>'+s.bwin+'</td><td>'+s.wn+'</td><td>'+s.wwin+'</td></tr>';
  });
  html += '</table></div>';
  document.getElementById('summaryArea').innerHTML = html;
}
function sortSummary(i){
  if(sumState.sortCol===i) sumState.sortDir = -sumState.sortDir;
  else { sumState.sortCol = i; sumState.sortDir = (i<=1) ? 1 : -1; }
  renderSummary();
}

function runQuery(){
  if(GAMES.length===0){ alert('目前系統裡還沒有資料'); return; }
  const f = readFilters();
  const base = baseFilter(f);
  const rangeLabel = (f.yFrom||f.yTo) ? ((f.yFrom||'')+'~'+(f.yTo||'')) : '~';
  let detailGames = [];
  const playerShown = document.getElementById('qPlayer').value.trim();
  const oppShown = document.getElementById('qOpp').value.trim();
  if(f.player){
    const games = base.filter(g=>{
      const b=norm(g.b), w=norm(g.w);
      if(b!==f.player && w!==f.player) return false;
      if(f.opp){ const other = b===f.player ? w : b; if(other!==f.opp) return false; }
      return true;
    });
    detailGames = games;
    const total = newStat(), byYear = {};
    games.forEach(g=>{ addStat(total,g,f.player); addStat(byYear[g.y]=byYear[g.y]||newStat(), g, f.player); });
    document.getElementById('resultTitle').textContent = playerShown + (f.opp ? '　對　'+oppShown : '') + '　共 '+games.length+' 局';
    if(games.length===0){
      sumState = null;
      document.getElementById('summaryArea').innerHTML = '<p class="hint">找不到符合條件的對局。棋士姓名要打完整（可以從輸入框的下拉清單選）。</p>';
    } else {
      sumState = {
        pinned: {name:playerShown, year:rangeLabel, yearSort:'0', s:total},
        rows: Object.keys(byYear).sort().reverse().map(y=>({name:playerShown, year:y, yearSort:y, s:byYear[y]})),
        sortCol:null, sortDir:1, linkNames:false
      };
      renderSummary();
    }
  } else {
    /* 沒填棋士：每一局的兩位選手各記一筆；有填對手的話，只看「跟這位對手下的」那些人 */
    const stats = {};
    const used = [];
    base.forEach(g=>{
      [[g.b,g.w],[g.w,g.b]].forEach(pair=>{
        const p = norm(pair[0]), other = norm(pair[1]);
        if(!p) return;
        if(f.opp && other!==f.opp) return;
        addStat(stats[p] = stats[p] || newStat(), g, p);
      });
      if(!f.opp || norm(g.b)===f.opp || norm(g.w)===f.opp) used.push(g);
    });
    detailGames = used;
    const names = Object.keys(stats).sort((a,b)=> stats[b].n-stats[a].n || stats[b].win-stats[a].win || a.localeCompare(b,'zh-Hant'));
    document.getElementById('resultTitle').textContent = (f.opp ? '所有跟 '+oppShown+' 下過的棋士' : '所有棋士')+'（'+names.length+' 位，點名字可以看個人戰績）';
    if(names.length===0){
      sumState = null;
      document.getElementById('summaryArea').innerHTML = '<p class="hint">找不到符合條件的對局。</p>';
    } else {
      sumState = { pinned:null, rows:names.map(n=>({name:n, year:rangeLabel, yearSort:rangeLabel, s:stats[n]})), sortCol:null, sortDir:1, linkNames:true };
      renderSummary();
    }
  }
  lastQueryGames = sortGames(detailGames.slice());
  renderDetails(f.details ? lastQueryGames : null);
  document.getElementById('resultArea').style.display = '';
  document.getElementById('resultTitle').scrollIntoView({behavior:'smooth', block:'start'});
}
const DETAIL_LIMIT = 3000;
function fmtDate(g){
  const m = String(g.d).match(/^(\d{1,2})[.\/-](\d{1,2})$/);
  return m ? g.y+'/'+m[1].padStart(2,'0')+'/'+m[2].padStart(2,'0') : (g.y+' '+g.d);
}
function renderDetails(list){
  const area = document.getElementById('detailArea');
  document.getElementById('detailTopBtn').style.display = (list && list.length) ? '' : 'none';
  if(!list || list.length===0){ area.innerHTML=''; return; }
  const shown = list.slice(0, DETAIL_LIMIT);
  let html = (list.length>DETAIL_LIMIT ? '<p class="hint">共 '+list.length.toLocaleString()+' 局，畫面只列出最新 '+DETAIL_LIMIT+' 局；全部明細請登入後用「管理功能」下載。</p>' : '');
  html += '<div class="grid-wrap"><table class="grid detail"><tr><th>日期</th><th>大類</th><th>小類</th><th>賽名</th><th>階段</th><th>執黑</th><th>執白</th><th>勝方</th><th>目數</th></tr>';
  shown.forEach(g=>{
    const bw = norm(g.win)===norm(g.b), ww = norm(g.win)===norm(g.w);
    html += '<tr><td class="small">'+fmtDate(g)+'</td><td class="small">'+esc(g.c1)+'</td><td class="small">'+esc(g.c2)+'</td><td>'+esc(g.ev)+'</td><td>'+esc(g.st)+'</td><td'+(bw?' class="win"':'')+'>'+esc(g.b)+'</td><td'+(ww?' class="win"':'')+'>'+esc(g.w)+'</td><td>'+esc(g.win)+'</td><td>'+esc(g.mv)+'</td></tr>';
  });
  html += '</table></div>';
  area.innerHTML = html;
}
function quickPlayer(name){
  document.getElementById('qPlayer').value = name;
  runQuery();
  return false;
}

/* ============ Excel 下載（功能 2、3）============
   跟舊系統一樣有兩種分頁方式：「年份-賽名」＝每年每個比賽一個分頁；「賽名」＝同一個比賽所有年份放在同一個分頁。 */
function safeSheetName(name, used){
  let s = String(name).replace(/[:\\\/?*\[\]]/g,'_').slice(0,31) || '工作表';
  let base = s, k = 2;
  while(used.has(s)){ const suf='('+(k++)+')'; s = base.slice(0,31-suf.length)+suf; }
  used.add(s);
  return s;
}
function gamesToWorkbook(list, mode){
  const wb = XLSX.utils.book_new();
  const groups = new Map();
  sortGames(list.slice()).forEach(g=>{
    const k = mode==='event' ? g.ev : g.y+'-'+g.ev;
    if(!groups.has(k)) groups.set(k, []);
    groups.get(k).push(g);
  });
  const used = new Set();
  groups.forEach((gs, k)=>{
    const aoa = [HEADERS].concat(gs.map(g=>[g.y,g.d,g.c1,g.c2,g.ev,g.st,g.b,g.w,g.win,g.mv]));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), safeSheetName(k, used));
  });
  if(groups.size===0) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([HEADERS]), '比賽資料');
  return wb;
}
function modeLabel(mode){ return mode==='event' ? '(賽名)' : '(年份-賽名)'; }
function downloadAll(mode){
  if(GAMES.length===0){ alert('目前沒有資料可以下載'); return; }
  XLSX.writeFile(gamesToWorkbook(GAMES, mode), '全部比賽資料'+modeLabel(mode)+'.xlsx');
}
function downloadRange(mode){
  const from = readDateSel('dlFrom'), to = readDateSel('dlTo');
  if(from>to){ alert('起始日期比結束日期晚，請重新選'); return; }
  const ev = norm(document.getElementById('dlEvent').value);
  const list = GAMES.filter(g=>{ const n=dateNum(g); return n>=from && n<=to && (!ev || norm(g.ev).indexOf(ev)>=0); });
  if(list.length===0){ alert('這段期間'+(ev?'、這個比賽':'')+'沒有任何對局'); return; }
  const fmt = n=>String(n);
  XLSX.writeFile(gamesToWorkbook(list, mode), fmt(from)+'~'+fmt(to)+'_比賽資料'+modeLabel(mode)+'.xlsx');
}

/* ============ Excel 上傳（功能 1）============
   每一列分成三種：新的（會匯入）、系統裡已經有（略過）、有問題（預設不匯入，可以勾選照樣匯入）。
   「有問題」的檢查：必填欄位空白、黑白同一人、勝方不是黑也不是白、目數寫的顏色跟勝方對不上、
   同一個檔案裡同一局出現兩次、年份不是四位數、日期不是「月.日」格式。 */
let pendingUpload = null;
function cellStr(v){
  if(v==null) return '';
  if(v instanceof Date) return String(v.getMonth()+1).padStart(2,'0')+'.'+String(v.getDate()).padStart(2,'0');
  return String(v).trim();
}
/* 日期欄：Excel 可能把「09.20」自動變成數字 9.2，這裡轉回「09.20」 */
function normDate(v){
  if(typeof v === 'number' && isFinite(v) && v>0 && v<13){
    const m = Math.floor(v), d = Math.round((v-m)*100);
    return String(m).padStart(2,'0')+'.'+String(d).padStart(2,'0');
  }
  const s = cellStr(v);
  const m = s.match(/^(\d{1,2})[.\/-](\d{1,2})$/);
  return m ? m[1].padStart(2,'0')+'.'+m[2].padStart(2,'0') : s;
}
function checkGame(g){
  const p = [];
  if(!g.y || !g.ev || !g.b || !g.w || !g.win) p.push('必填欄位空白');
  if(g.y && !/^\d{4}$/.test(g.y)) p.push('年份不是四位數');
  if(g.d && !/^\d{2}\.\d{2}$/.test(g.d)) p.push('日期格式不是「月.日」');
  if(g.b && g.w && norm(g.b)===norm(g.w)) p.push('黑白是同一個人');
  else if(g.win && norm(g.win)!==norm(g.b) && norm(g.win)!==norm(g.w)) p.push('勝方不是執黑也不是執白');
  else if(g.win){
    const color = g.mv.charAt(0);
    if(color==='黑' && norm(g.win)!==norm(g.b)) p.push('目數寫黑勝，勝方卻是執白');
    if(color==='白' && norm(g.win)!==norm(g.w)) p.push('目數寫白勝，勝方卻是執黑');
  }
  return p;
}
document.getElementById('upFile').addEventListener('change', async function(e){
  const file = e.target.files[0];
  if(!file) return;
  const area = document.getElementById('upPreview');
  area.innerHTML = '<p class="hint">讀取中…</p>';
  try{
    const buf = await file.arrayBuffer();
    analyzeUpload(XLSX.read(buf, {type:'array', cellDates:true}), file.name);
  }catch(err){
    console.error(err);
    area.innerHTML = '<p class="status-bad">讀不了這個檔案：'+esc(err.message||err)+'</p>';
  }
});
/* 「同一局」的判斷是照數量比對，不是只看有沒有：真的會有一天下兩盤、而且黑白一樣的情況
   （例如新人王賽循環圈、GLOBIS盃），所以系統裡有幾局同樣的，檔案裡的前幾局就算「已經有」，
   多出來的才算新的。同一個檔案裡出現第二局一樣的，先標成「有問題」讓人確認是不是真的下了兩盤。 */
function countKeys(list){
  const m = new Map();
  list.forEach(g=>{ const k = gameKey(g); m.set(k, (m.get(k)||0)+1); });
  return m;
}
function analyzeUpload(wb, fileName){
  const existingCount = countKeys(GAMES);
  const seenCount = new Map();
  const inFile = new Map();
  const items = [];
  const skippedSheets = [];
  wb.SheetNames.forEach(sn=>{
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, raw:true, defval:null});
    const hIdx = aoa.findIndex(r=>r && r.some(c=>cellStr(c)==='執黑') && r.some(c=>cellStr(c)==='執白'));
    if(hIdx<0){ if(aoa.some(r=>r && r.some(c=>c!=null && c!==''))) skippedSheets.push(sn); return; }
    const col = {};
    aoa[hIdx].forEach((c,i)=>{ const k=cellStr(c); if(HEADERS.indexOf(k)>=0 && col[k]==null) col[k]=i; });
    for(let r=hIdx+1; r<aoa.length; r++){
      const row = aoa[r];
      if(!row || row.every(c=>c==null || String(c).trim()==='')) continue;
      const get = k => col[k]==null ? '' : row[col[k]];
      const g = { y:cellStr(get('年份')).replace(/\.0$/,''), d:normDate(get('日期')), c1:cellStr(get('大類')), c2:cellStr(get('小類')), ev:cellStr(get('賽名')), st:cellStr(get('階段')), b:cellStr(get('執黑')), w:cellStr(get('執白')), win:cellStr(get('勝方')), mv:cellStr(get('目數')) };
      const it = { g, sheet:sn, rowNo:r+1, problems:checkGame(g) };
      const key = gameKey(g);
      const occ = (seenCount.get(key)||0) + 1;
      seenCount.set(key, occ);
      const firstSeen = inFile.get(key);
      if(!firstSeen) inFile.set(key, sn+' 第'+(r+1)+'列');
      if(occ <= (existingCount.get(key)||0)) it.status='exists';
      else {
        if(firstSeen) it.problems.push('跟同一個檔案裡的 '+firstSeen+' 一模一樣（真的一天下了兩盤就勾選照樣匯入）');
        it.status = it.problems.length ? 'problem' : 'new';
      }
      items.push(it);
    }
  });
  pendingUpload = { items, fileName };
  renderUploadPreview(skippedSheets);
}
let upTab = 'problem';
function renderUploadPreview(skippedSheets){
  const area = document.getElementById('upPreview');
  const items = pendingUpload.items;
  const c = {new:0, exists:0, problem:0};
  items.forEach(it=>c[it.status]++);
  if(!c.problem && upTab==='problem') upTab='new';
  let html = '<p style="margin:10px 0 4px;font-weight:700;">「'+esc(pendingUpload.fileName)+'」共 '+items.length+' 局：'+
    '<span class="pill new">新的 '+c.new+'</span> <span class="pill exists">系統裡已經有 '+c.exists+'</span> <span class="pill problem">有問題 '+c.problem+'</span></p>';
  if(skippedSheets && skippedSheets.length) html += '<p class="hint">這幾個分頁找不到「執黑／執白」欄位，已略過：'+skippedSheets.map(esc).join('、')+'</p>';
  html += '<div class="tabs">'+['problem','new','exists'].map(t=>'<button type="button" class="'+(upTab===t?'on':'')+'" onclick="upTab=\''+t+'\';renderUploadPreview()">'+({problem:'有問題',new:'新的',exists:'已經有'})[t]+'（'+c[t]+'）</button>').join('')+'</div>';
  const list = items.filter(it=>it.status===upTab).slice(0,500);
  if(list.length){
    html += '<div class="grid-wrap" style="max-height:340px;overflow:auto;margin-top:4px;"><table class="grid detail"><tr>'+(upTab==='problem'?'<th>問題</th>':'')+'<th>執黑</th><th>執白</th><th>勝方</th><th>目數</th><th>年份</th><th>日期</th><th>賽名</th><th>階段</th><th>分頁</th><th>列</th></tr>';
    list.forEach(it=>{
      const g=it.g;
      html += '<tr>'+(upTab==='problem'?'<td class="left" style="color:#c0392b;">'+esc(it.problems.join('；'))+'</td>':'')+'<td>'+esc(g.b)+'</td><td>'+esc(g.w)+'</td><td>'+esc(g.win)+'</td><td>'+esc(g.mv)+'</td><td>'+esc(g.y)+'</td><td>'+esc(g.d)+'</td><td>'+esc(g.ev)+'</td><td>'+esc(g.st)+'</td><td class="small">'+esc(it.sheet)+'</td><td>'+it.rowNo+'</td></tr>';
    });
    html += '</table></div>';
    if(items.filter(it=>it.status===upTab).length>500) html += '<p class="hint">只列出前 500 筆</p>';
  }
  html += '<div class="acts" style="margin-top:10px;">';
  if(c.problem) html += '<label style="display:flex;align-items:center;gap:5px;font-size:15px;font-weight:700;cursor:pointer;"><input type="checkbox" id="upIncludeProblem" style="width:18px;height:18px;">有問題的 '+c.problem+' 局也照樣匯入</label>';
  html += '<button type="button" class="btn" id="upConfirm" onclick="confirmUpload()"'+(c.new+c.problem===0?' disabled':'')+'>確定匯入</button>';
  html += '<button type="button" class="btn gray" onclick="cancelUpload()">取消</button><span id="upStatus" class="hint"></span></div>';
  area.innerHTML = html;
}
function cancelUpload(){
  pendingUpload = null;
  document.getElementById('upPreview').innerHTML='';
  document.getElementById('upFile').value='';
}
async function confirmUpload(){
  if(!pendingUpload) return;
  const inc = document.getElementById('upIncludeProblem');
  const includeProblem = !!(inc && inc.checked);
  const btn = document.getElementById('upConfirm'), st = document.getElementById('upStatus');
  btn.disabled = true; st.textContent = '匯入中…';
  try{
    /* 寫入前先抓一次雲端最新資料，避免蓋掉別台電腦剛上傳的內容 */
    await loadData(true);
    const existingCount = countKeys(GAMES);
    const seenCount = new Map();
    const add = [];
    pendingUpload.items.forEach(it=>{
      const k = gameKey(it.g);
      const occ = (seenCount.get(k)||0) + 1;
      seenCount.set(k, occ);
      if(occ <= (existingCount.get(k)||0)) return;   // 雲端已經有這麼多局了
      if(it.status==='new' || (it.status==='problem' && includeProblem)) add.push(it.g);
    });
    if(add.length===0){ st.textContent='沒有需要匯入的新資料'; btn.disabled=false; return; }
    GAMES = GAMES.concat(add);
    await saveYears([...new Set(add.map(g=>g.y))]);
    refreshControls();
    document.getElementById('upPreview').innerHTML = '<p class="status-ok">✅ 已匯入 '+add.length+' 局，系統裡現在共 '+GAMES.length.toLocaleString()+' 局</p>';
    document.getElementById('upFile').value='';
    pendingUpload = null;
  }catch(err){
    console.error(err);
    st.innerHTML = '<span class="status-bad">匯入失敗：'+esc(err.message||err)+'</span>';
    btn.disabled = false;
    await loadData(true).catch(()=>{});
    refreshControls();
  }
}

/* ============ 刪除（功能 5、6）============
   功能 6 跟舊系統一樣用「比賽名稱」刪（名稱要完全一樣），另外可以只刪某一年；預設「全部年份」。
   兩種刪除都要打字確認，不小心按到不會直接刪。 */
async function deleteEvent(){
  const ev = document.getElementById('delEvent').value.trim(), y = document.getElementById('delYear').value;
  if(!ev){ alert('請先輸入比賽名稱'); return; }
  const n = GAMES.filter(g=>g.ev===ev && (!y || g.y===y)).length;
  if(n===0){ alert('找不到「'+(y?y+' ':'')+ev+'」的對局，比賽名稱要完全一樣（可以從下拉清單選）'); return; }
  const what = (y ? y+' 年的' : '所有年份的') + '「'+ev+'」';
  const typed = prompt('確定要刪除'+what+'，共 '+n+' 局嗎？刪除後救不回來。\n\n請輸入比賽名稱「'+ev+'」確認：');
  if(typed===null) return;
  if(typed.trim()!==ev){ alert('輸入的比賽名稱不一樣，沒有刪除'); return; }
  const st = document.getElementById('delStatus');
  st.textContent='刪除中…';
  try{
    await loadData(true);
    const before = GAMES.length;
    const years = [...new Set(GAMES.filter(g=>g.ev===ev && (!y || g.y===y)).map(g=>g.y))];
    GAMES = GAMES.filter(g=>!(g.ev===ev && (!y || g.y===y)));
    await saveYears(years);
    refreshControls();
    st.innerHTML = '<span class="status-ok">已刪除'+esc(what)+' '+(before-GAMES.length)+' 局</span>';
  }catch(err){
    console.error(err);
    st.innerHTML = '<span class="status-bad">刪除失敗：'+esc(err.message||err)+'</span>';
    await loadData(true).catch(()=>{});
    refreshControls();
  }
}
async function deleteAll(){
  if(GAMES.length===0){ alert('系統裡已經沒有資料'); return; }
  const typed = prompt('確定要刪除系統裡「所有」比賽資料（共 '+GAMES.length+' 局）嗎？刪除後救不回來，請先用功能 3 下載備份。\n\n請輸入「刪除全部」確認：');
  if(typed===null) return;
  if(typed.trim()!=='刪除全部'){ alert('輸入的文字不一樣，沒有刪除'); return; }
  try{
    await loadData(true);
    const years = dataYears();
    GAMES = [];
    await saveYears(years);
    refreshControls();
    alert('已刪除所有比賽資料');
  }catch(err){
    console.error(err);
    alert('刪除失敗：'+(err.message||err));
    await loadData(true).catch(()=>{});
    refreshControls();
  }
}

/* ============ 登入 ============ */
function setAdmin(on, email){
  isAdmin = on;
  document.getElementById('navAdmin').style.display = on ? '' : 'none';
  document.getElementById('navLogin').style.display = (on || LOCAL_MODE) ? 'none' : '';
  document.getElementById('navLogout').style.display = (on && !LOCAL_MODE) ? '' : 'none';
  document.getElementById('welcome').textContent = '歡迎~~ ' + (on ? (LOCAL_MODE ? '本機測試' : (email||'管理者')) : '使用者');
  if(!on) showView('query');
}
function openLogin(){
  document.getElementById('loginError').textContent='';
  document.getElementById('loginModal').style.display='flex';
  document.getElementById('loginEmail').focus();
}
function closeLogin(){ document.getElementById('loginModal').style.display='none'; }
async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim(), pw = document.getElementById('loginPw').value;
  const errEl = document.getElementById('loginError'), btn = document.getElementById('loginSubmit');
  if(!email || !pw){ errEl.textContent='請輸入帳號和密碼'; return; }
  btn.disabled = true; errEl.textContent='';
  try{
    await fb.auth.signInWithEmailAndPassword(email, pw);
    document.getElementById('loginPw').value='';
    closeLogin();
    showView('admin');
  }catch(err){
    const code = err && err.code || '';
    errEl.textContent = (code.indexOf('invalid')>=0 || code.indexOf('wrong-password')>=0 || code.indexOf('user-not-found')>=0) ? '帳號或密碼不對' : ('登入失敗：'+(err.message||code));
  }finally{ btn.disabled = false; }
}
function doLogout(){ fb.auth.signOut(); }

/* ============ 啟動 ============ */
(async function init(){
  if(LOCAL_MODE){
    document.getElementById('localBanner').style.display='';
    setAdmin(true);
  } else {
    /* 用「另外取名的 Firebase app」而不是預設的那一個：成績系統跟賽程表放在同一個網站底下，
       瀏覽器會讓兩邊共用登入狀態；如果都用預設 app，在這裡登入/登出/重新整理，賽程表的分頁會收到
       「登入狀態改變」而整份重新同步、重畫所有底圖（2026-10-01 使用者實際遇到）。取了名字之後，
       登入狀態存在不同的位置，兩邊互不干擾，代價是兩邊要各自登入一次。 */
    const app = firebase.initializeApp(firebaseConfig, 'haifong-results');
    fb = { auth: app.auth(), db: app.firestore() };
    fb.auth.onAuthStateChanged(user=>setAdmin(!!user, user && user.email));
  }
  try{
    await loadData(false);
  }catch(err){
    console.error(err);
    document.getElementById('dataStatus').innerHTML = '<span class="status-bad">資料載入失敗：'+esc(err.message||err)+'（請重新整理再試一次）</span>';
    return;
  }
  refreshControls();
})();
</script>
